# content: dragon_hunter
# The Dragon Hunter (rework 2026-11-02): a combo duelist with a dragon-bone zweihander. Chains his abilities and swings
# into a combo, opens wounds that bleed, and at the top of his combo leaps in to execute.
# Format and all options: see README.md in this folder. Edit, then /ae reload.
# (The old kit, Blind Obsession / Dragon Harpoon, stays as fixtures/dragon_hunter.yml for the engine tests.)
#
# PASSIVE (Hunter's Rhythm): using an ability opens a 3s window; using another ability or a swing before it closes is a
#   combo level (5 at most; an ability opens a new window, a swing closes it). Each level: +4% speed. Levels last 6s
#   from the last one gained, then drop one a second. At 5 levels Clean Cut starts by itself. His swings (and Crescent
#   Cleave) also deal 20% spell power as magic damage.
#
# ULTIMATE (F): Clean Cut. Starts by itself at 5 combo levels (F is greyed out otherwise; 45s cooldown). For 4s pick a
#   spot (a circle, up to 12 blocks: LMB or F, or it goes where you look): he leaps there and cuts all around (3
#   blocks), then executes everyone left below 15% of their max HP. If anyone died: he's back where he cast it, the
#   cooldown is gone and his combo is full again: another 4s to pick the next spot.

statuses:
  dh_edge:                           # PASSIVE: the swings' magic edge (always on: passive_statuses)
    duration: 0
    neutral: true                    # (his own: no purge or cleanse takes it)
    on_hit:                          # his swings (and Crescent Cleave: on_hit: true) also deal...
      - { id: damage, sp: 0.2, type: magic, knockback: false, ignore_iframes: true }   # ...20% spell power, magic
  dh_combo:                          # PASSIVE: combo levels
    duration: 120                    # 6s from the last level gained...
    decay: 20                        # ...then one level a second
    stacking: stack
    max_stacks: 5
    move_speed: 1.04                 # +4% speed per level (5: +22%)
    at_max: dh_combo_full            # 5 levels: Clean Cut is ready
    neutral: true
  dh_combo_full:                     # 5 combo levels (Clean Cut's ready_while)
    duration: 120
    stacking: refresh
    requires: dh_combo
    tags: [state.dh_combo_full]
    neutral: true
  dh_combo_window:                   # PASSIVE: an ability just used, the next one (or a swing) is a combo level
    duration: 60                     # 3s
    stacking: refresh
    neutral: true
  dh_empowered:                      # Rising Fang: the next swing knocks up and marks
    duration: 80                     # 4s to use it
    stacking: refresh
    tags: [state.dh_empowered]
    cue: dh_fang_ready
    positive: false
  dh_mark:                           # Rising Fang: marked (his next hit on them opens a bleed)
    duration: 100                    # 5s
    stacking: refresh
    cue: dh_marked
  dh_bleed:                          # the mark, set off: bleeding
    duration: 80                     # 4s...
    stacking: refresh
    tags: [state.bleeding]
    cue: dh_bleeding
    tick:
      every: 10                      # ...1% of their max HP every 0.5s: 8% in all (physical)
      effects:
        - { id: damage, max_hp: 0.01, type: physical, knockback: false }
  dh_executed:                       # Clean Cut: someone died to this cut (bookkeeping)
    duration: 20
    neutral: true

abilities:

  # The combo (PASSIVE): an ability was used. A window open from before: a level. Either way a new window opens, and at
  # 5 levels Clean Cut starts (its own checks: not while it's cooling down or blocked).
  dh_combo_ability:
    display:
      name: "Hunter's Rhythm"
    nodes:
      open_before:
        type: has_status
        status: dh_combo_window
        on: { has: level, lacks: open }
      level:
        type: apply_effects
        targets: { type: self }
        on_hit: false
        effects:
          - { id: status, status: dh_combo }
        next: level_cue
      level_cue:
        type: set                    # (the chime climbs with the level: dh_combo_up_1..5)
        key: combo_level
        value: "stacks:dh_combo"
        next: level_chime
      level_chime:
        type: play_cue
        cue: dh_combo_up
        numbered_by: combo_level
        next: open
      open:
        type: apply_effects
        targets: { type: self }
        on_hit: false
        effects:
          - { id: status, status: dh_combo_window }
        next: full
      full:
        type: has_status
        status: dh_combo
        min_stacks: 5
        on: { has: mark_full }
      mark_full:
        type: apply_effects          # (still full: kept 5 levels up a while, Clean Cut may have been cooling down)
        targets: { type: self }
        on_hit: false
        effects:
          - { id: status, status: dh_combo_full }
        next: cut
      cut:
        type: cast
        ability: dh_ult

  # The combo (PASSIVE): a swing. A window open: a level, and the window closes (only an ability opens one).
  dh_combo_basic:
    display:
      name: "Hunter's Rhythm"
    nodes:
      open_before:
        type: has_status
        status: dh_combo_window
        on: { has: level }
      level:
        type: apply_effects
        targets: { type: self }
        on_hit: false
        effects:
          - { id: status, status: dh_combo }
          - { id: remove_status, status: dh_combo_window }
        next: level_cue
      level_cue:
        type: set                    # (the chime climbs with the level: dh_combo_up_1..5)
        key: combo_level
        value: "stacks:dh_combo"
        next: level_chime
      level_chime:
        type: play_cue
        cue: dh_combo_up
        numbered_by: combo_level
        next: full
      full:
        type: has_status
        status: dh_combo
        min_stacks: 5
        on: { has: mark_full }
      mark_full:
        type: apply_effects          # (still full: kept 5 levels up a while, Clean Cut may have been cooling down)
        targets: { type: self }
        on_hit: false
        effects:
          - { id: status, status: dh_combo_full }
        next: cut
      cut:
        type: cast
        ability: dh_ult

  # PRIMARY (LMB): Zweihander Swing. A heavy swing at the first enemy in reach (2.8 blocks): 100% base damage (physical)
  # + the passive's 20% spell power (magic). After Rising Fang: it knocks them up and marks them, and Crescent Cleave is
  # ready again. A marked enemy hit by anything of his starts bleeding.
  dh_primary:
    cooldown: 20                     # (the attack_speed stat sets it)
    display:
      name: "Zweihander Swing"
      description:
        - "A heavy swing (2.8 blocks):"
        - "{base:1.0|physical} + {sp:0.2|magic}."
    nodes:
      rhythm:
        type: cast                   # the combo: a swing
        ability: dh_combo_basic
        free: true
        next: reach
      reach:
        type: acquire_target
        query: { type: hitscan, range: 2.8, ray_size: 0.8, angle: 30 }   # (missed: the nearest within 15 degrees)
        on: { hit: bleed, miss: whiff }
      bleed:
        type: apply_effects          # marked: the mark opens a bleed
        targets: { type: key, key: target, with_status: dh_mark }
        on_hit: false
        effects:
          - { id: remove_status, status: dh_mark }
          - { id: status, status: dh_bleed }
        count: opened
        next: opened_cue
      opened_cue:
        type: switch
        key: opened
        on: { "0": which, default: open_wound }
      open_wound:
        type: play_cue
        cue: dh_bleed_open
        at: target
        next: which
      which:
        type: has_tag                # after Rising Fang: this one knocks up
        tag: state.dh_empowered
        on: { has: fang, lacks: swing }
      swing:
        type: apply_effects
        targets: { type: key, key: target }
        effects:
          - { id: damage, base: 1.0, type: physical, knockback: false }
          - { id: knockback, from: caster, radius: 3, center: 0.3, edge: 0.3, lift: 0.1 }   # a little
        next: swing_cue
      swing_cue:
        type: play_cue
        cue: dh_swing
        at: target
      fang:
        type: apply_effects          # Rising Fang's swing: knocked up and marked
        targets: { type: key, key: target }
        effects:
          - { id: damage, base: 1.0, type: physical, knockback: false }
          - { id: launch, up: 0.85 }
          - { id: status, status: dh_mark }
          - { id: remove_status, status: dh_empowered, self: true }
        next: fang_cue
      fang_cue:
        type: play_cue
        cue: dh_fang
        at: target
        next: cleave_back
      cleave_back:
        type: reset_cooldowns        # it landed: Crescent Cleave is ready again
        slots: [ability_1]
      whiff:
        type: play_cue
        cue: dh_whiff

  # 1: Crescent Cleave (6s). A forward slash in a half circle (4 blocks): 110% base damage (physical), plus your on-hit
  # effects (the passive's 20% spell power, items...). Marked enemies start bleeding.
  dh_ab1:
    cooldown: 120                    # 6s
    display:
      name: "Crescent Cleave"
      icon: QUARTZ
      description:
        - "Slash a half circle in front of you (4"
        - "blocks): {base:1.1|physical}, with your"
        - "on-hit effects."
    nodes:
      rhythm:
        type: cast                   # the combo: an ability
        ability: dh_combo_ability
        free: true
        next: bleed
      bleed:
        type: apply_effects          # the marked ones in it: the mark opens a bleed
        targets: { type: cone, range: 4, angle: 180, with_status: dh_mark }
        on_hit: false
        effects:
          - { id: remove_status, status: dh_mark }
          - { id: status, status: dh_bleed }
        next: cleave
      cleave:
        type: apply_effects
        targets: { type: cone, range: 4, angle: 180 }   # (the cue's half circle: 4)
        on_hit: true                 # its on-hit effects, like a swing
        effects:
          - { id: damage, base: 1.1, type: physical, knockback: false }
        next: cleave_cue
      cleave_cue:
        type: play_cue
        cue: dh_crescent
        at: caster
        to: aim                      # (a line cue: the half circle faces where he aims)

  # 2: Dragon's Wake (10s). Dash forward (6 blocks, through enemies), then slash all around you as you arrive (3.5
  # blocks): 90% base damage (physical). For 1.5s after the dash your blade keeps whirling: enemy projectiles that reach
  # you are cut down. Marked enemies start bleeding.
  dh_ab2:
    cooldown: 200                    # 10s
    display:
      name: "Dragon's Wake"
      icon: PHANTOM_MEMBRANE
      description:
        - "Dash forward (6 blocks) and slash around"
        - "you (3.5 blocks): {base:0.9|physical}."
        - "1.5s after: your blade cuts down enemy"
        - "projectiles that reach you."
    nodes:
      rhythm:
        type: cast                   # the combo: an ability
        ability: dh_combo_ability
        free: true
        next: dash_cue
      dash_cue:
        type: play_cue
        cue: dh_dash
        next: dash
      dash:
        type: dash
        flat: true
        speed: 1.2
        range: 6
        pierce: true                 # through enemies
        on: { miss: bleed, wall: bleed }
      bleed:
        type: apply_effects          # the marked ones around: the mark opens a bleed
        targets: { type: radius, radius: 3.5, with_status: dh_mark }
        on_hit: false
        effects:
          - { id: remove_status, status: dh_mark }
          - { id: status, status: dh_bleed }
        next: slash
      slash:
        type: apply_effects
        targets: { type: radius, radius: 3.5 }   # (the cue's ring: 3.5)
        effects:
          - { id: damage, base: 0.9, type: physical, knockback: false }
        next: slash_cue
      slash_cue:
        type: play_cue
        cue: dh_wake_slash
        next: blades
      blades:
        type: start_cue              # the blade whirling round him for the 1.5s
        cue: dh_blade_whirl
        next: guard
      guard:
        type: barrier                # enemy projectiles that reach him (from any side) are cut down
        around: true
        projectiles_only: true
        radius: 1.6
        on: { absorbed: parried, out: hold }
      parried:
        type: play_cue
        cue: dh_parry
        at: absorbed_at
      hold:
        type: delay                  # ab2.guard: 1.5s
        ticks: 30

  # 3: Rising Fang (8s). Your next swing is ready at once (within 4s) and empowered: it knocks the target up and marks
  # them; your next hit on a marked enemy (a swing, Crescent Cleave, Dragon's Wake) makes them bleed: 8% of their max HP
  # over 4s (physical). If the empowered swing lands, Crescent Cleave is ready again.
  dh_ab3:
    cooldown: 160                    # 8s
    display:
      name: "Rising Fang"
      icon: PRISMARINE_SHARD
      description:
        - "Your next swing is ready and knocks the"
        - "target up, marking them. Your next hit on"
        - "a marked enemy: bleed {max_hp:0.08|physical}"
        - "over 4s. Landing it resets Crescent Cleave."
    nodes:
      rhythm:
        type: cast                   # the combo: an ability
        ability: dh_combo_ability
        free: true
        next: ready
      ready:
        type: reset_cooldowns        # the next swing, at once...
        slots: [primary]
        next: empower
      empower:
        type: apply_effects          # ...and it knocks up
        targets: { type: self }
        on_hit: false
        effects:
          - { id: status, status: dh_empowered }
        next: empower_cue
      empower_cue:
        type: play_cue
        cue: dh_fang_cast

  # ULTIMATE (F): Clean Cut (see the top of this file).
  dh_ult:
    cooldown: 900                    # ult.cooldown: 45s (its own: it doesn't charge up, the combo makes it ready)
    ult_charge: false
    ready_while: state.dh_combo_full # only at 5 combo levels (it starts by itself then: greyed out otherwise)
    cooldown_starts: manual          # (spent when he leaps: not picking a spot costs nothing but the combo)
    active_tags: [state.dh_cutting]
    blocked_by: [block.ability, state.dh_cutting]   # (one at a time: more combo levels meanwhile don't start another)
    display:
      name: "Clean Cut"
      icon: NETHERITE_SWORD
      description:
        - "At 5 combo levels: 4s to pick a spot"
        - "(12 blocks). Leap there and cut around you"
        - "(3 blocks): {base:1.6|physical}, then execute"
        - "everyone below 15% max HP. A kill: back to"
        - "where you cast it, the cooldown and your"
        - "combo refreshed: pick again."
    nodes:
      from:
        type: remember_spot          # where he cast it: a kill brings him back here
        of: caster
        store: cut_from
        next: ready_cue
      ready_cue:
        type: play_cue
        cue: dh_cut_ready
        audience: caster
        next: pick
      pick:
        type: choose_spot            # 4s: LMB or F picks the spot (or where he looks when time's up)
        range: 12
        radius: 3                    # (the cut's reach)
        timeout: 80                  # ult.choose_time: 4s
        key_confirms: true
        store: cut_at
        on: { out: spend, none: fizzle, cancelled: fizzle }
      spend:
        type: start_cooldown         # used: the cooldown starts, the combo is spent
        restart: true
        next: spend_combo
      spend_combo:
        type: apply_effects
        targets: { type: self }
        on_hit: false
        effects:
          - { id: remove_status, status: dh_combo }
          - { id: remove_status, status: dh_combo_full }
          - { id: remove_status, status: dh_combo_window }
        next: leap_cue
      leap_cue:
        type: play_cue
        cue: dh_cut_leap
        next: leap
      leap:
        type: fly_to                 # a leap to the spot
        to: cut_at
        ticks: 10
        height: 3
        next: cut
      cut:
        type: apply_effects
        targets: { type: radius, center: cut_at, radius: 3 }   # (the cue's ring: 3)
        effects:
          - { id: damage, base: 1.6, type: physical, knockback: false }
        count_kills: cut_kills
        next: cut_cue
      cut_cue:
        type: play_cue
        cue: dh_clean_cut
        at: cut_at
        next: cut_killed
      cut_killed:
        type: switch                 # the cut itself killed someone: that counts too
        key: cut_kills
        on: { "0": execute, default: killed }
      killed:
        type: apply_effects
        targets: { type: self }
        on_hit: false
        effects:
          - { id: status, status: dh_executed }
        next: execute
      execute:
        type: for_each               # everyone still standing in it...
        query: { type: radius, center: cut_at, radius: 3 }
        store: victim
        on: { each: low, out: verdict, none: verdict }
      low:
        type: health_below           # ...below 15% of their max HP...
        target: victim
        share: 0.15                  # ult.execute_below
        on: { below: behead }
      behead:
        type: apply_effects          # ...is executed (all of it, true damage)
        targets: { type: key, key: victim }
        effects:
          - { id: damage, max_hp: 1.0, type: true, knockback: false, ignore_iframes: true }
          - { id: status, status: dh_executed, self: true }
        next: behead_cue
      behead_cue:
        type: play_cue
        cue: dh_execute
        at: victim
      verdict:
        type: has_status             # anyone died: again
        status: dh_executed
        on: { has: again, lacks: over }
      again:
        type: apply_effects
        targets: { type: self }
        on_hit: false
        effects:
          - { id: remove_status, status: dh_executed }
          - { id: status, status: dh_combo, stacks: 5 }   # the combo full again
        next: return_cue
      return_cue:
        type: play_cue
        cue: dh_cut_return
        next: back
      back:
        type: fly_to                 # back where he cast it
        to: cut_from
        ticks: 8
        height: 2
        next: refresh
      refresh:
        type: reset_cooldowns        # the cooldown is gone (the next leap starts it again)
        slots: [ultimate]
        next: ready_cue
      fizzle:
        type: apply_effects          # no spot (RMB): the combo is spent, the cooldown isn't
        targets: { type: self }
        on_hit: false
        effects:
          - { id: remove_status, status: dh_combo }
          - { id: remove_status, status: dh_combo_full }
        next: over
      over:
        type: end_cast

characters:
  dragon_hunter:
    name: "Dragon Hunter"
    weapon: BONE                     # the dragon-bone zweihander
    stats:                           # see docs/character-stats.md
      health: 230                    # max HP
      armor: 20                      # damage taken x 100 / (100 + armor)
      base_damage: 42                # abilities deal % of this
      move_speed: 1.0                # x vanilla walking speed
      attack_speed: 0.9              # heavy swings per second
    passive_statuses: [dh_edge]      # PASSIVE: the swings' magic edge
    status_bar: { status: dh_combo, fill: stacks }   # XP bar: combo levels (the number) out of 5
    passive:                         # explained in hotbar slot 9 (or on the weapon when slot 9 is taken)
      name: "Hunter's Rhythm"
      icon: BLAZE_POWDER
      description:
        - "An ability opens a 3s window: another"
        - "ability or a swing in it is a combo level"
        - "(5 at most; +4% speed each). At 5, Clean"
        - "Cut starts. Swings also deal"
        - "{sp:0.2|magic}."
    slots:
      primary: dh_primary            # LMB: Zweihander Swing (no RMB)
      ability_1: dh_ab1              # 1: Crescent Cleave
      ability_2: dh_ab2              # 2: Dragon's Wake
      ability_3: dh_ab3              # 3: Rising Fang
      ultimate: dh_ult               # F: Clean Cut (starts by itself at 5 combo levels)
