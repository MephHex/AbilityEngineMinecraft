# content: amethyst
# The Amethyst (Shard): a crystal fighter of preparation, positioning and geometry. Her shards fly, hang in the air
# where they end, and come back through everyone in the way; she charges volleys that shatter, and bursts a prism into
# a fan of shards.
# Format and all options: see README.md in this folder. Edit, then /ae reload.
#
# PASSIVE (Piercing Shards): 6 shards of ammo (hotbar slot 9) and very fast shots (attack speed 4.5: a 4-tick cooldown,
#   so 5 a second). Her basic attacks are regular shards (80% base damage to the first enemy hit). Some abilities make
#   them PIERCING shards: through every enemy (80% to the first, 50% to each behind it), on to where they end (their
#   range, the ground, a wall), and they hang there, bobbing, for 7s (6 at most). Recall (3) brings piercing shards back
#   through everyone on the way, into the ammo; one that fades on its own is gone. Their on-hit effects land going out
#   and coming back. The ammo also refills by itself, a shard every 3s. Out of ammo, her shots are plain and much
#   slower (about 1.5 a second) until she has some again.
#
# ULTIMATE (F): Prismatic Burst (charges up from hits, see config.yml ultimate-charge).

statuses:
  amethyst_shard_slow:               # Recall: slowed, more with every shard that hit them
    duration: 40                     # 2s
    stacking: stack
    max_stacks: 6
    move_speed: 0.75                 # x0.75 per shard: 6 shards = x0.18

  amethyst_bleed:                    # Recall: bleeding (less healing, weaker, and it hurts)
    duration: 60                     # 3s...
    stacking: refresh
    healing_taken: 0.6               # 40% less healing
    damage_dealt: 0.85               # -15% damage dealt
    tags: [state.bleeding]
    tick:
      every: 20                      # ...2.5% of their max HP a second = 7.5% (ignores armor)
      effects:
        - { id: damage, max_hp: 0.025, knockback: false }

  amethyst_recalled:                 # Recall: how many shards of this Recall hit them already (each does 5% less)
    duration: 40                     # 2s: gone before the next Recall (5s)
    stacking: stack
    max_stacks: 20
    positive: false

  amethyst_drained:                  # out of ammo: much slower shots
    duration: 30                     # (kept on by every shot without ammo; a shot with ammo ends it)
    stacking: refresh
    attack_speed: 0.3                # 5 a second -> ~1.5 (4 ticks -> 13)
    positive: false

  amethyst_rush:                     # Shard Rush: faster shots and feet
    duration: 80                     # 4s
    stacking: refresh
    attack_speed: 1.4                # +40% attack speed
    move_speed: 1.25                 # +25% movement speed
    tags: [buff.shard_rush]
    cue: amethyst_gem_trail          # gems glinting behind her
    positive: false                  # (hers: a tether doesn't copy it)

  amethyst_piercing:                 # Shard Rush: the next basic attacks are piercing shards (stacks = shots left)
    duration: 200                    # 10s to use them
    stacking: stack
    max_stacks: 4
    positive: false

  amethyst_volley_charging:          # Crystal Volley: charging (stacks = shards in the volley: 6, +1 per hit taken, 10 at most)
    duration: 60                     # (taken off when it's loosed: 2s of charge at most)
    stacking: stack
    max_stacks: 10
    damage_taken: 0.7                # 30% less damage taken while charging
    tags: [state.volley_charging, block.move]   # rooted in place
    on_damaged:                      # every hit taken: one more shard
      - { id: status, status: amethyst_volley_charging }
    cue: amethyst_volley_ring        # the shards circling her (amethyst_volley_ring_6 ... _10: one per stack)
    cue_per_stack: true
    positive: false

  amethyst_prism_charging:           # Prismatic Burst: charging (LMB or F again looses it)
    duration: 30
    tags: [state.prism_charging]
    cue: amethyst_prism_charge
    positive: false

abilities:

  # PRIMARY (LMB): Amethyst Shard. A quick shard (1.6 blocks/tick, 20 blocks) that costs a shard of ammo: 80% base
  # damage to the first enemy it hits. With piercing shards ready (Shard Rush), it goes through every enemy (80% to the
  # first, 50% to each behind it) and hangs where it ends (its full range, the ground, a wall) for 7s (6 at most: one
  # more ends the oldest), to be recalled.
  # Out of ammo: a plain shard (18 blocks, 75% base damage) at about 1.5 a second.
  amethyst_primary:
    cooldown: 4                      # (the attack_speed stat sets it)
    display:
      name: "Amethyst Shard"
      description:
        - "Fast shards: 80% base damage. 6 shards"
        - "of ammo (+1 every 3s). Piercing shards"
        - "(Shard Rush, Prismatic Burst) go through"
        - "everyone (50% behind the first) and hang"
        - "7s where they end: 3 recalls them."
        - "Out of ammo: plain, slower shards (75%)."
    nodes:
      load:
        type: spend                  # a shard of ammo...
        resource: ammo
        on: { out: steady, empty: dry }
      steady:
        type: apply_effects          # (with ammo: full speed again)
        targets: { type: self }
        on_hit: false
        effects:
          - { id: remove_status, status: amethyst_drained }
        next: kind
      kind:
        type: has_status             # a piercing shard ready (Shard Rush)?
        status: amethyst_piercing
        on: { has: pierce_use, lacks: regular }
      pierce_use:
        type: apply_effects          # one of them used
        targets: { type: self }
        on_hit: false
        effects:
          - { id: remove_status, status: amethyst_piercing, stacks: 1 }
        next: shoot
      regular:
        type: projectile             # a regular shard: the first enemy it hits
        speed: 1.6
        size: 0.4
        range: 20
        lifetime: 20
        visual: AMETHYST_SHARD
        visual_size: 0.6
        face_flight: true
        on: { spawned: shoot_cue, hit_entity: first, hit_block: shatter }
      shoot:
        type: projectile             # a piercing shard: through everyone, then it hangs where it ends
        speed: 1.6
        size: 0.4
        range: 20
        lifetime: 20
        pierce: 10
        visual: AMETHYST_SHARD
        visual_size: 0.75
        face_flight: true
        store: shard
        on: { spawned: shoot_cue, hit_entity: which, hit_block: linger, expired: linger }   # the ground or a wall: it stays there
      shoot_cue:
        type: play_cue
        cue: amethyst_shard_shot
        next: last
      last:
        type: spend                  # that was the last one: slow from the next shot on
        resource: ammo
        peek: true
        on: { out: ~, empty: drain }
      drain:
        type: apply_effects
        targets: { type: self }
        on_hit: false
        effects:
          - { id: status, status: amethyst_drained }
      which:
        type: switch                 # the first enemy it hits, or one behind it
        key: hit_index
        on: { "0": first, default: behind }
      first:
        type: apply_effects
        targets: { type: key, key: hit }
        effects:
          - { id: damage, base: 0.8, ignore_iframes: true, knockback: false }   # (no knockback: her shots don't push)
        next: hit_cue
      behind:
        type: apply_effects
        targets: { type: key, key: hit }
        effects:
          - { id: damage, base: 0.5, ignore_iframes: true, knockback: false }
        next: hit_cue
      hit_cue:
        type: play_cue
        cue: amethyst_shard_hit
        at: hit
      shatter:
        type: play_cue
        cue: amethyst_shard_hit
        at: hit
      linger:
        type: construct              # it hangs where it ended (its range, the ground, a wall), until Recall (or 7s)
        at: shard
        height: 0
        size: 0.4
        fuse: 140                    # 7s from when it starts hanging (each its own: they hang as they arrive)
        solid: false                 # (nothing bumps into it)
        limit: 6                     # 6 at most at once: one more ends the oldest
        visual: "hover:glow:AMETHYST_SHARD"   # standing upright in the air, bobbing gently; glowing for her only
        cue: amethyst_shard_linger
        cue_every: 10
        on: { triggered: recall, fuse: fade }
      fade:
        type: play_cue               # it fades on its own: gone (only Recall brings shards back)
        cue: amethyst_shard_fade
        at: construct
      recall:
        type: projectile             # Recall: it flies back to her, through every enemy in the way (to where she is
        from: construct              # NOW: it follows her)
        toward: caster
        motion:
          - { type: homing, key: caster, turn: 1.0 }
        speed: 1.5
        size: 0.5
        lifetime: 40
        pierce: 20
        hits_caster: true            # (caught: it's back)
        visual: AMETHYST_SHARD
        visual_size: 0.6
        face_flight: true
        on: { hit_entity: back, hit_block: restock, expired: restock }
      back:
        type: is_ally                # her (it's back), or an enemy on the way
        target: hit
        on: { ally: caught, enemy: rend }
      caught:
        type: play_cue
        cue: amethyst_shard_caught
        next: restock
      restock:
        type: refill                 # back in the ammo
        resource: ammo
        amount: 1
        next: restocked
      restocked:
        type: apply_effects          # (some ammo again: full speed)
        targets: { type: self }
        on_hit: false
        effects:
          - { id: remove_status, status: amethyst_drained }
      rend:
        type: apply_effects          # per shard: 5% less for every shard of this Recall that hit them already (10% at least)
        targets: { type: key, key: hit }
        on_hit: true                 # on-hit effects coming back too
        effects:
          - { id: damage, base: 1, ignore_iframes: true, knockback: false,
              falloff: { status: amethyst_recalled, per_stack: 0.05, min: 0.1 } }
          - { id: status, status: amethyst_recalled }
          - { id: status, status: amethyst_shard_slow }
          - { id: status, status: amethyst_bleed }
        next: rend_cue
      rend_cue:
        type: play_cue
        cue: amethyst_recall_hit
        at: hit
      dry:
        type: apply_effects          # out of ammo: slow from now on...
        targets: { type: self }
        on_hit: false
        effects:
          - { id: status, status: amethyst_drained }
        next: plain
      plain:
        type: projectile             # ...and a plain shard
        speed: 1.6
        size: 0.35
        range: 18
        lifetime: 14
        visual: AMETHYST_SHARD
        visual_size: 0.45
        face_flight: true
        on: { spawned: shoot_cue_dry, hit_entity: plain_hit, hit_block: shatter }
      shoot_cue_dry:
        type: play_cue
        cue: amethyst_shard_shot
      plain_hit:
        type: apply_effects
        targets: { type: key, key: hit }
        effects:
          - { id: damage, base: 0.75, knockback: false }
        next: hit_cue

  # 1: Shard Rush (9s). 4s of +40% attack speed and +25% movement speed, and your next 4 basic attacks (within 10s) are
  # piercing shards. +4 shards of ammo to fire them with.
  amethyst_ab1:
    cooldown: 180                    # 9s
    display:
      name: "Shard Rush"
      icon: AMETHYST_CLUSTER
      description:
        - "4s: +40% attack speed, +25% speed."
        - "Your next 4 shots are piercing shards"
        - "(through everyone; they hang where they"
        - "end, for Recall). +4 ammo."
    nodes:
      rush_cue:
        type: play_cue
        cue: amethyst_gem_rush
        next: rush
      rush:
        type: apply_effects
        targets: { type: self }
        on_hit: false
        effects:
          - { id: status, status: amethyst_rush }
          - { id: remove_status, status: amethyst_piercing }   # (a fresh 4)
          - { id: status, status: amethyst_piercing }
          - { id: status, status: amethyst_piercing }
          - { id: status, status: amethyst_piercing }
          - { id: status, status: amethyst_piercing }
          - { id: remove_status, status: amethyst_drained }
        next: gems
      gems:
        type: refill                 # 4 shards to fire them with
        resource: ammo
        amount: 4

  # 2: Crystal Volley (10s). Root yourself and charge a volley of 6 shards (up to 2s), taking 30% less damage meanwhile;
  # every hit you take adds a shard (10 at most). LMB (or 2 again) looses it early; at 2s it goes by itself. The volley
  # flies (1.8 blocks/tick, 24 blocks) and shatters on the first enemy or wall it hits: the enemy hit takes 80% base
  # damage, and its shards burst onward in a 100 degree fan (off a wall: back the way it came), 45% base damage to every
  # enemy each passes through (7 blocks).
  amethyst_ab2:
    cooldown: 200                    # 10s
    display:
      name: "Crystal Volley"
      icon: BUDDING_AMETHYST
      description:
        - "Root yourself and charge a volley of 6"
        - "shards (30% less damage taken; +1 shard"
        - "per hit taken, 10 at most). LMB or 2"
        - "looses it: it shatters on what it hits"
        - "(80%) into a fan of shards (45% each)."
    nodes:
      gather:
        type: apply_effects          # 6 shards, circling her; rooted, guarded
        targets: { type: self }
        on_hit: false
        effects:
          - { id: status, status: amethyst_volley_charging }
          - { id: status, status: amethyst_volley_charging }
          - { id: status, status: amethyst_volley_charging }
          - { id: status, status: amethyst_volley_charging }
          - { id: status, status: amethyst_volley_charging }
          - { id: status, status: amethyst_volley_charging }
        next: gather_cue
      gather_cue:
        type: play_cue
        cue: amethyst_gather
        next: charge
      charge:
        type: charge                 # up to 2s: LMB or 2 again looses it, or it goes by itself
        ticks: 40
        on: { out: count, early: count }
      count:
        type: set                    # how many it gathered (they shatter out of it when it lands)
        key: shards
        value: stacks:amethyst_volley_charging
        next: loose
      loose:
        type: apply_effects          # free to move again
        targets: { type: self }
        on_hit: false
        effects:
          - { id: remove_status, status: amethyst_volley_charging }
        next: volley
      volley:
        type: projectile
        speed: 1.8
        size: 0.7
        range: 24
        lifetime: 20
        visual: AMETHYST_CLUSTER
        visual_size: 0.9
        face_flight: true
        on: { spawned: volley_cue, hit_entity: impact, hit_block: shatter_back }
      volley_cue:
        type: play_cue
        cue: amethyst_volley_shot
      impact:
        type: apply_effects          # the one it hits
        targets: { type: key, key: hit }
        effects:
          - { id: damage, base: 0.8, knockback: false }
        next: shatter_on
      shatter_on:
        type: projectile             # ...and its shards burst on, through them, fanning out
        from: hit
        heading: flight
        count_bonus: shards
        fan: 100
        speed: 1.4
        size: 0.35
        range: 7
        lifetime: 10
        pierce: 10
        visual: AMETHYST_SHARD
        visual_size: 0.5
        face_flight: true
        on: { spawned: shatter_cue, hit_entity: splinter }
      shatter_back:
        type: projectile             # off a wall: the shards burst back the way it came
        from: hit
        heading: back
        count_bonus: shards
        fan: 100
        speed: 1.4
        size: 0.35
        range: 7
        lifetime: 10
        pierce: 10
        visual: AMETHYST_SHARD
        visual_size: 0.5
        face_flight: true
        on: { spawned: shatter_cue, hit_entity: splinter }
      shatter_cue:
        type: play_cue
        cue: amethyst_burst
        at: hit
      splinter:
        type: apply_effects
        targets: { type: key, key: hit }
        effects:
          - { id: damage, base: 0.45, ignore_iframes: true, knockback: false }
        next: splinter_cue
      splinter_cue:
        type: play_cue
        cue: amethyst_shard_hit
        at: hit

  # LMB while charging Crystal Volley: loose it.
  amethyst_volley_loose:
    blocked_by: []
    display:
      name: "Loose the Volley"
      description:
        - "LMB: loose the volley now."
    nodes:
      go:
        type: release_charge
        ability: amethyst_ab2

  # 3: Recall (5s). Only with piercing shards out (its icon counts them; greyed out with none). Shards still flying stop
  # where they are, and every one (hanging or just stopped, from shots and from Prismatic Burst) flies back to you, each
  # back in your ammo, through enemies on the way: each shard that hits deals 100% base damage, 5% less for each shard of
  # this Recall that hit the same enemy before it (100, 95, 90... down to 10%), with your on-hit effects; it slows them
  # more (x0.75 a shard, 2s), and they bleed for 3s (40% less healing, -15% damage, 7.5% of their max HP over the 3s).
  amethyst_recall:
    cooldown: 100                    # 5s
    needs_constructs: [amethyst_primary, amethyst_ult1]   # only with shards out: the icon counts them, grey with none
    also_flying: shoot               # (shards still flying count too: Recall stops them mid-flight)
    display:
      name: "Recall"
      icon: SMALL_AMETHYST_BUD
      description:
        - "Every hanging shard flies back to you"
        - "(and your ammo). Each that hits: 100%"
        - "base damage, 5% less per shard that hit"
        - "them before (to 10%), a stronger slow;"
        - "they bleed 3s (7.5% max HP)."
    nodes:
      stop:
        type: end_projectiles        # shards still flying stop right where they are (and hang there)...
        ability: amethyst_primary
        node: shoot                  # (not the regular or plain ones)
        next: stop_burst
      stop_burst:
        type: end_projectiles        # (Prismatic Burst's shards too)
        ability: amethyst_ult1
        node: shoot
        next: call
      call:
        type: set_off_constructs     # ...and every hanging shard comes back
        ability: amethyst_primary
        center: caster
        radius: 60
        next: call_burst
      call_burst:
        type: set_off_constructs
        ability: amethyst_ult1
        center: caster
        radius: 60
        next: call_cue
      call_cue:
        type: play_cue
        cue: amethyst_recall

  # ULTIMATE (F): Prismatic Burst. Charge a crystal prism (up to 1.5s; LMB or F again fires it early, at full it goes by
  # itself) and fire it (1.6 blocks/tick, 30 blocks). On the first enemy it hits: they're rooted 0.75s but take no
  # impact damage; the prism shatters behind them, 180% base damage (with your on-hit effects) to everyone in a 7 block,
  # 70 degree cone onward (60% of it fired at once, all of it fully charged), and 6 piercing shards fly out of it in an
  # even 60 degree fan (9 blocks, through everyone: 80% to the first, 50% behind) and hang where they end, for Recall
  # (they go into your ammo). On a wall: the cone doesn't reach through it, the shards still fly.
  amethyst_ult1:
    cooldown: 1200                   # (unused while ultimates charge up: config.yml ultimate-charge)
    display:
      name: "Prismatic Burst"
      icon: AMETHYST_BLOCK
      description:
        - "Charge and fire a prism. The enemy hit"
        - "is rooted (no damage); it shatters"
        - "behind them: 180% base damage in a cone"
        - "(on-hits), and 6 piercing shards fan out"
        - "and hang, for Recall."
    nodes:
      begin:
        type: apply_effects
        targets: { type: self }
        on_hit: false
        effects:
          - { id: status, status: amethyst_prism_charging }
        next: charge
      charge:
        type: charge                 # up to 1.5s (the power: 0.6 at once, 1 full)
        ticks: 30
        from: 0.6
        store: power
        on: { out: release, early: release }
      release:
        type: apply_effects
        targets: { type: self }
        on_hit: false
        effects:
          - { id: remove_status, status: amethyst_prism_charging }
        next: fire
      fire:
        type: projectile
        speed: 1.6
        size: 0.7
        range: 30
        lifetime: 30
        visual: AMETHYST_BLOCK
        visual_size: 0.8
        face_flight: true
        on: { spawned: fire_cue, hit_entity: snare, hit_block: burst_wall }
      fire_cue:
        type: play_cue
        cue: amethyst_prism_shot
      snare:
        type: apply_effects          # briefly held, no impact damage
        targets: { type: key, key: hit }
        on_hit: false
        effects:
          - { id: status, status: root, duration: 15 }
        next: burst
      burst:
        type: apply_effects          # shattering behind them, onward
        targets: { type: cone, from: hit, heading: flight, ahead: 0.6, range: 7, angle: 70, sight: true }
        on_hit: true
        effects:
          - { id: damage, base: 1.8, scale_by: power }
        next: burst_cue
      burst_wall:
        type: apply_effects          # on a wall: not through it
        targets: { type: cone, from: hit, heading: flight, ahead: -0.4, range: 7, angle: 70, sight: true }
        on_hit: true
        effects:
          - { id: damage, base: 1.8, scale_by: power }
        next: burst_cue
      burst_cue:
        type: play_cue
        cue: amethyst_shatter
        at: hit
        next: shoot
      shoot:
        type: projectile             # 6 piercing shards, an even fan, onward
        from: hit
        heading: flight
        count: 6
        fan: 60
        speed: 1.3
        size: 0.4
        range: 9
        lifetime: 14
        pierce: 10
        visual: AMETHYST_SHARD
        visual_size: 0.75
        face_flight: true
        store: shard
        on: { hit_entity: which, hit_block: linger, expired: linger }
      which:
        type: switch
        key: hit_index
        on: { "0": first, default: behind }
      first:
        type: apply_effects
        targets: { type: key, key: hit }
        effects:
          - { id: damage, base: 0.8, ignore_iframes: true, knockback: false }
        next: hit_cue
      behind:
        type: apply_effects
        targets: { type: key, key: hit }
        effects:
          - { id: damage, base: 0.5, ignore_iframes: true, knockback: false }
        next: hit_cue
      hit_cue:
        type: play_cue
        cue: amethyst_shard_hit
        at: hit
      linger:
        type: construct              # it hangs where it ended, like a piercing shard, until Recall (or 7s)
        at: shard
        height: 0
        size: 0.4
        fuse: 140
        solid: false
        limit: 6
        visual: "hover:glow:AMETHYST_SHARD"
        cue: amethyst_shard_linger
        cue_every: 10
        on: { triggered: recall, fuse: fade }
      fade:
        type: play_cue
        cue: amethyst_shard_fade
        at: construct
      recall:
        type: projectile             # Recall: back to her, through every enemy in the way
        from: construct
        toward: caster
        motion:
          - { type: homing, key: caster, turn: 1.0 }
        speed: 1.5
        size: 0.5
        lifetime: 40
        pierce: 20
        hits_caster: true
        visual: AMETHYST_SHARD
        visual_size: 0.6
        face_flight: true
        on: { hit_entity: back, hit_block: restock, expired: restock }
      back:
        type: is_ally
        target: hit
        on: { ally: caught, enemy: rend }
      caught:
        type: play_cue
        cue: amethyst_shard_caught
        next: restock
      restock:
        type: refill                 # into the ammo
        resource: ammo
        amount: 1
        next: restocked
      restocked:
        type: apply_effects
        targets: { type: self }
        on_hit: false
        effects:
          - { id: remove_status, status: amethyst_drained }
      rend:
        type: apply_effects          # the same as a recalled piercing shard
        targets: { type: key, key: hit }
        on_hit: true
        effects:
          - { id: damage, base: 1, ignore_iframes: true, knockback: false,
              falloff: { status: amethyst_recalled, per_stack: 0.05, min: 0.1 } }
          - { id: status, status: amethyst_recalled }
          - { id: status, status: amethyst_shard_slow }
          - { id: status, status: amethyst_bleed }
        next: rend_cue
      rend_cue:
        type: play_cue
        cue: amethyst_recall_hit
        at: hit

  # LMB while charging Prismatic Burst: fire it.
  amethyst_prism_loose:
    blocked_by: []
    display:
      name: "Fire the Prism"
      description:
        - "LMB: fire the prism now."
    nodes:
      go:
        type: release_charge
        ability: amethyst_ult1

characters:
  amethyst:
    name: "Amethyst"
    weapon: AMETHYST_SHARD
    stats:                           # see docs/character-stats.md
      health: 180                    # max HP
      armor: 15                      # damage taken x 100 / (100 + armor)
      base_damage: 35                # abilities deal % of this
      move_speed: 1.0                # x vanilla walking speed
      attack_speed: 4.5              # shards per second: 20 / 4.5 rounds to 4 ticks = 5 a second (out of ammo: ~1.5)
    resources:
      ammo:                          # PASSIVE: her shards (slot 9)
        max: 6
        regen_every: 60              # a shard every 3s (60 ticks), all the time (Recall brings piercing ones back sooner)
        refill_sweep: true           # its item shows the next shard coming back (a grey sweep)
        hotbar: 9
        icon: AMETHYST_SHARD
    status_items:                    # Shard Rush: piercing shots left (slot 6)
      - { status: amethyst_piercing, hotbar: 6, icon: PRISMARINE_SHARD, name: "Piercing Shards", glint_weapon: true,
          description: ["Your next shots pierce everyone", "and hang where they end, for Recall."] }
    forms:
      - while: state.volley_charging    # Crystal Volley: LMB looses it
        slots: { primary: amethyst_volley_loose }
      - while: state.prism_charging     # Prismatic Burst: LMB fires it
        slots: { primary: amethyst_prism_loose }
    slots:
      primary: amethyst_primary      # LMB: Amethyst Shard (regular; piercing after Shard Rush)
      ability_1: amethyst_ab1        # 1: Shard Rush
      ability_2: amethyst_ab2        # 2: Crystal Volley
      ability_3: amethyst_recall     # 3: Recall
      ultimate: amethyst_ult1        # F: Prismatic Burst
