# content: fae
# The Fae: a small fae riding a spore blossom. Floats a little above the ground, throws blossoms and seeds
# that latch onto friend and foe, perches on an ally's head to empower them, and hides poison traps.
# Format and all options: see README.md in this folder. Edit, then /ae reload.
#
# PASSIVE 1 (Blossom Ride): she always floats 2 blocks above the ground, sitting in her blossom: she walks,
#   jumps and drops off ledges two levels up (over water too), but can't fly. No fall damage.
# PASSIVE 2 (Spore Burst, hotbar slot 9): the next enemy hit that lands on her puffs spores that knock back
#   enemies within 4 blocks. Ready again 10s later, or after 4s out of combat.
#
# ULTIMATE (F): Wild Hunt. 8s of free flight (no height limit). Press F again aiming at an enemy (20 blocks):
#   a vine latches on, stunning them for 3.5s and tethering them to you: fly off and drag them along.

statuses:
  fae_blessing:                      # an ally the Fae is perched on: faster, and basic attacks hit harder
    duration: 0                      # while she sits there (the ride takes it off)
    move_speed: 1.2                  # +20%
    tags: [buff.fae_blessing]
    on_hit:
      - { id: damage, amount: 20 }   # +2 HP on every basic attack
  fae_perched:                       # the Fae, sitting on an ally's head: untouchable
    duration: 0
    tags: [state.untargetable]       # abilities pass through her
    damage_taken: 0                  # and nothing else hurts her either
    positive: false
  fae_gust:                          # recast while perched: a burst of speed for the ally
    duration: 40                     # 2s
    move_speed: 1.35                 # +35% (on top of the blessing)
    tags: [buff.fae_gust]
  fae_gust_spent:                    # the gust's own cooldown (on the Fae)
    duration: 100                    # 5s
    positive: false
  fae_toxin:                         # Deathcap Snare: poisoned, slowed and nauseous
    duration: 80                     # 4s...
    stacking: refresh
    move_speed: 0.65                 # -35%
    tags: [state.poisoned, state.nauseous]
    tick:
      every: 20                      # ...2% max HP a second = 8% (ignores armor)
      effects:
        - { id: damage, max_hp: 0.02, knockback: false }
  fae_wings:                         # Wild Hunt: free flight, no height limit
    duration: 160                    # 8s
    stacking: refresh
    tags: [state.flying]
    positive: false
  fae_dragging:                      # Wild Hunt: someone's on the vine (the ult doesn't end under them)
    duration: 80
    positive: false

abilities:

  # PRIMARY (LMB): Blossom Shot. A small blossom (1.1 blocks/tick, a slight drop) that bursts where it lands
  # or on whoever it hits: 90% base damage to enemies within 2.2 blocks.
  fae_primary:
    cooldown: 14                     # (the attack_speed stat sets it)
    display:
      name: "Blossom Shot"
      description:
        - "A blossom that bursts on impact:"
        - "90% base damage within 2.2 blocks."
    nodes:
      shoot:
        type: projectile
        speed: 1.1
        size: 0.4
        lifetime: 22                 # ~24 blocks
        visual: MANGROVE_PROPAGULE
        motion:
          - { type: gravity, amount: 0.015 }
        on: { spawned: shoot_cue, hit_entity: burst, hit_block: burst }
      shoot_cue:
        type: play_cue
        cue: fae_blossom_shot
      burst:
        type: apply_effects
        targets: { type: radius, center: hit, radius: 2.2 }
        effects:
          - { id: damage, base: 0.9 }
        next: burst_cue
      burst_cue:
        type: play_cue
        cue: fae_blossom_burst
        at: hit

  # PASSIVE (the ward below casts it): Spore Burst. Enemies within 4 blocks are knocked away.
  fae_spore_burst:
    blocked_by: []                   # a passive: goes off even while stunned
    display:
      name: "Spore Burst"
    nodes:
      burst:
        type: apply_effects
        targets: { type: radius, radius: 4 }
        on_hit: false
        effects:
          - { id: knockback, from: caster, radius: 4, center: 1.3, edge: 0.6, lift: 0.4 }
        next: burst_cue
      burst_cue:
        type: play_cue
        cue: fae_spore_burst

  # 1: Seed Bomb (3 charges, 8s each). A seed that latches onto whoever it hits, friend or foe; landing, it
  # lies there for 15s (3 at most) and latches onto the first one to come near (1.3 blocks), friend or foe.
  # Latched for 2s, then: an ENEMY's seed bursts, 110% base damage to enemies within 3.5 blocks; an ALLY's
  # blooms, healing allies within 3.5 blocks (her too) 5 HP. It goes on if she dies meanwhile.
  fae_ab1:
    cooldown: 160                    # 8s per charge
    charges: 3
    survives_death: true
    display:
      name: "Seed Bomb"
      icon: PITCHER_POD
      description:
        - "3 charges. A seed that latches onto"
        - "friend or foe; on the ground it waits 15s."
        - "2s later: an enemy's bursts (110% base"
        - "dmg, 3.5 blocks), an ally's heals 5 HP."
    nodes:
      throw:
        type: projectile
        speed: 0.9
        size: 0.5
        lifetime: 60
        visual: PITCHER_POD
        hits_allies: true            # latches onto allies too
        motion:
          - { type: gravity, amount: 0.05 }
        on: { spawned: throw_cue, hit_entity: whose, hit_block: plant }
      throw_cue:
        type: play_cue
        cue: fae_seed_throw
      plant:
        type: construct              # lies there until someone comes near
        at: hit
        height: 0.25
        size: 0.5
        fuse: 300                    # 15s
        trigger: 1.3
        triggered_by: all            # friend or foe (never her)
        arm: 10
        solid: false
        limit: 3
        visual: PITCHER_POD
        cue: fae_seed_idle           # a green shimmer and a leaf now and then while it lies there
        cue_every: 8
        on: { triggered: whose, fuse: wilt }
      wilt:
        type: play_cue
        cue: fae_seed_wilt
        at: construct
      whose:
        type: is_ally
        target: hit
        on: { ally: latch_ally, enemy: latch_enemy }
      latch_enemy:
        type: start_cue
        cue: fae_seed_latched
        at: hit
        next: fuse_enemy
      fuse_enemy:
        type: delay
        ticks: 40                    # 2s
        next: burst
      burst:
        type: apply_effects
        targets: { type: radius, center: hit, radius: 3.5 }
        effects:
          - { id: damage, base: 1.1 }
        next: burst_cue
      burst_cue:
        type: play_cue
        cue: fae_seed_burst
        at: hit
        next: end
      latch_ally:
        type: start_cue
        cue: fae_seed_latched_ally
        at: hit
        next: fuse_ally
      fuse_ally:
        type: delay
        ticks: 40
        next: bloom
      bloom:
        type: apply_effects
        targets: { type: radius, center: hit, radius: 3.5, include_caster: true }
        affects: allies
        on_hit: false
        effects:
          - { id: heal, amount: 50 }
        next: bloom_cue
      bloom_cue:
        type: play_cue
        cue: fae_seed_bloom
        at: hit
        next: end
      end:
        type: end_cast               # the seed is gone: so is its looping cue

  # 2: Perch. Fly to an ally in your sights (25 blocks; you can be hit on the way) and sit on their head:
  # you go where they go, untouchable (abilities pass through you, nothing hurts you). They're 20% faster
  # and their basic attacks deal +2 HP. Press 2 again: a gust, +35% speed for them for 2s (every 5s at
  # most); aim at ANOTHER ally instead and you fly over to them (vulnerable again on the way). Hold 2 (1s)
  # to hop off. It ends too when they die. The cooldown starts when you're off.
  fae_ab2:
    cooldown: 200                    # 10s
    cooldown_starts: manual          # once the ride is over
    display:
      name: "Perch"
      icon: PINK_PETALS
      description:
        - "Fly onto an ally's head (25 blocks):"
        - "untouchable; they're 20% faster, +2 HP"
        - "per basic attack. Again: gust (+35% speed),"
        - "or fly to another ally. Hold: hop off."
    nodes:
      pick:
        type: acquire_target
        query: { type: hitscan, range: 25, ray_size: 0.6, targets: allies }
        on: { hit: flit, miss: ~ }
      flit:
        type: play_cue
        cue: fae_flit
        next: fly
      fly:
        type: dash                   # after them, wherever they go
        to: target
        follow: true
        speed: 1.1
        range: 40
        radius: 0.3
        on: { hit: perch, miss: lost }
      perch:
        type: mount
        target: target
        status: fae_blessing
        self_status: fae_perched
        on: { out: perch_cue, none: lost, off: fell }
      perch_cue:
        type: play_cue
        cue: fae_perch
        at: mount
        next: listen
      listen:
        type: await_recast           # while perched, 2 again...
        window: 6000
        on: { recast: pressed, timeout: listen }
      pressed:
        type: fork                   # ...is a tap (now), unless it's held (then you hop off)
        on: { out: tap, also: hold }
      hold:
        type: charge                 # held for 1s+ (the key repeats): hop off
        ticks: 30
        min: 20
        release_gap: 22              # longer than the slowest key repeat delay (1s)
        bar: held                    # the cast bar fills while it's held (a tap shows none)
        on: { out: leave, early: ~ }
      tap:
        type: acquire_target
        query: { type: hitscan, range: 25, ray_size: 0.6, targets: allies }
        store: other
        on: { hit: which, miss: gust }
      which:
        type: has_status             # aiming at the one you're on: a gust
        status: fae_blessing
        target: other
        mine: true
        on: { has: gust, lacks: hop }
      gust:
        type: has_status
        status: fae_gust_spent
        on: { has: listen, lacks: gust_go }
      gust_go:
        type: apply_effects
        targets: { type: key, key: mount }
        affects: allies
        on_hit: false
        effects:
          - { id: status, status: fae_gust }
        next: gust_spent
      gust_spent:
        type: apply_effects
        targets: { type: self }
        on_hit: false
        effects:
          - { id: status, status: fae_gust_spent }
        next: gust_cue
      gust_cue:
        type: play_cue
        cue: fae_gust
        at: mount
        next: listen
      hop:
        type: dismount               # off this one (vulnerable on the way)...
        next: hop_cue
      hop_cue:
        type: play_cue
        cue: fae_flit
        next: fly_on
      fly_on:
        type: dash                   # ...over to the other
        to: other
        follow: true
        speed: 1.1
        range: 40
        radius: 0.3
        on: { hit: perch_on, miss: lost }
      perch_on:
        type: mount
        target: other
        status: fae_blessing
        self_status: fae_perched
        on: { out: perch_cue, none: lost, off: fell }
      leave:
        type: dismount
        next: fell
      fell:
        type: play_cue
        cue: fae_unperch
        next: done
      lost:
        type: play_cue
        cue: fae_unperch
        next: done
      done:
        type: start_cooldown
        next: end
      end:
        type: end_cast

  # 3: Deathcap Snare. Throw a toadstool; where it lands it hides a trap (30s, 2 at most) that enemies can't
  # see. Armed after 1s, the first enemy within 1.4 blocks springs it: enemies within 3 blocks take 100% base
  # damage and are poisoned (8% max HP over 4s), 35% slower and nauseous for 4s. Thrown straight at an enemy,
  # it springs on them at once. Traps stay if she dies.
  fae_ab3:
    cooldown: 240                    # 12s
    survives_death: true
    display:
      name: "Deathcap Snare"
      icon: RED_MUSHROOM
      description:
        - "A hidden trap where it lands (30s, 2 max)."
        - "Springs on an enemy: 100% base dmg (3"
        - "blocks), poison (8% max HP), 35% slow"
        - "and nausea for 4s."
    nodes:
      throw:
        type: projectile
        speed: 0.8
        size: 0.4
        lifetime: 60
        visual: RED_MUSHROOM
        motion:
          - { type: gravity, amount: 0.06 }
        on: { spawned: throw_cue, hit_entity: spring, hit_block: plant }
      throw_cue:
        type: play_cue
        cue: fae_trap_throw
      plant:
        type: construct
        at: hit
        height: 0.1
        size: 0.5
        fuse: 600                    # 30s
        trigger: 1.4
        arm: 20                      # 1s
        solid: false
        hidden: true                 # enemies can't see it
        limit: 2
        visual: RED_MUSHROOM
        on: { triggered: spring, fuse: wilt }
      wilt:
        type: play_cue
        cue: fae_trap_wilt
        at: construct
      spring:
        type: apply_effects
        targets: { type: radius, center: hit, radius: 3 }
        effects:
          - { id: damage, base: 1.0 }
          - { id: status, status: fae_toxin }
        next: spring_cue
      spring_cue:
        type: play_cue
        cue: fae_trap_spring
        at: hit

  # ULTIMATE (F): Wild Hunt. 8s of free flight, no height limit (it ends a perch). Press F again aiming at an
  # enemy (20 blocks): a vine latches onto them, stunning them for 3.5s and tethering them to you (4 blocks of
  # slack): fly off and drag them along, up into the air if you like. Missing doesn't end it: aim and try
  # again while the flight lasts. The cooldown starts at the first try (or after the 8s).
  fae_ult1:
    cooldown: 1200                   # placeholder until ults charge from damage
    display:
      name: "Wild Hunt"
      icon: VINE
      description:
        - "8s of free flight. F again on an enemy"
        - "(20 blocks): stun them 3.5s and drag them"
        - "along on a vine."
    nodes:
      leave:
        type: cancel_ability         # off any ally's head first
        ability: fae_ab2
        next: wings
      wings:
        type: apply_effects
        targets: { type: self }
        on_hit: false
        effects:
          - { id: status, status: fae_wings }
        next: wings_cue
      wings_cue:
        type: play_cue
        cue: fae_wings
        next: split
      split:
        type: fork                   # waiting for F, and the flight's 8s
        on: { out: pick, also: limit }
      limit:
        type: delay
        ticks: 160
        next: limit_check
      limit_check:
        type: has_status             # not while someone's on the vine
        status: fae_dragging
        on: { has: ~, lacks: over }
      pick:
        type: await_recast
        window: 160
        on: { recast: aim, timeout: over }
      aim:
        type: acquire_target
        query: { type: hitscan, range: 20, ray_size: 0.6 }
        on: { hit: latch, miss: pick }
      latch:
        type: apply_effects
        targets: { type: key, key: target }
        effects:
          - { id: status, status: stun, duration: 70 }   # 3.5s
        next: dragging
      dragging:
        type: apply_effects
        targets: { type: self }
        on_hit: false
        effects:
          - { id: status, status: fae_wings, duration: 80 }   # flight lasts at least as long as the drag
          - { id: status, status: fae_dragging }
        next: latch_cue
      latch_cue:
        type: play_cue
        cue: fae_latch
        at: target
        next: drag
      drag:
        type: leash
        target: target
        length: 4                    # slack: closer than this, they just dangle
        duration: 70
        pull: 0.4
        max_speed: 1.6
        cue: fae_vine
        on: { out: release, broken: release }
      release:
        type: apply_effects
        targets: { type: self }
        on_hit: false
        effects:
          - { id: remove_status, status: fae_dragging }
        next: release_cue
      release_cue:
        type: play_cue
        cue: fae_release
        at: target
        next: over
      over:
        type: end_cast

characters:
  fae:
    name: "Fae"
    weapon: SPORE_BLOSSOM
    stats:                           # see docs/character-stats.md
      health: 160                    # max HP
      armor: 5                       # damage taken x 100 / (100 + armor)
      base_damage: 35                # abilities deal % of this
      move_speed: 1.0                # x vanilla walking speed
      attack_speed: 1.5              # blossoms per second
      scale: 0.5                     # small (model and hitbox)
    hover:                           # PASSIVE: Blossom Ride
      height: 2                      # always 2 blocks above the ground
      fly: false                     # floating, not flying (fly: true = fly at will up to the height)
      visual: SPORE_BLOSSOM          # what she rides: the blossom, upside down, she sits in its cup
    ward:                            # PASSIVE: Spore Burst
      name: "Spore Burst"
      cast: fae_spore_burst          # the next enemy hit on her...
      cooldown: 200                  # ...then 10s
      out_of_combat: 80              # (or 4s out of combat)
      hotbar: 9
      icon: BROWN_MUSHROOM
      description:
        - "When an enemy hits you, spores knock"
        - "back enemies within 4 blocks. Ready again"
        - "10s later, or after 4s out of combat."
    slots:
      primary: fae_primary           # LMB: Blossom Shot (no RMB)
      ability_1: fae_ab1             # 1: Seed Bomb (3 charges)
      ability_2: fae_ab2             # 2: Perch (again: gust / another ally; hold: hop off)
      ability_3: fae_ab3             # 3: Deathcap Snare
      ultimate: fae_ult1             # F: Wild Hunt
