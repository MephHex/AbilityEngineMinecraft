# content: swordmaster
# The SwordMaster: two blades float by his head (netherite on his left, gold on his right) and fight for him. His arm
# never swings: his blades do the work.
# Format and all options: see README.md in this folder. Edit, then /ae reload.
#
# PASSIVE (Twin Blades): his basic attacks alternate between the blades (the one up next shows in his hand).
#   Netherite: physical damage, +50% damage to shields. Gold: magic damage, and it heals him on hit (spell power).
#
# 1: Twin Thrust. A spear thrust (he raises his weapon like a spear): both blades stab forward, each with its passive
#   (and on-hit effects). Nothing else meanwhile.
# 2: Blade Guard. The blades cross in front of him for 1s: 40% less damage taken, and enemy shots from the front are
#   cut down. Then he dashes where he aims.
# 3: Falling Blade. The blade up next drops from the sky where he chooses, and stays planted for 4s (meanwhile his
#   basic attacks only use the other one). Netherite: physical damage around it, +50% to shields. Gold: magic damage
#   around it, and it heals him.
# ULTIMATE: Death by a Thousand Cuts. An area for 6s: every enemy in it is stabbed by a pair of blades every 0.5s
#   (netherite and gold, each with its passive). His abilities wait meanwhile (his blades still attack).

statuses:
  sm_twin_blades:                    # PASSIVE: the two blades by his head; no arm swings (always on: passive_statuses)
    duration: 0
    neutral: true                    # (his own: no purge or cleanse takes it)
    tags: [state.no_swing]
    cue: sm_blades
  sm_gold_next:                      # the gold blade attacks next (the netherite one without it)
    duration: 0
    neutral: true
    tags: [swordmaster.gold_next]
  sm_neth_planted:                   # 3: the netherite blade is in the ground (keep 80 = SwordMasterCues.PLANTED_TICKS)
    duration: 80
    neutral: true
    tags: [swordmaster.neth_planted]
    cue: sm_neth_away                # (not by his head meanwhile)
  sm_gold_planted:
    duration: 80
    neutral: true
    tags: [swordmaster.gold_planted]
    cue: sm_gold_away
  sm_guarded:                        # 2: behind the crossed blades
    duration: 20
    damage_taken: 0.6                # 40% less damage taken

abilities:

  # PRIMARY (LMB): Twin Blades. The blade up next stabs whoever he aims at (8 blocks) and flies back to his side; the
  # blades take turns (one cooldown for both). Netherite (left): 100% base damage (physical), +50% to shields. Gold
  # (right): 60% base damage + 60% spell power (magic), and a hit heals him 8 + 20% spell power. While one is planted
  # (3: Falling Blade), the other attacks every time.
  sm_primary:
    cooldown: 16                     # (the attack_speed stat sets it)
    display:
      name: "Twin Blades"
      description:
        - "The blade in your hand stabs where you"
        - "aim (8 blocks); they take turns."
        - "Netherite: {base:1.0|physical}, +50% to shields."
        - "Gold: {base:0.6|magic} + {sp:0.6|magic},"
        - "a hit heals you {flat:8} {sp_per:4/20}."
    nodes:
      neth_planted:
        type: has_tag                # one in the ground: the other one
        tag: swordmaster.neth_planted
        on: { has: gold_go, lacks: gold_planted }
      gold_planted:
        type: has_tag
        tag: swordmaster.gold_planted
        on: { has: neth_go, lacks: up_next }
      up_next:
        type: has_tag
        tag: swordmaster.gold_next
        on: { has: gold_go, lacks: neth_go }

      # ---- netherite (left) ----
      neth_go:
        type: start_cue              # not by his head until it's back (the cast's end)
        cue: sm_neth_away
        next: neth_turn
      neth_turn:
        type: apply_effects          # the gold blade next
        targets: { type: self }
        on_hit: false
        effects:
          - { id: status, status: sm_gold_next }
        next: neth_shot
      neth_shot:
        type: play_cue
        cue: sm_neth_shot
        next: neth_stab
      neth_stab:
        type: projectile
        visual: NETHERITE_SWORD
        face_flight: true            # point first
        side: -0.75                  # from his left (where it floats), at what he aims at
        up: 0.05
        speed: 1.8
        size: 0.5
        range: 8
        lifetime: 6
        on: { hit_entity: neth_hit, hit_block: neth_back, expired: neth_back }
      neth_hit:
        type: apply_effects
        targets: { type: key, key: hit }
        effects:
          - { id: damage, base: 1.0, type: physical, shield_bonus: 0.5 }
        next: neth_hit_cue
      neth_hit_cue:
        type: play_cue
        cue: sm_neth_hit
        at: hit
        next: neth_back
      neth_back:
        type: play_cue               # it flies back to his side
        cue: sm_neth_return
        at: flight_end
        to: caster
        next: home

      # ---- gold (right) ----
      gold_go:
        type: start_cue
        cue: sm_gold_away
        next: gold_turn
      gold_turn:
        type: apply_effects          # the netherite blade next
        targets: { type: self }
        on_hit: false
        effects:
          - { id: remove_status, status: sm_gold_next }
        next: gold_shot
      gold_shot:
        type: play_cue
        cue: sm_gold_shot
        next: gold_stab
      gold_stab:
        type: projectile
        visual: GOLDEN_SWORD
        face_flight: true
        side: 0.75                   # from his right
        up: 0.05
        speed: 1.8
        size: 0.5
        range: 8
        lifetime: 6
        on: { hit_entity: gold_hit, hit_block: gold_back, expired: gold_back }
      gold_hit:
        type: apply_effects
        targets: { type: key, key: hit }
        effects:
          - { id: damage, base: 0.6, sp: 0.6, type: magic }
        next: gold_mend
      gold_mend:
        type: apply_effects          # the golden blade heals him
        targets: { type: self }
        on_hit: false
        effects:
          - { id: heal, amount: 8, sp: 0.2 }
        next: gold_hit_cue
      gold_hit_cue:
        type: play_cue
        cue: sm_gold_hit
        at: hit
        next: gold_back
      gold_back:
        type: play_cue
        cue: sm_gold_return
        at: flight_end
        to: caster
        next: home

      home:
        type: delay                  # (its flight back)
        ticks: 5

  # 1: Twin Thrust (8s). A spear thrust: both blades stab forward (4.5 blocks, a line 1.4 wide), each with its passive:
  # 90% base damage (physical, +50% to shields) and 50% base damage + 50% spell power (magic); he heals 8 + 20% spell
  # power per enemy hit. On-hit effects apply. Nothing else meanwhile (0.8s).
  sm_ab1:
    cooldown: 160                    # 8s
    interrupted_by: [state.stunned]
    blocked_by: [block.ability, swordmaster.cutting]
    active_tags: [block.ability]     # no other abilities or swings meanwhile
    display:
      name: "Twin Thrust"
      icon: SPECTRAL_ARROW
      description:
        - "Both blades thrust forward (4.5 blocks):"
        - "{base:0.9|physical} (+50% to shields) and"
        - "{base:0.5|magic} + {sp:0.5|magic}; heals you"
        - "{flat:8} {sp_per:4/20} per enemy hit. Applies on-hit"
        - "effects."
    nodes:
      pose:
        type: start_cue              # vanilla's trident raise (others see it)
        cue: pose_spear
        ticks: 12
        next: neth_away
      neth_away:
        type: start_cue
        cue: sm_neth_away
        next: gold_away
      gold_away:
        type: start_cue
        cue: sm_gold_away
        next: windup
      windup:
        type: delay
        ticks: 5
        next: thrust_cue
      thrust_cue:
        type: play_cue
        cue: sm_twin_thrust
        at: caster
        to: aim
        next: thrust
      thrust:
        type: apply_effects
        targets: { type: line, range: 4.5, width: 1.4 }
        on_hit: true                 # on-hit effects too
        effects:
          - { id: damage, base: 0.9, type: physical, shield_bonus: 0.5 }
          - { id: damage, base: 0.5, sp: 0.5, type: magic, ignore_iframes: true }
        count: struck
        next: struck_any
      struck_any:
        type: switch
        key: struck
        on: { "0": settle, default: mend }
      mend:
        type: apply_effects
        targets: { type: self }
        on_hit: false
        times: struck                # per enemy hit
        effects:
          - { id: heal, amount: 8, sp: 0.2 }
        next: hit_cue
      hit_cue:
        type: play_cue
        cue: sm_thrust_hit
        at: caster
        next: settle
      settle:
        type: delay                  # the blades come back to his side
        ticks: 10

  # 2: Blade Guard (12s). 1s behind the crossed blades: 40% less damage taken, enemy shots from the front are cut down.
  # Then a dash where he aims (6 blocks).
  sm_ab2:
    cooldown: 240                    # 12s
    interrupted_by: [state.stunned]
    blocked_by: [block.ability, swordmaster.cutting]
    display:
      name: "Blade Guard"
      icon: IRON_BARS
      description:
        - "Your blades guard you for 1s: 40% less"
        - "damage taken, enemy shots from the front"
        - "are destroyed. Then dash where you aim"
        - "(6 blocks)."
    nodes:
      neth_away:
        type: start_cue
        cue: sm_neth_away
        next: gold_away
      gold_away:
        type: start_cue
        cue: sm_gold_away
        next: guard_cue
      guard_cue:
        type: start_cue              # the crossed blades in front of him
        cue: sm_guard
        ticks: 20
        next: harden
      harden:
        type: apply_effects
        targets: { type: self }
        on_hit: false
        effects:
          - { id: status, status: sm_guarded }
        next: wall
      wall:
        type: barrier                # enemy shots from the front are cut down (until the cast ends: the dash too)
        distance: 1.0
        radius: 1.6
        projectiles_only: true
        next: channel
      channel:
        type: delay
        ticks: 20
        cast_bar: true
        next: unguard
      unguard:
        type: apply_effects
        targets: { type: self }
        on_hit: false
        effects:
          - { id: remove_status, status: sm_guarded }
        next: dash_cue
      dash_cue:
        type: play_cue
        cue: sm_dash
        next: dash
      dash:
        type: dash
        range: 6
        speed: 1.4
        radius: 0.8
        flat: true

  # 3: Falling Blade (14s). The blade up next drops from the sky where he chooses (16 blocks) and stays planted there
  # 4s; meanwhile his basic attacks only use the other one. Netherite: 150% base damage around it (3 blocks, physical),
  # +50% to shields. Gold: 60% base damage + 100% spell power around it (magic), and he heals 30 + 50% spell power if it
  # hits anyone. On-hit effects apply.
  sm_ab3:
    cooldown: 280                    # 14s
    interrupted_by: [state.stunned]
    blocked_by: [block.ability, swordmaster.cutting]
    targeting: { shape: circle, range: 16, radius: 3, ground: true }
    display:
      name: "Falling Blade"
      icon: POINTED_DRIPSTONE
      description:
        - "Drop the blade up next from the sky"
        - "(3 blocks). It stays planted 4s: only"
        - "the other one attacks meanwhile."
        - "Netherite: {base:1.5|physical},"
        - "+50% to shields. Gold: {base:0.6|magic} +"
        - "{sp:1.0|magic}, heals you {flat:30} {sp_per:10/20}."
        - "Applies on-hit effects."
    nodes:
      which:
        type: has_tag
        tag: swordmaster.gold_next
        on: { has: gold_plant, lacks: neth_plant }
      neth_plant:
        type: apply_effects
        targets: { type: self }
        on_hit: false
        effects:
          - { id: status, status: sm_neth_planted }
        next: neth_drop
      neth_drop:
        type: play_cue
        cue: sm_neth_drop
        at: aim
        next: neth_fall
      neth_fall:
        type: delay                  # (it falls)
        ticks: 6
        next: neth_hit
      neth_hit:
        type: apply_effects
        targets: { type: radius, center: aim, radius: 3 }
        on_hit: true
        effects:
          - { id: damage, base: 1.5, type: physical, shield_bonus: 0.5 }
        next: neth_impact
      neth_impact:
        type: play_cue
        cue: sm_neth_impact
        at: aim
        next: neth_wait
      neth_wait:
        type: delay                  # planted (80 ticks in all)
        ticks: 74
        next: neth_back
      neth_back:
        type: play_cue
        cue: sm_neth_return
        at: aim
        to: caster
      gold_plant:
        type: apply_effects
        targets: { type: self }
        on_hit: false
        effects:
          - { id: status, status: sm_gold_planted }
        next: gold_drop
      gold_drop:
        type: play_cue
        cue: sm_gold_drop
        at: aim
        next: gold_fall
      gold_fall:
        type: delay
        ticks: 6
        next: gold_hit
      gold_hit:
        type: apply_effects
        targets: { type: radius, center: aim, radius: 3 }
        on_hit: true
        effects:
          - { id: damage, base: 0.6, sp: 1.0, type: magic }
        count: gold_struck
        next: gold_impact
      gold_impact:
        type: play_cue
        cue: sm_gold_impact
        at: aim
        next: gold_any
      gold_any:
        type: switch
        key: gold_struck
        on: { "0": gold_wait, default: gold_mend }
      gold_mend:
        type: apply_effects
        targets: { type: self }
        on_hit: false
        effects:
          - { id: heal, amount: 30, sp: 0.5 }
        next: gold_mend_cue
      gold_mend_cue:
        type: play_cue
        cue: sm_heal
        next: gold_wait
      gold_wait:
        type: delay
        ticks: 74
        next: gold_back
      gold_back:
        type: play_cue
        cue: sm_gold_return
        at: aim
        to: caster

  # ULTIMATE (F): Death by a Thousand Cuts. An area (5 blocks, 18 away at most) for 6s: every 0.5s each enemy in it is
  # stabbed by a pair of blades: 30% base damage (physical, +50% to shields) and 15% base damage + 25% spell power
  # (magic); he heals 4 + 8% spell power per pair. His abilities wait meanwhile (his blades still attack).
  sm_ult:
    cooldown: 1200                   # (unused while ultimates charge up: config.yml ultimate-charge)
    interrupted_by: [state.stunned]
    targeting: { shape: circle, range: 18, radius: 5, ground: true }
    active_tags: [swordmaster.cutting]   # 1, 2 and 3 are blocked_by it
    display:
      name: "Death by a Thousand Cuts"
      icon: IRON_SWORD
      description:
        - "An area (5 blocks) for 6s: every 0.5s"
        - "each enemy in it is stabbed by two blades:"
        - "{base:0.3|physical} (+50% to shields) and"
        - "{base:0.15|magic} + {sp:0.25|magic}; heals you"
        - "{flat:4} {sp_per:1.6/20} each time. No other"
        - "abilities meanwhile."
    nodes:
      open:
        type: play_cue
        cue: sm_ult_start
        at: aim
        next: pulses
      pulses:
        type: repeat                 # 12 x 0.5s
        times: 12
        every: 10
        on: { each: zone }
      zone:
        type: play_cue
        cue: sm_zone
        at: aim
        next: each
      each:
        type: for_each
        query: { type: radius, center: aim, radius: 5 }
        store: victim
        on: { each: cut }
      cut:
        type: apply_effects
        targets: { type: key, key: victim }
        on_hit: false
        effects:
          - { id: damage, base: 0.3, type: physical, shield_bonus: 0.5, knockback: false, ignore_iframes: true }
          - { id: damage, base: 0.15, sp: 0.25, type: magic, knockback: false, ignore_iframes: true }
        next: cut_cue
      cut_cue:
        type: play_cue
        cue: sm_cut
        at: victim
        next: cut_mend
      cut_mend:
        type: apply_effects
        targets: { type: self }
        on_hit: false
        effects:
          - { id: heal, amount: 4, sp: 0.08 }

characters:
  swordmaster:
    name: "SwordMaster"
    weapon: NETHERITE_SWORD          # the blade up next: netherite, or gold (forms)
    forms:                           # the blade up next in his hand (first match wins)
      - { while: swordmaster.neth_planted, weapon: GOLDEN_SWORD }
      - { while: swordmaster.gold_planted, weapon: NETHERITE_SWORD }
      - { while: swordmaster.gold_next, weapon: GOLDEN_SWORD }
    stats:                           # see docs/character-stats.md
      health: 230                    # max HP
      armor: 15                      # damage taken x 100 / (100 + armor)
      base_damage: 38                # abilities deal % of this
      move_speed: 1.0                # x vanilla walking speed
      attack_speed: 1.25             # stabs per second
    passive_statuses: [sm_twin_blades]   # PASSIVE: Twin Blades
    passive:                         # explained in hotbar slot 9 (or on the weapon when slot 9 is taken)
      name: "Twin Blades"
      icon: NETHERITE_UPGRADE_SMITHING_TEMPLATE
      description:
        - "Two blades float by your head and take"
        - "turns attacking (the one up next is in"
        - "your hand). Netherite: physical damage,"
        - "+50% damage to shields. Gold: magic"
        - "damage, heals you on hit (spell power)."
    slots:
      primary: sm_primary            # LMB: Twin Blades (the blade up next)
      ability_1: sm_ab1              # 1: Twin Thrust
      ability_2: sm_ab2              # 2: Blade Guard
      ability_3: sm_ab3              # 3: Falling Blade
      ultimate: sm_ult               # F: Death by a Thousand Cuts
