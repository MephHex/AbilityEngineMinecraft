# content: swordmaster
# The SwordMaster: two blades float by his head (netherite on his left, gold on his right) and fight for him. His arm
# never swings: his blades do the work.
# Format and all options: see README.md in this folder. Edit, then /ae reload.
#
# PASSIVE (Twin Blades): his basic attacks alternate between the blades (the one up next shows in his hand).
#   Netherite: physical damage, +50% damage to shields. Gold: magic damage, and it heals him on hit (spell power).
#
# 1: Twin Thrust. A spear thrust (he raises his weapon like a spear): both blades stab forward, true damage (base
#   damage and spell power alike), and on-hit effects. Nothing else meanwhile.
# 2: Blade Guard. The blades cross in front of him for 1s: 40% less damage taken, and enemy shots from the front are
#   cut down. Then he dashes where he aims.
# 3: Blade Stance. Faster, his blades lie crossed in front of him for 6s (the XP bar: its number is the waves left);
#   his next 3 basic attacks swing them out and back and send a wave of energy (7 blocks): 1 magic damage and heals
#   him, 2 breaks shields and physical damage, 3 true damage. His other abilities work meanwhile.
# ULTIMATE: Death by a Thousand Cuts. 8s (the boss bar): basic attacks only, but they reach 20 blocks, 20% faster,
#   with spell power: both blades stab whoever he aims at (that enemy glows for him while in reach and in sight).

statuses:
  sm_twin_blades:                    # PASSIVE: the two blades by his head; no arm swings (always on: passive_statuses)
    duration: 0
    neutral: true                    # (his own: no purge or cleanse takes it)
    tags: [state.no_swing]
    cue: sm_blades
  sm_gold_next:                      # the gold blade attacks next (the netherite one without it)
    duration: 0
    neutral: true
    tags: [swordmaster.gold_next]
  sm_stance:                         # 3: Blade Stance; a stack per wave left (the XP bar: number = waves left)
    duration: 120                    # 6s
    stacking: stack
    max_stacks: 3
    neutral: true
    cue: sm_stance                   # (his blades crossed in front of him meanwhile)
  sm_stance_haste:                   # 3: faster for the stance's 6s
    duration: 120
    stacking: refresh
    move_speed: 1.25                 # +25% speed
  sm_cutting:                        # ULTIMATE: 20% faster attacks for its 8s
    duration: 160
    stacking: refresh
    attack_speed: 1.2
  sm_guarded:                        # 2: behind the crossed blades
    duration: 20
    damage_taken: 0.6                # 40% less damage taken

abilities:

  # PRIMARY (LMB): Twin Blades. The blade up next thrusts out from his side, pointing ahead, to 4.5 blocks along his aim
  # and pulls back (Twin Thrust with one blade), striking the first enemy in its way; the blades take turns (one
  # cooldown for both). Netherite (left): 100% base damage (physical), +50% to shields. Gold (right): 60% base damage +
  # 60% spell power (magic), and a hit heals him 8 + 20% spell power.
  # In Blade Stance (3): a wave of energy instead (see 3). In the ultimate: both blades stab whoever he aims at, 20
  # blocks away: 90% base damage + 40% spell power (physical, +50% to shields) and 50% base damage + 80% spell power
  # (magic), and he heals 8 + 20% spell power.
  sm_primary:
    cooldown: 16                     # (the attack_speed stat sets it)
    display:
      name: "Twin Blades"
      description:
        - "The blade in your hand thrusts where you"
        - "aim (4.5 blocks); they take turns."
        - "Netherite: {base:1.0|physical}, +50% to shields."
        - "Gold: {base:0.6|magic} + {sp:0.6|magic},"
        - "a hit heals you {flat:8} {sp_per:4/20}."
    nodes:
      in_ult:
        type: has_tag                # the ultimate: both blades, 20 blocks
        tag: swordmaster.cutting
        on: { has: ult_find, lacks: in_stance }
      in_stance:
        type: has_status             # Blade Stance: a wave
        status: sm_stance
        on: { has: stance_go, lacks: up_next }
      up_next:
        type: has_tag
        tag: swordmaster.gold_next
        on: { has: gold_go, lacks: neth_go }

      # ---- the ultimate: both blades stab whoever he aims at ----
      ult_find:
        type: acquire_target         # the enemy under his crosshair, in sight, 20 blocks
        query: { type: hitscan, range: 20, ray_size: 0.5 }
        on: { hit: ult_neth_away, miss: ult_whiff }
      ult_neth_away:
        type: start_cue              # his blades leave his side to stab them
        cue: sm_neth_away
        ticks: 10
        next: ult_gold_away
      ult_gold_away:
        type: start_cue
        cue: sm_gold_away
        ticks: 10
        next: ult_cut_cue
      ult_cut_cue:
        type: start_cue              # the pair pointing at them, stabbing (the cut's point: 5 ticks in)
        cue: sm_cut
        at: target
        ticks: 10
        next: ult_reach
      ult_reach:
        type: delay
        ticks: 5
        next: ult_hit
      ult_hit:
        type: apply_effects
        targets: { type: key, key: target }
        effects:
          - { id: damage, base: 0.9, sp: 0.4, type: physical, shield_bonus: 0.5 }
          - { id: damage, base: 0.5, sp: 0.8, type: magic, ignore_iframes: true }
        next: ult_mend
      ult_mend:
        type: apply_effects
        targets: { type: self }
        on_hit: false
        effects:
          - { id: heal, amount: 8, sp: 0.2 }
        next: home
      ult_whiff:
        type: play_cue
        cue: sm_neth_shot

      # ---- Blade Stance: a wave from the crossed blades ----
      stance_go:
        type: start_cue              # the stance blades swing out and back (8 ticks)
        cue: sm_neth_away
        ticks: 8
        next: stance_gold
      stance_gold:
        type: start_cue
        cue: sm_gold_away
        ticks: 8
        next: stance_spin
      stance_spin:
        type: play_cue
        cue: sm_stance_spin
        at: caster
        to: aim
        next: stance_wait
      stance_wait:
        type: delay                  # (out to his sides: the wave leaves as they come back)
        ticks: 4
        next: which_wave
      which_wave:
        type: has_status             # 3 left: the first wave
        status: sm_stance
        min_stacks: 3
        on: { has: wave1, lacks: which_wave2 }
      which_wave2:
        type: has_status
        status: sm_stance
        min_stacks: 2
        on: { has: wave2, lacks: wave3 }
      wave1:
        type: apply_effects
        targets: { type: self }
        on_hit: false
        effects:
          - { id: remove_status, status: sm_stance, stacks: 1 }
        next: wave1_cue
      wave1_cue:
        type: play_cue
        cue: sm_wave_shot
        next: wave1_fly
      wave1_fly:
        type: projectile
        visual: "entity:MARKER"      # (nothing to see but its trail: the wave)
        size: 1.6
        speed: 1.5
        range: 7
        lifetime: 5
        pierce: 99                   # through everyone
        trail: sm_wave1_trail
        on: { hit_entity: wave1_hit }
      wave1_hit:
        type: apply_effects          # magic, and it heals him
        targets: { type: key, key: hit }
        effects:
          - { id: damage, base: 0.6, sp: 0.8, type: magic }
        next: wave1_mend
      wave1_mend:
        type: apply_effects
        targets: { type: self }
        on_hit: false
        effects:
          - { id: heal, amount: 12, sp: 0.25 }
        next: wave1_hit_cue
      wave1_hit_cue:
        type: play_cue
        cue: sm_gold_hit
        at: hit
      wave2:
        type: apply_effects
        targets: { type: self }
        on_hit: false
        effects:
          - { id: remove_status, status: sm_stance, stacks: 1 }
        next: wave2_cue
      wave2_cue:
        type: play_cue
        cue: sm_wave_shot
        next: wave2_fly
      wave2_fly:
        type: projectile
        visual: "entity:MARKER"
        size: 1.6
        speed: 1.5
        range: 7
        lifetime: 5
        pierce: 99
        trail: sm_wave2_trail
        on: { hit_entity: wave2_hit }
      wave2_hit:
        type: apply_effects          # their shield breaks, then physical damage
        targets: { type: key, key: hit }
        effects:
          - { id: break_shield }
          - { id: damage, base: 1.2, type: physical }
        next: wave2_hit_cue
      wave2_hit_cue:
        type: play_cue
        cue: sm_shield_break
        at: hit
      wave3:
        type: apply_effects
        targets: { type: self }
        on_hit: false
        effects:
          - { id: remove_status, status: sm_stance, stacks: 1 }
        next: wave3_cue
      wave3_cue:
        type: play_cue
        cue: sm_wave_shot
        next: wave3_fly
      wave3_fly:
        type: projectile
        visual: "entity:MARKER"
        size: 1.6
        speed: 1.5
        range: 7
        lifetime: 5
        pierce: 99
        trail: sm_wave3_trail
        on: { hit_entity: wave3_hit }
      wave3_hit:
        type: apply_effects          # true damage, base damage and spell power alike
        targets: { type: key, key: hit }
        effects:
          - { id: damage, base: 0.7, sp: 0.7, type: true }
        next: wave3_hit_cue
      wave3_hit_cue:
        type: play_cue
        cue: sm_true_hit
        at: hit

      # ---- netherite (left) ----
      neth_go:
        type: start_cue              # not by his head until it's back (the cast's end)
        cue: sm_neth_away
        next: neth_turn
      neth_turn:
        type: apply_effects          # the gold blade next
        targets: { type: self }
        on_hit: false
        effects:
          - { id: status, status: sm_gold_next }
        next: neth_thrust
      neth_thrust:
        type: play_cue               # out from his left to 4.5 blocks ahead and back
        cue: sm_neth_thrust
        at: caster
        to: aim
        next: neth_reach
      neth_reach:
        type: delay                  # (its point gets there: SwordMasterCues.THRUST_OUT)
        ticks: 3
        next: neth_find
      neth_find:
        type: acquire_target         # the first enemy in its way
        query: { type: hitscan, range: 4.5, ray_size: 1.0 }
        on: { hit: neth_hit, miss: home }
      neth_hit:
        type: apply_effects
        targets: { type: key, key: target }
        effects:
          - { id: damage, base: 1.0, type: physical, shield_bonus: 0.5 }
        next: neth_hit_cue
      neth_hit_cue:
        type: play_cue
        cue: sm_neth_hit
        at: target
        next: home

      # ---- gold (right) ----
      gold_go:
        type: start_cue
        cue: sm_gold_away
        next: gold_turn
      gold_turn:
        type: apply_effects          # the netherite blade next
        targets: { type: self }
        on_hit: false
        effects:
          - { id: remove_status, status: sm_gold_next }
        next: gold_thrust
      gold_thrust:
        type: play_cue               # out from his right
        cue: sm_gold_thrust
        at: caster
        to: aim
        next: gold_reach
      gold_reach:
        type: delay
        ticks: 3
        next: gold_find
      gold_find:
        type: acquire_target
        query: { type: hitscan, range: 4.5, ray_size: 1.0 }
        on: { hit: gold_hit, miss: home }
      gold_hit:
        type: apply_effects
        targets: { type: key, key: target }
        effects:
          - { id: damage, base: 0.6, sp: 0.6, type: magic }
        next: gold_mend
      gold_mend:
        type: apply_effects          # the golden blade heals him
        targets: { type: self }
        on_hit: false
        effects:
          - { id: heal, amount: 8, sp: 0.2 }
        next: gold_hit_cue
      gold_hit_cue:
        type: play_cue
        cue: sm_gold_hit
        at: target
        next: home

      home:
        type: delay                  # (held 2 ticks, pulled back in 5)
        ticks: 7

  # 1: Twin Thrust (8s). A spear thrust: both blades stab forward (4.5 blocks, a line 1.4 wide): true damage, 50% base
  # damage + 40% spell power and 40% base damage + 50% spell power; he heals 8 + 20% spell power per enemy hit. On-hit
  # effects apply. Nothing else meanwhile (0.8s).
  sm_ab1:
    cooldown: 160                    # 8s
    interrupted_by: [state.stunned]
    blocked_by: [block.ability, swordmaster.cutting]
    active_tags: [block.ability]     # no other abilities or swings meanwhile
    display:
      name: "Twin Thrust"
      icon: SPECTRAL_ARROW
      description:
        - "Both blades thrust forward (4.5 blocks):"
        - "{base:0.5|true} + {sp:0.4|true} and {base:0.4|true}"
        - "+ {sp:0.5|true}; heals you"
        - "{flat:8} {sp_per:4/20} per enemy hit. Applies on-hit"
        - "effects."
    nodes:
      pose:
        type: start_cue              # vanilla's trident raise, "spear up" (others see it, not he himself)
        cue: pose_trident
        ticks: 12
        next: neth_away
      neth_away:
        type: start_cue
        cue: sm_neth_away
        next: gold_away
      gold_away:
        type: start_cue
        cue: sm_gold_away
        next: windup
      windup:
        type: delay
        ticks: 5
        next: thrust_cue
      thrust_cue:
        type: play_cue
        cue: sm_twin_thrust
        at: caster
        to: aim
        next: thrust
      thrust:
        type: apply_effects
        targets: { type: line, range: 4.5, width: 1.4 }
        on_hit: true                 # on-hit effects too
        effects:
          - { id: damage, base: 0.5, sp: 0.4, type: true }
          - { id: damage, base: 0.4, sp: 0.5, type: true, ignore_iframes: true }
        count: struck
        next: struck_any
      struck_any:
        type: switch
        key: struck
        on: { "0": settle, default: mend }
      mend:
        type: apply_effects
        targets: { type: self }
        on_hit: false
        times: struck                # per enemy hit
        effects:
          - { id: heal, amount: 8, sp: 0.2 }
        next: hit_cue
      hit_cue:
        type: play_cue
        cue: sm_thrust_hit
        at: caster
        next: settle
      settle:
        type: delay                  # the blades come back to his side
        ticks: 10

  # 2: Blade Guard (12s). 1s behind the crossed blades: 40% less damage taken, enemy shots from the front are cut down.
  # Then a dash where he aims (6 blocks).
  sm_ab2:
    cooldown: 240                    # 12s
    interrupted_by: [state.stunned]
    blocked_by: [block.ability, swordmaster.cutting]
    display:
      name: "Blade Guard"
      icon: IRON_BARS
      description:
        - "Your blades guard you for 1s: 40% less"
        - "damage taken, enemy shots from the front"
        - "are destroyed. Then dash where you aim"
        - "(6 blocks)."
    nodes:
      neth_away:
        type: start_cue
        cue: sm_neth_away
        next: gold_away
      gold_away:
        type: start_cue
        cue: sm_gold_away
        next: guard_cue
      guard_cue:
        type: start_cue              # the crossed blades in front of him
        cue: sm_guard
        ticks: 20
        next: harden
      harden:
        type: apply_effects
        targets: { type: self }
        on_hit: false
        effects:
          - { id: status, status: sm_guarded }
        next: wall
      wall:
        type: barrier                # enemy shots from the front are cut down (until the cast ends: the dash too)
        distance: 1.0
        radius: 1.6
        projectiles_only: true
        next: channel
      channel:
        type: delay
        ticks: 20
        cast_bar: true
        next: unguard
      unguard:
        type: apply_effects
        targets: { type: self }
        on_hit: false
        effects:
          - { id: remove_status, status: sm_guarded }
        next: dash_cue
      dash_cue:
        type: play_cue
        cue: sm_dash
        next: dash
      dash:
        type: dash
        range: 6
        speed: 1.4
        radius: 0.8
        flat: true

  # 3: Blade Stance (14s). +25% speed and his blades lie crossed in front of him for 6s (the XP bar; its number: the
  # waves left). His next 3 basic attacks swing them out and back and send a wave of energy (7 blocks, through
  # everyone): 1st - 60% base damage + 80% spell power (magic), and he heals 12 + 25% spell power per enemy hit; 2nd -
  # breaks their shields, 120% base damage (physical); 3rd - 70% base damage + 70% spell power (true). His other
  # abilities work meanwhile.
  sm_ab3:
    cooldown: 280                    # 14s
    interrupted_by: [state.stunned]
    blocked_by: [block.ability, swordmaster.cutting]
    display:
      name: "Blade Stance"
      icon: ECHO_SHARD
      description:
        - "6s: +25% speed, your blades crossed in front"
        - "of you. Your next 3 attacks send a wave"
        - "(7 blocks, through everyone):"
        - "1: {base:0.6|magic} + {sp:0.8|magic}, heals you {flat:12} {sp_per:5/20}"
        - "2: breaks shields, {base:1.2|physical}"
        - "3: {base:0.7|true} + {sp:0.7|true}"
    nodes:
      ready:
        type: apply_effects
        targets: { type: self }
        on_hit: false
        effects:
          - { id: remove_status, status: sm_stance }        # (a fresh three)
          - { id: status, status: sm_stance, stacks: 3 }
          - { id: status, status: sm_stance_haste }
        next: ready_cue
      ready_cue:
        type: play_cue
        cue: sm_stance_on

  # ULTIMATE (F): Death by a Thousand Cuts. 8s (the boss bar): no abilities, only basic attacks, but they reach 20
  # blocks, come 20% faster and scale with spell power: both blades stab whoever he aims at (see the primary). The
  # enemy under his crosshair, in reach and in sight, glows for him (only he sees it).
  sm_ult:
    cooldown: 1200                   # (unused while ultimates charge up: config.yml ultimate-charge)
    active_tags: [swordmaster.cutting, state.aim_highlight]   # 1, 2, 3 are blocked_by it; who he'd reach glows
    display:
      name: "Death by a Thousand Cuts"
      icon: IRON_SWORD
      description:
        - "8s: only basic attacks, but they reach"
        - "20 blocks, 20% faster: both blades stab"
        - "who you aim at, {base:0.9|physical} + {sp:0.4|physical}"
        - "and {base:0.5|magic} + {sp:0.8|magic}; heals you"
        - "{flat:8} {sp_per:4/20}. Who you'd reach glows."
    nodes:
      open:
        type: play_cue
        cue: sm_ult_start
        next: faster
      faster:
        type: apply_effects
        targets: { type: self }
        on_hit: false
        effects:
          - { id: status, status: sm_cutting }
        next: time
      time:
        type: delay                  # the boss bar runs out
        ticks: 160
        boss_bar: true
        next: over
      over:
        type: apply_effects
        targets: { type: self }
        on_hit: false
        effects:
          - { id: remove_status, status: sm_cutting }

characters:
  swordmaster:
    name: "SwordMaster"
    weapon: "hidden:NETHERITE_SWORD" # the blade up next (netherite, or gold: forms), an icon only: not held in hand
    forms:                           # the blade up next in his hand
      - { while: swordmaster.gold_next, weapon: "hidden:GOLDEN_SWORD" }
    status_bar: sm_stance            # XP bar: Blade Stance's time left, its number the waves left
    stats:                           # see docs/character-stats.md
      health: 230                    # max HP
      armor: 15                      # damage taken x 100 / (100 + armor)
      base_damage: 38                # abilities deal % of this
      move_speed: 1.0                # x vanilla walking speed
      attack_speed: 1.25             # stabs per second
    passive_statuses: [sm_twin_blades]   # PASSIVE: Twin Blades
    passive:                         # explained in hotbar slot 9 (or on the weapon when slot 9 is taken)
      name: "Twin Blades"
      icon: NETHERITE_UPGRADE_SMITHING_TEMPLATE
      description:
        - "Two blades float by your head and take"
        - "turns attacking (the one up next is in"
        - "your hand). Netherite: physical damage,"
        - "+50% damage to shields. Gold: magic"
        - "damage, heals you on hit (spell power)."
    slots:
      primary: sm_primary            # LMB: Twin Blades (the blade up next)
      ability_1: sm_ab1              # 1: Twin Thrust
      ability_2: sm_ab2              # 2: Blade Guard
      ability_3: sm_ab3              # 3: Blade Stance
      ultimate: sm_ult               # F: Death by a Thousand Cuts
