# content: dreamer
# The Dreamer: an assassin who slips between the waking world and the Dream Realm.
# Format and all options: see README.md in this folder. Edit, then /ae reload.
#
# PASSIVE (Backstab): every damage effect of hers has  backstab: 1.5  - hitting a target from behind
# (outside the front 220 degrees of where they face) deals x1.5 and shows a crit.

statuses:
  dreamwalking:                      # Dreamwalk: gone from sight, ignored by every ability
    duration: 100                    # 5s...
    stacking: refresh
    tags: [ state.hidden, state.invisible, state.hasted, buff.dreamwalk ]   # buff.*: a buff (tethers copy it)
    break_on_damage: true            # ...or until you deal damage
  dream_touch:                       # your next primary fire blinds
    duration: 200                    # 10s to use it
    stacking: refresh
    once: true                       # used up by the first hit
    on_hit:
      - { id: status, status: blinded }
  blinded:
    duration: 40                     # 2s
    stacking: refresh
    tags: [state.blinded]

abilities:

  # PRIMARY: a quick dagger slash in front of you.
  dream_blade:
    cooldown: 10                     # 0.5s
    display:
      name: "Dream Blade"
      icon: GOLDEN_SWORD
      description:
        - "Quick slash in front of you."
        - "Crits from behind (x1.5)."
    nodes:
      slash:
        type: apply_effects
        targets: { type: cone, range: 2.8, angle: 80 }
        effects:
          - { id: damage, base: 1.0, backstab: 1.5 }   # 100% base damage
        next: slash_cue
      slash_cue:
        type: play_cue
        cue: sweep

  # 1: slip into the Dream Realm for 5s: hidden from other players (armor and held items too),
  # ignored by every ability, faster. Dealing damage wakes you up. Your next primary fire (within
  # 10s) also blinds.
  dreamwalk:
    cooldown: 240                    # 12s
    display:
      name: "Dreamwalk"
      icon: ENDER_EYE
      description:
        - "5s: invisible, untargetable and faster."
        - "Dealing damage wakes you. Your next"
        - "primary fire blinds."
    nodes:
      enter:
        type: apply_effects
        targets: { type: self }
        effects:
          - { id: status, status: dreamwalking }
          - { id: status, status: dream_touch }
        next: enter_cue
      enter_cue:
        type: play_cue
        cue: dream_enter

  # 2: dash where you look (up and down too, in mid-air too), damaging everyone you pass through,
  # the moment you pass them. If your Dream Echo is out, it dashes too: from where it stands TOWARD
  # the point your crosshair is on, so you converge and cross. Refreshes on player kills.
  crescent_rush:
    cooldown: 200                    # 10s
    refresh_on_kill: players         # "all" counts any kill (handy for testing on mannequins)
    display:
      name: "Crescent Rush"
      icon: PHANTOM_MEMBRANE
      description:
        - "Dash where you look, damaging everyone"
        - "you pass through. Your Echo repeats it."
        - "Refreshes on player kills."
    active_tags: [state.dashing, block.ability]
    interrupted_by: [state.stunned]
    nodes:
      echo_check:
        type: find_summon
        summon: dream_echo
        store: echo
        on: { found: both, none: rush }
      both:
        type: fork                   # you and the echo dash at the same time
        on: { out: rush, also: echo_rush }
      rush:
        type: dash
        speed: 1.8
        range: 9
        radius: 1.0                  # how wide the slash catches enemies
        flat: false                  # follows your aim up and down
        pierce: true                 # through enemies; walls stop it
        store: rush                  # rush_start / rush_end (for the trail)
        on: { passed: slash, miss: free }   # "passed" runs once for EACH enemy, as you reach them
      slash:
        type: apply_effects
        targets: { type: key, key: hit }     # the enemy just passed
        effects:
          - { id: damage, base: 1.4, backstab: 1.5 }   # 140% base damage
        next: slash_cue
      slash_cue:
        type: play_cue
        cue: sweep
        at: hit
      free:
        type: release_tags           # act again the moment the dash ends
        next: trail
      trail:
        type: play_cue
        cue: crescent
        at: rush_start
        to: rush_end
      echo_rush:
        type: dash
        mover: echo                  # the echo dashes...
        toward: cursor               # ...toward the point your crosshair is on (stops there if closer)
        speed: 1.8
        range: 9
        radius: 1.0
        flat: false
        pierce: true
        store: echo_rush
        on: { passed: echo_slash, miss: echo_trail }
      echo_slash:
        type: apply_effects
        targets: { type: key, key: hit }
        effects:
          - { id: damage, base: 1.4, backstab: 1.5 }
        next: echo_slash_cue
      echo_slash_cue:
        type: play_cue
        cue: sweep
        at: hit
      echo_trail:
        type: play_cue
        cue: crescent
        at: echo_rush_start
        to: echo_rush_end

  # 3: aim, then place a Dream Echo (a mannequin with your skin) on that spot, for 10s: left click
  # places it, right click cancels. Recast (press 3 again) to swap places with it. While it's out,
  # Crescent Rush makes it dash too.
  dream_echo:
    cooldown: 360                    # 18s, starts once you swap or the echo fades
    display:
      name: "Dream Echo"
      icon: ARMOR_STAND
      description:
        - "Place an Echo of yourself for 10s."
        - "Recast: swap places with it."
        - "It repeats your Crescent Rush."
    targeting: { shape: circle, range: 15, radius: 0.6, ground: true }   # where it stands
    nodes:
      create:
        type: summon_clone
        summon: dream_echo           # Crescent Rush finds it by this name
        at: aim                      # the spot you confirmed
        store: echo
        lifetime: 200                # 10s
        next: create_cue
      create_cue:
        type: play_cue
        cue: dream_echo
        next: wait
      wait:
        type: await_recast
        window: 200
        on: { recast: swap }
      swap:
        type: swap
        with: echo
        next: swap_cue
      swap_cue:
        type: play_cue
        cue: echo_swap

  # ULTIMATE (F): Dream Tempest. You vanish into the dream and watch from above: lifted 10 blocks up and
  # 8 back from the spot you cast it from, looking down at it, untargetable and unseen. For 3s (a boss
  # bar counts it down) blades of the dream slash everything within 5 blocks of that spot: 10 damage
  # every 0.2s, 150 in all. A ring on the ground shows everyone the edge. You can't move or use anything
  # meanwhile. Then you're back exactly where you were.
  dreamer_ult1:
    cooldown: 900                    # placeholder until ults charge from damage
    display:
      name: "Dream Tempest"
      icon: ECHO_SHARD
      description:
        - "Vanish and watch from above for 3s while"
        - "blades slash everything within 5 blocks of"
        - "where you stood: 150 damage in all."
        - "Then you return to that spot."
    active_tags: [state.untargetable, state.hidden, state.anchored, block.move, block.ability]
    nodes:
      vanish:
        type: play_cue
        cue: dream_enter
        next: rise
      rise:
        type: move_to                # the view from above, off to the side...
        up: 10
        back: 8                      # behind you (the way you faced)
        look: spot                   # looking at the spot
        store: origin                # ...over the spot you cast it from
        return: true                 # back there when it ends (also if it's cut short)
        next: split
      split:
        type: fork                   # the 3s timer and the slashing, side by side
        on: { out: last, also: slash }
      last:
        type: delay
        ticks: 60                    # 3s
        boss_bar: true
        next: over
      over:
        type: end_cast               # stops the slashing; you're put back
      slash:
        type: apply_effects
        targets: { type: radius, center: origin, radius: 5 }
        effects:
          - { id: damage, base: 0.25, knockback: false, ignore_iframes: true }   # 25% base damage a pulse
        next: slash_cue
      slash_cue:
        type: play_cue
        cue: dream_tempest
        at: origin
        next: ring
      ring:
        type: play_cue               # the edge of the area, on the ground, for everyone to see
        cue: dream_tempest_ring      # (drawn at 5 blocks: keep it in step with the radius above)
        at: origin
        next: again
      again:
        type: delay
        ticks: 4                     # every 0.2s
        next: slash

characters:
  dreamer:
    name: "Dreamer"
    weapon: GOLDEN_SWORD
    stats:                           # see docs/character-stats.md
      health: 180                    # max HP
      armor: 10                      # damage taken x 100 / (100 + armor)
      base_damage: 40                # abilities deal % of this
      move_speed: 1.1                # x vanilla walking speed
      attack_speed: 2.0              # basic attacks per second
    status_bar:                      # XP bar: drains over Dreamwalk's 5s, no number
      status: dreamwalking
      level: none
    slots:
      primary: dream_blade           # LMB
      ability_1: dreamwalk           # 1
      ability_2: crescent_rush       # 2
      ability_3: dream_echo          # 3, press 3 again to swap
      ultimate: dreamer_ult1         # F: Dream Tempest
