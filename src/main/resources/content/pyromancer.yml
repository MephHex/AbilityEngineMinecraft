# content: pyromancer
# The Pyromancer: fire bolts, a fireball, a wisp that hunts on its own, hot coals that scorch the ground where she
# lands, and a meteor out of the sky. Keep hitting and she overheats: blue flames, faster.
# Format and all options: see README.md in this folder. Edit, then /ae reload.
#
# PASSIVE (Overheat, the XP bar and hotbar slot 9): every enemy any of her abilities hits heats her up a stack (8 at
#   most; burning and her scorched ground don't count). The XP bar fills from empty to full with them and slot 9 counts
#   them. 3s without a hit and it's gone at once. Full: she OVERHEATS, and stays overheated as long as she keeps
#   hitting: blue flames, Fire Bolts every 5 ticks instead of 10, 15% faster. Overheated, the XP bar drains instead:
#   the time she has left before it ends (full again with every hit).

statuses:
  pyro_heat:                         # the gauge (XP bar: filled by its stacks; slot 9: their count)
    duration: 60                     # 3s without a hit and it's gone, all at once
    stacking: stack
    max_stacks: 8
    at_max: pyro_overheat            # full: she overheats
    positive: false                  # hers alone (a tether doesn't copy it)
  pyro_overheat:                     # overheated: until the gauge is empty
    duration: 0
    requires: pyro_heat              # ends when the gauge runs out
    tags: [state.overheated]         # blue flames (variants below)
    cue: pyro_overheat               # soul flames around her
    attack_speed: 2.0                # Fire Bolt every 5 ticks instead of 10
    move_speed: 1.15                 # +15%
    positive: false
  pyro_burn:                         # on fire
    duration: 60                     # 3s...
    stacking: refresh
    tags: [state.burning]            # looks on fire (no vanilla fire damage)
    tick:
      every: 10                      # ...2% max HP every 0.5s = 12% (ignores armor)
      effects:
        - { id: damage, max_hp: 0.02, knockback: false }
  pyro_coals:                        # Hot Coals: jumping higher
    duration: 120                    # 6s
    jump_boost: 3                    # Jump Boost III (the level: 2 = II, 4 = IV...)
    cue: pyro_coals                  # the coals, tossed from hand to hand
    positive: false                  # (a tether doesn't copy it: the scorch is hers anyway)
  pyro_scorched:                     # standing in her scorched ground: slowed
    duration: 15                     # (kept on every 0.5s while they stand in it)
    stacking: refresh
    move_speed: 0.65                 # -35%

abilities:

  # PRIMARY (LMB): Fire Bolt. A bolt of fire (1.6 blocks/tick, 28 blocks): 100% base damage as magic damage.
  pyro_primary:
    cooldown: 10                     # (the attack_speed stat sets it)
    display:
      name: "Fire Bolt"
      description:
        - "A bolt of fire: 100% base magic damage."
    nodes:
      shoot:
        type: projectile
        speed: 1.6
        size: 0.45
        range: 28
        lifetime: 40
        visual: "block:FIRE"
        visual_size: 0.35
        trail: pyro_bolt_trail
        on: { spawned: shoot_cue, hit_entity: hit, hit_block: fizzle }
      shoot_cue:
        type: play_cue
        cue: pyro_bolt_cast
      fizzle:
        type: play_cue
        cue: pyro_bolt_fizzle
        at: hit
      hit:
        type: apply_effects
        targets: { type: key, key: hit }
        effects:
          - { id: damage, base: 1.0, damage_type: magic, ignore_iframes: true }   # (overheated: 4 a second)
        count: struck
        next: heat
      heat:
        type: apply_effects          # Overheat: a stack per enemy hit (the same in every ability below)
        targets: { type: self }
        on_hit: false
        times: struck
        effects:
          - { id: status, status: pyro_heat }
        next: hit_cue
      hit_cue:
        type: play_cue
        cue: pyro_bolt_hit
        at: hit

  # 1: Fireball. A large fireball (1.1 blocks/tick, a slight drop) that explodes where it lands or on whoever it
  # hits: 160% base damage to enemies within 3.5 blocks, knocked back a little and burning (12% max HP over 3s).
  pyro_ab1:
    cooldown: 160                    # 8s
    display:
      name: "Fireball"
      icon: FIRE_CHARGE
      description:
        - "A fireball that explodes: 160% base"
        - "damage within 3.5 blocks, and they burn"
        - "(12% max HP over 3s)."
    nodes:
      throw:
        type: projectile
        speed: 1.1
        size: 0.9
        lifetime: 50                 # ~50 blocks
        visual: "block:FIRE"
        visual_size: 0.9
        trail: pyro_fireball_trail
        motion:
          - { type: gravity, amount: 0.01 }
        on: { spawned: throw_cue, hit_entity: explode, hit_block: explode }
      throw_cue:
        type: play_cue
        cue: pyro_fireball_cast
      explode:
        type: apply_effects
        targets: { type: radius, center: hit, radius: 3.5 }
        effects:
          - { id: damage, base: 1.6 }
          - { id: status, status: pyro_burn }
          - { id: knockback, from: hit, radius: 3.5, center: 0.8, edge: 0.3, lift: 0.3 }
        count: struck
        next: heat
      heat:
        type: apply_effects
        targets: { type: self }
        on_hit: false
        times: struck
        effects:
          - { id: status, status: pyro_heat }
        next: explode_cue
      explode_cue:
        type: play_cue
        cue: pyro_fireball_explode
        at: hit

  # 2: Hunting Wisp. Send a will-o'-wisp to a spot (aim preview, 25 blocks; quickcast: where you look). It waits
  # there up to 30s for an enemy to come within 7 blocks (the preview's circle; on the way there too), then hunts
  # the first one it finds (they glow while it does) and explodes on them: 140% base damage within 3 blocks, and
  # they burn. Nobody comes: it fades away.
  pyro_ab2:
    cooldown: 280                    # 14s
    targeting:
      shape: circle
      range: 25
      radius: 7                      # = how far it sees
      ground: true
    display:
      name: "Hunting Wisp"
      icon: GLOWSTONE_DUST
      description:
        - "Send a wisp to a spot: up to 30s it"
        - "waits for an enemy (7 blocks), hunts"
        - "them down (they glow) and explodes: 140%"
        - "base damage (3 blocks), and they burn."
    nodes:
      send:
        type: projectile
        speed: 0.6
        size: 0.6
        lifetime: 720                # flying there, 30s of waiting, a chase
        visual: "block:FIRE"
        visual_size: 0.5
        trail: pyro_wisp_trail
        trail_every: 2
        motion:
          # to the spot (1.2 blocks above the ground), waits 30s; an enemy within 7: after them (0.5/tick), only them
          - { type: seek, to: aim, up: 1.2, base: 0.6, hover: 600, range: 7, speed: 0.5, turn: 0.3, lock: true, mark: glowing }
        store: wisp
        on: { spawned: send_cue, hit_entity: explode, hit_block: explode, expired: fade }
      send_cue:
        type: play_cue
        cue: pyro_wisp_cast
      explode:
        type: apply_effects
        targets: { type: radius, center: hit, radius: 3 }
        effects:
          - { id: damage, base: 1.4 }
          - { id: status, status: pyro_burn }
        count: struck
        next: heat
      heat:
        type: apply_effects
        targets: { type: self }
        on_hit: false
        times: struck
        effects:
          - { id: status, status: pyro_heat }
        next: explode_cue
      explode_cue:
        type: play_cue
        cue: pyro_wisp_explode
        at: hit
      fade:
        type: play_cue
        cue: pyro_wisp_fade
        at: wisp                     # where it waited

  # 3: Hot Coals. She juggles a handful of hot coals for 6s (a boss bar): Jump Boost III, and every time she lands
  # (a jump, a fall) the coals scorch the ground under her for 4s (1.8 blocks): enemies who walk in are slowed 35%
  # and burn while they stay (and 3s after).
  pyro_ab3:
    cooldown: 300                    # 15s
    display:
      name: "Hot Coals"
      icon: COAL
      description:
        - "6s: Jump Boost III. Each landing scorches"
        - "the ground under you for 4s: enemies in"
        - "it are slowed 35% and burn."
    nodes:
      juggle:
        type: apply_effects
        targets: { type: self }
        on_hit: false
        effects:
          - { id: status, status: pyro_coals }
        next: split
      split:
        type: fork                   # the boss bar, and the landings
        on: { out: timer, also: landings }
      timer:
        type: delay
        ticks: 120
        boss_bar: true
      landings:
        type: landings               # every landing in the 6s, each on its own
        ticks: 120
        store: landing
        on: { landed: scorch }
      scorch:
        type: play_cue
        cue: pyro_coal_scorch
        at: landing
        next: smoulder
      smoulder:
        type: repeat                 # 4s: 8 x 0.5s
        times: 8
        every: 10
        on: { each: patch }
      patch:
        type: apply_effects
        targets: { type: radius, center: landing, radius: 1.8 }
        effects:
          - { id: status, status: pyro_scorched }
          - { id: status, status: pyro_burn }
        next: patch_cue                # (no Overheat: the ground keeps burning them, it isn't a hit)
      patch_cue:
        type: play_cue
        cue: pyro_coal_patch
        at: landing

  # ULTIMATE (F): Scorching Judgment. Mark an area (aim preview, 35 blocks, 6-block radius): everyone sees its edge
  # burning on the ground. A meteor comes down on it (~2s): 300% base damage to enemies within 6 blocks, knocked
  # back and burning. Then the ground stays scorched for 8s, the edge still showing: enemies inside take 15% base
  # damage every 0.5s and keep burning.
  pyro_ult1:
    cooldown: 1200                   # placeholder until ults charge from damage
    targeting:
      shape: circle
      range: 35
      radius: 6                      # = the meteor's and the scorched ground's (and the cue's ring: 6)
      ground: true
    display:
      name: "Scorching Judgment"
      icon: MAGMA_BLOCK
      description:
        - "Mark an area: a meteor crashes down"
        - "(~2s): 300% base damage (6 blocks). The"
        - "ground burns 8s: 15% base damage every"
        - "0.5s to enemies inside."
    nodes:
      mark:
        type: play_cue
        cue: pyro_judgment_cast
        next: split
      split:
        type: fork                   # the warning ring, and the meteor
        on: { out: warn, also: incoming }
      warn:
        type: repeat                 # the edge, until it lands (9 x 0.25s)
        times: 9
        every: 5
        on: { each: ring, out: ~ }
      ring:
        type: play_cue
        cue: pyro_judgment_ring
        at: aim
      incoming:
        type: play_cue
        cue: pyro_meteor_fall
        at: aim
        next: meteor
      meteor:
        type: projectile             # out of the sky: 28 blocks up, 10 back toward her, at the spot (~42 ticks)
        from: aim
        up: 28
        back: 10
        toward: aim
        speed: 0.7
        size: 1.5
        lifetime: 80
        visual: "block:MAGMA_BLOCK"
        visual_size: 2.2
        trail: pyro_meteor_trail
        on: { hit_entity: impact, hit_block: impact, expired: impact }
      impact:
        type: apply_effects          # wherever it touched down first: the blast is on the marked spot
        targets: { type: radius, center: aim, radius: 6 }
        effects:
          - { id: damage, base: 3.0 }
          - { id: status, status: pyro_burn }
          - { id: knockback, from: aim, radius: 6, center: 1.2, edge: 0.4, lift: 0.5 }
        count: struck
        next: impact_heat
      impact_heat:
        type: apply_effects
        targets: { type: self }
        on_hit: false
        times: struck
        effects:
          - { id: status, status: pyro_heat }
        next: impact_cue
      impact_cue:
        type: play_cue
        cue: pyro_meteor_impact
        at: aim
        next: scorch
      scorch:
        type: repeat                 # scorched ground: 16 x 0.5s = 8s
        times: 16
        every: 10
        on: { each: scorch_hit, out: ~ }
      scorch_hit:
        type: apply_effects
        targets: { type: radius, center: aim, radius: 6 }
        effects:
          - { id: damage, base: 0.15, knockback: false }
          - { id: status, status: pyro_burn }
        count: struck
        next: scorch_heat
      scorch_heat:
        type: apply_effects
        targets: { type: self }
        on_hit: false
        times: struck
        effects:
          - { id: status, status: pyro_heat }
        next: scorch_cue
      scorch_cue:
        type: play_cue
        cue: pyro_scorched
        at: aim
        next: scorch_ring
      scorch_ring:
        type: play_cue
        cue: pyro_judgment_ring
        at: aim

characters:
  pyromancer:
    name: "Pyromancer"
    weapon: BLAZE_ROD
    stats:                           # see docs/character-stats.md
      health: 180                    # max HP
      armor: 0                       # damage taken x 100 / (100 + armor)
      base_damage: 30                # abilities deal % of this
      move_speed: 1.0                # x vanilla walking speed
      attack_speed: 2.0              # Fire Bolts per second
    status_bar: { status: pyro_heat, fill: stacks, level: none }   # XP bar: Overheat, empty to full (8), no number
    status_items:
      - status: pyro_heat              # slot 9: Overheat's stacks, one per enemy hit
        hotbar: 9
        icon: BLAZE_POWDER
        name: "Overheat"
        description:
          - "Each enemy you hit: a stack. 8 stacks:"
          - "you overheat (faster bolts, +15% speed)."
          - "3s without a hit: back to 0."
    forms:
      - while: state.overheated      # overheated: the XP bar drains over the 3s she has left without a hit (full again on
        slots: {}                    # every hit), so she sees when it will end. Nothing else changes.
        status_bar: { status: pyro_heat, level: none }
    variants:
      - while: state.overheated      # Overheat: blue flames instead of orange ones
        cue_suffix: _blue            # every pyro_x cue plays as pyro_x_blue
        visuals: { "block:FIRE": "block:SOUL_FIRE" }   # and her fire bolts, fireballs and wisps are soul fire
    slots:
      primary: pyro_primary          # LMB: Fire Bolt (no RMB)
      ability_1: pyro_ab1            # 1: Fireball
      ability_2: pyro_ab2            # 2: Hunting Wisp
      ability_3: pyro_ab3            # 3: Hot Coals
      ultimate: pyro_ult1            # F: Scorching Judgment
