# content: whisperer
# The Whisperer: a diver of the dream Chorus. Hears the wounded, slips through the veil to reach them,
# binds them with a whisper, and sends a Shade to finish them off.
# Format and all options: see README.md in this folder. Edit, then /ae reload.
#
# PASSIVE (Heard in Dreams): enemies below 40% HP within 20 blocks are "heard" by the Chorus:
#   - They glow for the Whisperer only (other players don't see it), through walls.
#   - Moving toward a heard enemy within 15 blocks: +15% move speed.
#   - Hotbar slot 9 ("Chorus Ear"): the stack is how many are heard right now; empty when none.
#
# ULTIMATE (F): Into the Veil. A 1v1 duel where you stand: for 7s you and your target only see each other
#   (in Darkness), and nobody else can hit, heal or buff either of you (nor can you two touch anyone else).
#   Your abilities are seen only by the two of you; everyone else sees a red mote (you) and a green one.

statuses:
  heard_rush:                        # moving toward a heard enemy
    duration: 8                      # kept up while it lasts (the hearing refreshes every 0.2s)
    stacking: refresh
    move_speed: 1.15                 # +15%
    tags: [state.heard_rush]
    positive: false                  # the passive's own boost: not a buff to share or strip
  binding_focus:                     # holding a Binding Whisper: slower
    duration: 40
    move_speed: 0.8                  # -20%
    positive: false
  darkness:                          # vanilla Darkness (the world pulses dark) and Blindness
    duration: 80
    stacking: refresh
    tags: [state.darkness, state.blinded]
  veil_shroud:                       # Into the Veil: both duelists are in Darkness while it lasts
    duration: 140                    # 7s (taken off when the duel ends early)
    tags: [state.darkness]
    positive: false
  veil_fury:                         # Into the Veil: you hit harder while the duel lasts
    duration: 120                    # 6s (the duel lasts 7s: the last 1s without it)
    damage_dealt: 1.1                # +10%
    tags: [buff.veil_fury]
  whisper_wither:                    # Binding Whisper: withering, like Wither II (black hearts)
    duration: 50                     # 2.5s...
    stacking: refresh
    tags: [state.withered]
    tick:
      every: 10                      # ...2% of their max HP every 0.5s = 10% (+1% per 10 damage), true damage
      effects:
        - { id: damage, max_hp: 0.02, max_hp_dmg: 0.0002, type: true, knockback: false }
  step_fury:                         # Dream Step: out of the veil, hitting harder until it pulls you back
    duration: 60                     # 3s
    stacking: refresh
    damage_dealt: 1.1                # +10%
    tags: [buff.step_fury]

abilities:

  # PRIMARY (LMB): Sickle Rake. A melee hit on the enemy in front (3 blocks): 100% base damage (40 = 4 HP).
  whisperer_primary:
    cooldown: 20                     # 0.7s between hits (the attack_speed stat sets it: 20 / 1.4 = 14 ticks)
    display:
      name: "Sickle Rake"
      description:
        - "A melee rake (3 blocks): 100% base"
        - "damage. 0.7s between hits."
    nodes:
      aim:
        type: acquire_target
        query: { type: hitscan, range: 3, ray_size: 0.6, angle: 30 }   # (missed: the nearest within 15 degrees)
        on: { hit: rake, miss: whiff }
      whiff:
        type: play_cue
        cue: sweep
      rake:
        type: apply_effects
        targets: { type: key, key: target }
        effects:
          - { id: damage, base: 1.0 }             # 100% base damage
        next: rake_cue
      rake_cue:
        type: play_cue
        cue: sickle_rake
        at: target

  # 1: Dream Step. Slip through the veil: blink up to 8 blocks where you look (walls stop you). Enemies within
  # 3 blocks of where you come out are blinded for 0.75s, and you deal 10% more damage. A rift stays where you left
  # for 3s; when it closes, it pulls you back into it (you can't step back early). The cooldown starts as you're back.
  whisperer_ab1:
    cooldown: 200                    # 10s
    cooldown_starts: end             # (once you're pulled back)
    display:
      name: "Dream Step"
      icon: PHANTOM_MEMBRANE
      description:
        - "Blink up to 8 blocks; enemies near where"
        - "you come out are blinded 0.75s, and you"
        - "deal 10% more damage. After 3s the rift"
        - "pulls you back to where you left."
    nodes:
      rift_here:
        type: remember_spot          # where you left: the rift
        of: caster
        store: rift
        next: step_cue
      step_cue:
        type: play_cue
        cue: dream_step
        next: step
      step:
        type: dash                   # so fast it's a blink; walls stop it, enemies don't
        speed: 4
        range: 8
        pierce: true
        on: { hit: arrive, miss: arrive }
      arrive:
        type: apply_effects
        targets: { type: radius, radius: 3 }
        effects:
          - { id: status, status: blinded, duration: 15 }   # 0.75s
        next: fury
      fury:
        type: apply_effects          # +10% damage until the rift pulls you back
        targets: { type: self }
        on_hit: false
        effects:
          - { id: status, status: step_fury }
        next: arrive_cue
      arrive_cue:
        type: play_cue
        cue: dream_arrive
        next: split
      split:
        type: fork                   # the rift's 3s, and its shimmer, side by side
        on: { out: back, also: shimmer }
      back:
        type: delay                  # 3s out of the veil...
        ticks: 60
        next: return
      return:
        type: apply_effects          # ...then the rift pulls you back
        targets: { type: self }
        on_hit: false
        effects:
          - { id: teleport, to: rift }
          - { id: remove_status, status: step_fury }
        next: return_cue
      return_cue:
        type: play_cue
        cue: dream_arrive
        next: closed
      closed:
        type: play_cue
        cue: rift_close
        at: rift
        next: done
      done:
        type: end_cast
      shimmer:
        type: play_cue
        cue: dream_rift
        at: rift
        next: shimmer_wait
      shimmer_wait:
        type: delay
        ticks: 5
        next: shimmer

  # 2: Binding Whisper. Tether an enemy in front of you (8 blocks) and charge it for 2s; you can move and
  # attack meanwhile, 20% slower. It holds while they stay within 9 blocks and in sight (a wall for more
  # than 0.5s breaks it), and until you're stunned or silenced. Held all the way: Blindness and a wither for 2.5s
  # (10% of their max HP, +1% per 10 damage, true damage). Broken: 40% of the cooldown back. No one to tether: nothing is spent.
  whisperer_ab2:
    cooldown: 240                    # 12s
    cooldown_starts: manual          # only once someone is tethered
    display:
      name: "Binding Whisper"
      icon: SCULK_VEIN
      description:
        - "Tether an enemy (8 blocks), charge 2s."
        - "Held: Blindness and wither 2.5s:"
        - "{max_hp:0.1|true} {max_hp_dmg:0.01/10|true}."
        - "Breaks past 9 blocks, out of sight, or"
        - "if you're stunned/silenced: 40% cd back."
    nodes:
      aim:
        type: acquire_target
        query: { type: hitscan, range: 8, ray_size: 0.4 }
        on: { hit: bind, miss: ~ }
      bind:
        type: start_cooldown
        next: focus
      focus:
        type: apply_effects
        targets: { type: self }
        on_hit: false
        effects:
          - { id: status, status: binding_focus }
        next: bind_cue
      bind_cue:
        type: play_cue
        cue: whisper_bind
        at: target
        next: hold
      hold:
        type: tether
        target: target
        duration: 40                 # 2s
        range: 9                     # breaks past this (cast range 8)
        sight_grace: 10              # a wall in between for more than 0.5s breaks it
        break_on: [state.stunned, state.silenced]
        cue: whisper_tether          # drawn as whisper_tether_1..4 as it charges
        stages: 4
        on: { complete: curse, broken: snap }
      curse:
        type: apply_effects
        targets: { type: key, key: target }
        effects:
          - { id: status, status: blinded, duration: 50 }   # 2.5s
          - { id: status, status: whisper_wither }          # 10% max HP over 2.5s
        next: curse_cue
      curse_cue:
        type: play_cue
        cue: whisper_curse
        at: target
        next: unfocus
      snap:
        type: reduce_cooldown        # broken: 40% of the 12s back
        ability: whisperer_ab2
        ticks: 96
        next: snap_cue
      snap_cue:
        type: play_cue
        cue: whisper_snap
        at: target
        next: unfocus
      unfocus:
        type: apply_effects
        targets: { type: self }
        on_hit: false
        effects:
          - { id: remove_status, status: binding_focus }

  # 3: Chorus Shade. Send a Shade out. It flies through terrain and has a body enemies can hit: 60 design HP
  # (6 HP) kills it. It homes (12 blocks/s) on the nearest HEARD enemy however far, or else on any enemy
  # within 6 blocks of it; while it homes only its 8s lifetime limits it. With nobody to chase it flies
  # straight on (8 blocks/s) for 12 blocks, then hovers there for 3s, still looking. The first enemy it hits takes
  # 30 + 120% spell power + 50% base damage (magic), and if that leaves them below 10% HP they're executed. Then it
  # dissolves.
  whisperer_ab3:
    cooldown: 320                    # 16s
    display:
      name: "Chorus Shade"
      icon: VEX_ARMOR_TRIM_SMITHING_TEMPLATE
      description:
        - "A Shade flies out through walls (12"
        - "blocks, then hovers 3s). Homes on heard"
        - "enemies, or anyone within 6 blocks;"
        - "enemies can kill it. Hit: {flat:30|magic}"
        - "+ {sp:1.2|magic} + {base:0.5|magic},"
        - "executes below 10% HP."
    nodes:
      launch:
        type: projectile
        speed: 0.2                   # (the seek below sets its speed every tick: 8 blocks/s straight, 12 homing)
        size: 0.8
        lifetime: 160                # 8s at most (the limit while it homes)
        visual: "entity:VEX"
        health: 60                   # its body: enemies can kill it (6 HP)
        through_blocks: true         # terrain doesn't stop it
        motion:
          - { type: seek, range: 6, speed: 0.6, base: 0.4, turn: 0.35, max_distance: 12, hover: 60 }
        store: shade
        on: { spawned: aura_cue, hit_entity: strike, expired: fade, destroyed: slain }
      aura_cue:                      # its aura (just the look now: no more Darkness / Blindness)
        type: play_cue
        cue: shade_aura
        at: shade
        next: aura_wait
      aura_wait:
        type: delay
        ticks: 5
        next: aura_cue
      strike:
        type: apply_effects
        targets: { type: key, key: hit }
        effects:
          - { id: damage, amount: 30, sp: 1.2, base: 0.5, type: magic }   # 30 + 120% spell power + 50% base damage
        next: finish_check
      finish_check:
        type: health_below           # left below 10%: executed
        target: hit
        share: 0.1
        on: { below: execute, above: dissolve }
      execute:
        type: apply_effects
        targets: { type: key, key: hit }
        effects:
          - { id: damage, max_hp: 1.0, knockback: false, ignore_iframes: true }   # all of it, true damage
        next: execute_cue
      execute_cue:
        type: play_cue
        cue: shade_execute
        at: hit
        next: dissolve
      dissolve:
        type: play_cue
        cue: shade_dissolve
        at: hit
        next: end
      fade:
        type: play_cue
        cue: shade_dissolve
        at: shade                    # where it ended
        next: end
      slain:
        type: play_cue               # an enemy killed it
        cue: shade_dissolve
        at: shade
        next: end
      end:
        type: end_cast

  # ULTIMATE (F): Into the Veil. Pick an enemy in front of you (5 blocks). They get a 0.5s warning (a
  # whisper and a pulse of darkness), then you're both pulled into the veil for 7s, right where you stand:
  # you only see each other, and nobody else can hit, heal or buff either of you (you can't touch anyone
  # else either). You hit 10% harder (for the first 6s).
  # If they die in there it ends at once and you heal 40% of your missing health; if you die, it ends too. Nobody in front of you: nothing
  # spent.
  whisperer_ult1:
    cooldown: 900                    # placeholder until ults charge from damage
    cooldown_starts: manual          # only once someone is picked
    display:
      name: "Into the Veil"
      icon: SCULK_SHRIEKER
      description:
        - "Pull an enemy (5 blocks) into a 7s duel:"
        - "you only see each other; no one else can"
        - "touch either of you. +10% damage 6s."
        - "Win: heal 40% of your missing health."
    nodes:
      aim:
        type: acquire_target
        query: { type: hitscan, range: 5, ray_size: 0.6 }
        on: { hit: picked, miss: ~ }
      picked:
        type: start_cooldown
        next: warn
      warn:
        type: apply_effects          # the warning: a pulse of darkness
        targets: { type: key, key: target }
        effects:
          - { id: status, status: darkness, duration: 10 }
        next: warn_cue
      warn_cue:
        type: play_cue
        cue: veil_warning
        at: target
        next: warn_wait
      warn_wait:
        type: delay
        ticks: 10                    # 0.5s
        next: enter
      enter:
        type: apply_effects
        targets: { type: self }
        on_hit: false
        effects:
          - { id: status, status: veil_fury }
          - { id: status, status: veil_shroud }
        next: shroud
      shroud:
        type: apply_effects          # the target: Darkness too
        targets: { type: key, key: target }
        effects:
          - { id: status, status: veil_shroud }
        next: enter_cue
      enter_cue:
        type: play_cue
        cue: veil_enter
        at: target
        next: duel
      duel:
        type: veil
        target: target
        duration: 140                # 7s (a boss bar)
        on: { won: won, out: over }
      won:
        type: apply_effects          # they died in there: heal 40% of your missing health
        targets: { type: self }
        on_hit: false
        effects:
          - { id: heal, missing_hp: 0.4 }
          - { id: remove_status, status: veil_fury }
          - { id: remove_status, status: veil_shroud }
        next: over_cue
      over:
        type: apply_effects
        targets: { type: self }
        on_hit: false
        effects:
          - { id: remove_status, status: veil_fury }
          - { id: remove_status, status: veil_shroud }
        next: lift_shroud
      lift_shroud:
        type: apply_effects          # (the target's Darkness ends with the duel too)
        targets: { type: key, key: target }
        affects: all
        effects:
          - { id: remove_status, status: veil_shroud }
        next: over_cue
      over_cue:
        type: play_cue
        cue: veil_exit

characters:
  whisperer:
    name: "Whisperer"
    weapon: NETHERITE_HOE            # the sickle
    stats:                           # see docs/character-stats.md
      health: 200                    # max HP
      armor: 10                      # damage taken x 100 / (100 + armor)
      base_damage: 40                # abilities deal % of this (100% = 4 HP)
      move_speed: 1.05               # x vanilla walking speed
      attack_speed: 1.40             # rakes per second (0.7s: 14 ticks)
    hearing:                         # PASSIVE: Heard in Dreams
      below: 0.4                     # below 40% HP...
      range: 20                      # ...within 20 blocks: heard
      toward: { range: 15, status: heard_rush }   # moving toward one within 15: +15% speed
      hotbar: 9
      icon: ECHO_SHARD
      name: "Chorus Ear"
      description:
        - "Enemies below 40% HP within 20 blocks"
        - "are heard: they glow for you only, even"
        - "through walls. Moving toward one within"
        - "15 blocks: +15% move speed."
    passive:                         # explained in hotbar slot 9 (or on the weapon when slot 9 is taken)
      name: "Heard in Dreams"
      icon: ECHO_SHARD
      description:
        - "Enemies below 40% HP within 20 blocks"
        - "are heard: they glow for you only, even"
        - "through walls. Moving toward one within"
        - "15 blocks: +15% move speed."
    slots:
      primary: whisperer_primary     # LMB: Sickle Rake (no RMB)
      ability_1: whisperer_ab1       # 1: Dream Step (press again: back to the rift)
      ability_2: whisperer_ab2       # 2: Binding Whisper
      ability_3: whisperer_ab3       # 3: Chorus Shade
      ultimate: whisperer_ult1       # F: Into the Veil
