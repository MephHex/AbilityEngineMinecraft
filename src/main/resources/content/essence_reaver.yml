# content: essence_reaver
# Essence Reaver: a sustain fighter that heals by dealing damage and stores extra healing as Overflow.
# Format and all options: see README.md in this folder. Edit, then /ae reload.
#
# Overflow: excess healing becomes a decaying shield (yellow absorption hearts): effects with
#   overflow: true   (on heal, or on damage with lifesteal). Tune per effect with
#   overflow_max (design HP, default 150) and overflow_decay (per second, default 25).
# Damage types: his weapon hits are physical, his soul magic (Essence Absorption's recall, Soul Rend's backlash) is magic.
# The passive (Vital Overflow) is explained by the item in hotbar slot 9.

statuses:
  soul_rend_ready:                   # Soul Rend: your next basic attack rends (see forms)
    duration: 200                    # 10s to land it
    tags: [buff.soul_rend]
    positive: false                  # an ultimate's charge, not a buff to share (a bond won't copy it)

abilities:

  # PRIMARY + PASSIVE (Vital Overflow): a short swing in front of you. Swings that HIT something charge
  # the passive (swinging at the air doesn't): after two, your next swing is a wide cleave instead,
  # which heals you for 50% of the damage it deals (excess becomes Overflow).
  essence_reaver_primary:
    cooldown: 12                     # 0.6s between swings
    display:
      name: "Reaver Strike"
      icon: IRON_HOE
      description:
        - "Melee swing: {base:1.0|physical}."
        - "After 2 swings that hit, the next one"
        - "cleaves (Vital Overflow, slot 9)."
    nodes:
      ready:
        type: counter                # is the cleave charged? (only looks, doesn't count)
        counter: reaver_swings       # remembered between swings (a plain resource)
        every: 3
        peek: true
        on: { trigger: use_up, out: swing }
      use_up:
        type: counter                # counts to 3 and resets: the charge is spent
        counter: reaver_swings
        every: 3
        on: { trigger: cleave }
      swing:
        type: apply_effects
        targets: { type: cone, range: 4, angle: 70 }
        count: swing_hits            # how many it hit
        effects:
          - { id: damage, base: 1.0, type: physical }   # 100% base damage
        next: swing_cue
      swing_cue:
        type: play_cue
        cue: sweep
        next: landed
      landed:
        type: switch                 # hit nobody: the passive doesn't charge
        key: swing_hits
        on: { "0": ~, default: charge }   # ~ = nothing
      charge:
        type: counter                # a swing that hit: +1 (never reaches 3 here, the peek saw to that)
        counter: reaver_swings
        every: 3
      cleave:
        type: apply_effects
        targets: { type: cone, range: 4.5, angle: 140 }
        effects:
          - { id: damage, base: 1.3, type: physical, lifesteal: 0.5, overflow: true }   # heals 50% of what it deals
        next: cleave_cue
      cleave_cue:
        type: play_cue
        cue: reaver_cleave

  # 1: a bolt of quintessence that attaches to the first enemy hit (20% base damage + 30% spell power, physical).
  # Recast (press 1 again, within 5s): recall it through them: 10% of their max HP (+1% per 10 spell power) as magic
  # damage, pull them toward you, heal for the damage dealt.
  # The cooldown starts once the recall is used or the 5s run out.
  essence_reaver_ab1:
    cooldown: 200                    # 10s
    display:
      name: "Essence Absorption"
      icon: GHAST_TEAR
      description:
        - "Bolt: {base:0.2|physical} + {sp:0.3|physical},"
        - "attaches to the first enemy hit. Recast:"
        - "recall it, {max_hp:0.1|magic}"
        - "{max_hp_sp:0.01/10|magic}: pulls them in"
        - "and heals you for it (excess: Overflow)."
    nodes:
      fire:
        type: projectile
        speed: 1.6
        size: 0.4
        range: 25
        lifetime: 40
        visual: GHAST_TEAR
        on: { hit_entity: attach }   # a miss just ends it
      attach:
        type: apply_effects
        targets: { type: key, key: hit }
        effects:
          - { id: damage, base: 0.2, sp: 0.3, type: physical, knockback: false }   # 20% base damage + 30% spell power, no vanilla shove
        next: mark
      mark:
        type: start_cue
        cue: essence_mark            # soul flames on them while it's attached
        at: hit
        next: wait
      wait:
        type: await_recast
        window: 100                  # 5s to recall
        on: { recast: recall }
      recall:
        type: apply_effects
        targets: { type: key, key: hit }
        effects:
          - { id: damage, max_hp: 0.1, max_hp_sp: 0.001, type: magic, lifesteal: 1.0, overflow: true, knockback: false }   # 10% max HP, +1% per 10 spell power; no vanilla shove...
          - { id: knockback, from: caster, radius: 30, center: -0.9, edge: -0.9, lift: 0.25 }   # ...just the pull
        next: recall_cue
      recall_cue:
        type: play_cue
        cue: essence_recall
        at: hit
        to: caster

  # 2: dash through enemies, leaving a spirit echo where you started. 0.6s later the echo lashes out
  # from there to wherever you are THEN (not where the dash ended), stunning everyone along the line and dealing
  # 20 + 20% base damage (physical).
  # You're free to act again as soon as the dash ends.
  essence_reaver_ab2:
    cooldown: 180                    # 9s
    display:
      name: "Lifeline Step"
      icon: PHANTOM_MEMBRANE
      description:
        - "Dash through enemies. 0.6s later your echo"
        - "lashes from where you started to where"
        - "you are: everyone on the line is stunned"
        - "and takes {flat:20|physical} + {base:0.2|physical}."
    active_tags: [state.dashing, block.ability]   # only during the dash itself (released below)
    interrupted_by: [state.stunned]
    nodes:
      echo_mark:
        type: play_cue
        cue: spirit_echo             # where you started
        next: step
      step:
        type: dash
        speed: 1.6
        range: 8
        flat: true
        pierce: true                 # through enemies; only walls and range stop it
        store: path                  # writes path_start / path_end
        on: { miss: free }           # with pierce it always ends as a "miss"
      free:
        type: release_tags           # dash over: act again while the echo is still coming
        next: wait
      wait:
        type: delay
        ticks: 12                    # 0.6s
        next: echo
      echo:
        type: apply_effects
        targets: { type: path, from: path_start, to: caster, width: 1.6 }   # to where you are now
        effects:
          - { id: damage, amount: 20, base: 0.2, type: physical }   # 20 + 20% base damage
          - { id: status, status: stun, duration: 16 }   # 0.8s
        next: echo_cue
      echo_cue:
        type: play_cue
        cue: echo_path
        at: path_start
        to: caster

  # 3: meditate for up to 2s: heal 60 (+10 per 10 spell power) and take 40% less damage, but you can't move, attack
  # or use abilities. Press 3 again to stop early. Stun or silence breaks it.
  essence_reaver_ab3:
    cooldown: 300                    # 15s
    display:
      name: "Meditation"
      icon: SOUL_LANTERN
      description:
        - "Up to 2s: heal {flat:60} {sp_per:10/10}"
        - "and take 40% less damage. Can't move,"
        - "attack or use abilities. Press again to"
        - "stop early."
    mode: { type: channel, period: 5, duration: 40 }     # a heal every 0.25s for 2s: 8 heals
    cancel_on_repress: true
    aura: meditation                 # a looping cue for the whole cast
    active_tags: [state.meditating, state.resistant, block.move, block.ability]
    interrupted_by: [state.stunned, state.silenced]      # state.* tags: see the Foldstep note
    nodes:
      heal:
        type: apply_effects
        targets: { type: self }
        effects:
          - { id: heal, amount: 7.5, sp: 0.125 }   # x8: 60, +10 per 10 spell power (100% of it)

  # ULTIMATE 2 (F): Soul Rend. Your next basic attack (within 10s) is a rend: the enemy you strike is
  # knocked back and stunned while flying, and their SOUL is torn out where they stood.
  #   - The soul looks like them, glows and can be attacked (60% of their max HP). Half the damage it
  #     takes also hits its owner.
  #   - Its owner is tethered to it for 6s: they can stay near it, or flee past 12 blocks, which snaps
  #     the tether: the soul vanishes, but they're slowed for 3s.
  #   - Destroy the soul and it slams back into its owner: 15% of their max HP (+1% per 10 spell power), magic,
  #     and you heal for all of it (excess becomes Overflow)
  #     (excess becomes Overflow).
  # A swing that misses keeps the rend ready.
  essence_reaver_ult2:
    stealable: false                 # Stolen Fable can't take it: the rend is the Reaver's own primary while it's ready (a form)
    cooldown: 900                    # placeholder until ults charge from damage
    display:
      name: "Soul Rend"
      icon: SOUL_LANTERN
      description:
        - "Your next basic attack: {base:1.15|physical},"
        - "tears the enemy's soul out and knocks them"
        - "back, stunned. Hurt the soul: half hits them"
        - "too. Kill it: it snaps back, {max_hp:0.15|magic}"
        - "{max_hp_sp:0.01/10|magic} to them, and heals you"
        - "for it (excess: Overflow)."
    nodes:
      ready:
        type: apply_effects
        targets: { type: self }
        effects:
          - { id: status, status: soul_rend_ready }
        next: ready_cue
      ready_cue:
        type: play_cue
        cue: soul_rend_ready

  # Soul Rend's strike: the primary while it's ready (see forms). Aimed at ONE enemy in reach.
  essence_reaver_rend:
    cooldown: 12
    display:
      name: "Soul Rend"
      icon: SOUL_LANTERN
      description:
        - "Rend the enemy you strike: {base:1.15|physical},"
        - "knocked back and stunned, their soul left"
        - "behind."
    nodes:
      aim:
        type: acquire_target         # the enemy you swing at (a generous melee reach)
        query: { type: hitscan, range: 4, ray_size: 1.2 }
        on: { hit: spend, miss: whiff }
      whiff:
        type: play_cue               # missed: the rend stays ready
        cue: sweep
      spend:
        type: apply_effects
        targets: { type: self }
        effects:
          - { id: remove_status, status: soul_rend_ready }
        next: strike                 # the hit first: it lands even if the soul can't appear
      strike:
        type: apply_effects
        targets: { type: key, key: target }
        effects:
          - { id: damage, base: 1.15, type: physical, knockback: false }   # 115% base damage
          - { id: status, status: stun, duration: 20 }   # stunned while flying back (1s)
          - { id: knockback, from: caster, radius: 6, center: 1.8, edge: 1.8, lift: 0.5 }
        next: tear
      tear:
        type: summon_clone           # their soul, where they stand (a look-alike of them)
        summon: rent_soul
        of: target
        health_share: 0.6            # can be attacked (and killed): 60% of their max HP
        glowing: true
        lifetime: 120                # 6s
        store: soul                  # also stores soul_at: where it was torn out (they only start
        next: tether                 # flying next tick, so that's still where they stood)
      tether:
        type: link                   # owner -> their soul: half of what the soul takes hits them too
        from: target
        name: soul_tether
        target: soul
        range: 14
        mirror: 0.5
        cue: soul_tether
        next: rend_cue
      rend_cue:
        type: play_cue
        cue: soul_rend
        at: soul
        next: split
      split:
        type: fork                   # watch the distance, and wait for the soul's fate, side by side
        on: { out: watch, also: fate }
      fate:
        type: await_summon
        summon: rent_soul
        on: { destroyed: shatter }   # gone (6s over, or fled): nothing more
      shatter:
        type: play_cue               # it slams back into its owner
        cue: soul_return
        at: soul_at
        to: target
        next: backlash
      backlash:
        type: apply_effects
        targets: { type: key, key: target }
        effects:
          - { id: damage, max_hp: 0.15, max_hp_sp: 0.001, type: magic, lifesteal: 1.0, overflow: true, overflow_max: 200, knockback: false }   # 15% max HP, +1% per 10 spell power; you heal all of it
      watch:
        type: delay
        ticks: 5
        next: still_there
      still_there:
        type: find_summon
        summon: rent_soul
        store: soul
        on: { found: near }          # none: destroyed or gone, stop watching
      near:
        type: in_range
        center: soul
        target: target
        radius: 30
        on: { inside: watch, outside: fled }
      fled:
        type: dismiss_summon         # they ran: the soul vanishes...
        summon: rent_soul
        next: fled_slow
      fled_slow:
        type: apply_effects          # ...and they're slowed
        targets: { type: key, key: target }
        effects:
          - { id: status, status: slow, duration: 60 }
        next: fled_cue
      fled_cue:
        type: play_cue
        cue: tether_break
        at: target

characters:
  essence_reaver:
    name: "Essence Reaver"
    weapon: NETHERITE_HOE
    stats:                           # see docs/character-stats.md
      health: 250                    # max HP
      armor: 25                      # damage taken x 100 / (100 + armor)
      base_damage: 35                # abilities deal % of this
      move_speed: 1.0                # x vanilla walking speed
      attack_speed: 1.67             # basic attacks per second
    passive:                         # hotbar slot 9
      name: "Vital Overflow"
      icon: GLISTERING_MELON_SLICE
      description:
        - "After 2 swings that hit, your next one"
        - "cleaves wide ({base:1.3|physical}) and heals"
        - "you for 50% of the damage it deals."
        - "Excess healing: Overflow, a shield that"
        - "fades."
    slots:
      primary: essence_reaver_primary  # LMB
      ability_1: essence_reaver_ab1  # 1, press 1 again to recall
      ability_2: essence_reaver_ab2  # 2
      ability_3: essence_reaver_ab3  # 3, press 3 again to stop early
      ultimate: essence_reaver_ult2  # F: Soul Rend (Ultimate 1, Last Standing: not built yet)
    forms:
      - while: buff.soul_rend        # Soul Rend is ready: your basic attack rends
        slots: { primary: essence_reaver_rend }
