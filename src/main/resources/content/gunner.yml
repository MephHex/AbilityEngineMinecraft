# content: gunner
# The Gunner: a gunslinger who hunts casters: a shotgun and a revolver, a smoke grenade that
# blinds, and a counterspell that turns a blocked spell into speed.
# Format and all options: see README.md in this folder. Edit, then /ae reload.
#
# PASSIVE 1 (Null Ward): after 6s out of combat (no damage dealt or taken) the next debuff doesn't land.
#   Blocking one uses it up; it recharges 6s after your last hit or the block, whichever is later. Shown in
#   hotbar slot 9 (an Eye of Ender): glinting = ready, otherwise the count is the seconds left.
#
# PASSIVE 2 (Two Guns): LMB fires the SHOTGUN (2 shells), RMB the REVOLVER (6 bullets). Using one puts it
#   in your hand (the other is holstered); the ammo in slot 8 is the one in your hand.
#   A gun that runs dry reloads by itself (shotgun 1.5s, revolver 2s after the last shot).
#   The revolver fires when you let go of RMB: pressing loads a bullet, holding loads more (1 every 0.25s,
#   up to 6), taken out of the cylinder as they load (the ammo count drops); letting go fires them all.

statuses:
  revolver_drawn:                    # the revolver is in your hand (see forms below)
    duration: 0                      # until you fire the shotgun
    tags: [state.revolver]
    positive: false                  # not a buff: nothing to share or strip
  null_rush:                         # caught in your own flask, or a spell blocked: faster
    duration: 60                     # 3s
    stacking: refresh
    tags: [state.hasted, buff.null_rush]
  keg_burn:                          # Powder Keg: on fire
    duration: 60                     # 3s...
    stacking: refresh
    tags: [state.burning]
    tick:
      every: 10                      # ...2% of their max HP every 0.5s = 12% total
      effects:
        - { id: damage, max_hp: 0.02, damage_type: fire }

abilities:

  # PRIMARY (LMB): the shotgun. A wide blast: 130% base damage to everyone in a 45 degree cone, 7 blocks.
  # 2 shells, then it reloads by itself (1.5s after the last shot). Shooting your Powder Keg sets it off.
  gunner_shotgun:
    cooldown: 14                     # 0.7s between shots
    display:
      name: "Scattergun"
      icon: NETHERITE_HOE            # the shotgun (the weapon while it's out)
      description:
        - "LMB: 130% base damage in a 7 block cone."
        - "2 shells; reloads when empty (1.5s)."
    nodes:
      draw:
        type: apply_effects          # the shotgun comes out (the revolver goes away)
        targets: { type: self }
        on_hit: false
        effects:
          - { id: remove_status, status: revolver_drawn }
        next: load
      load:
        type: spend
        resource: shells
        on: { out: blast, empty: click }
      click:
        type: play_cue
        cue: dry_fire
      blast:
        type: apply_effects
        targets: { type: cone, range: 7, angle: 45 }
        effects:
          - { id: damage, base: 1.3 }             # 130% base damage
        next: keg
      keg:
        type: strike_constructs      # your Powder Keg in the blast: it goes off
        range: 7
        angle: 45
        next: bang
      bang:
        type: play_cue
        cue: shotgun_blast           # a cone of smoke and sparks toward where you aimed
        at: caster
        to: aim

  # SECONDARY (RMB): the revolver. Pressing RMB loads a bullet; keep holding to load more (1 every 0.25s,
  # up to 6), taken out of the cylinder as they load (the ammo count drops). Let go and they fire, one every
  # 3 ticks, at the first enemy in line (30 blocks): the first 55% base damage, the rest 45% each.
  # A click is one bullet. 6 bullets, then it reloads by itself (2s after the last shot).
  gunner_revolver:
    cooldown: 8                      # 0.4s between clicks
    display:
      name: "Six-Shooter"
      icon: IRON_HOE                 # the revolver (the weapon while it's out)
      description:
        - "RMB: load a bullet, hold to load more (up"
        - "to 6); let go to fire. 55% base damage,"
        - "then 45% each. 6 bullets; reloads (2s)."
    nodes:
      draw:
        type: apply_effects          # the revolver comes out
        targets: { type: self }
        on_hit: false
        effects:
          - { id: status, status: revolver_drawn }
        next: loaded
      loaded:
        type: spend                  # anything in the cylinder? (just a look: the hammer takes them)
        resource: bullets
        peek: true
        on: { out: hammer, empty: click }
      hammer:
        type: charge                 # load bullets while RMB is held
        ticks: 25                    # (the cast bar: all 6 at 1.25s)
        store: volley
        fire_when_full: false        # all loaded: waits for you to let go
        release_gap: 6               # RMB repeats while held; 6 ticks without one = let go
        load: { resource: bullets, start: 1, every: 5, max: 6 }   # 1 on the press, +1 every 0.25s held
        on: { out: fan, early: ~ }
      click:
        type: play_cue
        cue: dry_fire
      fan:
        type: repeat                 # let go: the loaded bullets, one every 3 ticks
        times: volley
        every: 3
        on: { each: v_hold, out: ~ }
      v_hold:
        type: hold_reload            # still shooting: the reload starts after the last bullet
        resource: bullets
        next: v_aim
      v_aim:
        type: acquire_target
        query: { type: cursor, range: 30 }   # where this bullet is aimed (for its tracer)
        store: aim_now
        on: { hit: v_hit, miss: v_hit }
      v_hit:
        type: acquire_target
        query: { type: hitscan, range: 30, ray_size: 0.35 }
        on: { hit: which, miss: v_keg }
      which:
        type: switch                 # the first bullet hits harder
        key: repeat_index
        on: { "1": first_bullet, default: v_bullet }
      first_bullet:
        type: apply_effects
        targets: { type: key, key: target }
        on_hit: true                 # your on-hit effects (secondary casts don't carry them by default)
        effects:
          - { id: damage, base: 0.55 }            # 55% base damage
        next: v_keg
      v_bullet:
        type: apply_effects
        targets: { type: key, key: target }
        on_hit: true
        effects:
          - { id: damage, base: 0.45 }            # 45% base damage
        next: v_keg
      v_keg:
        type: strike_constructs      # your Powder Keg in the line of fire: it goes off
        range: 30
        width: 0.6
        next: v_bang
      v_bang:
        type: play_cue
        cue: revolver_shot           # a tracer to where this bullet was aimed
        at: caster
        to: aim_now

  # 1: Buckshot. A heavy shotgun blast in a wider cone (70 degrees, 9 blocks): 160% base damage, a slight
  # knockback and 1.5s slow. The recoil throws you away from where you aimed: backwards, or up if you shot at your
  # feet (a blast jump). Fills the shotgun.
  gunner_ab1:
    cooldown: 160                    # 8s
    display:
      name: "Buckshot"
      icon: FLINT
      description:
        - "A heavy blast (9 blocks, wide): 160% base"
        - "damage, knockback and 1.5s slow. The recoil"
        - "throws you back (shoot down: up into the"
        - "air). Refills the shotgun."
    nodes:
      draw:
        type: apply_effects
        targets: { type: self }
        on_hit: false
        effects:
          - { id: remove_status, status: revolver_drawn }
        next: blast
      blast:
        type: apply_effects
        targets: { type: cone, range: 9, angle: 70 }
        on_hit: true                 # your on-hit effects
        effects:
          - { id: damage, base: 1.6 }             # 160% base damage
          - { id: status, status: slow, duration: 30 }   # 1.5s
          - { id: knockback, from: caster, radius: 9, center: 0.9, edge: 0.4, lift: 0.2 }
        next: recoil
      recoil:
        type: apply_effects          # thrown away from where you aimed: back, or up off the ground below you
        targets: { type: self }
        on_hit: false
        effects:
          - { id: knockback, from: aim, radius: 1, center: 1.3, edge: 1.3, lift: 0.35, vertical: true }
        next: keg
      keg:
        type: strike_constructs
        range: 9
        angle: 70
        next: reload
      reload:
        type: refill                 # fresh shells
        resource: shells
        next: bang
      bang:
        type: play_cue
        cue: buckshot_blast
        at: caster
        to: aim

  # 2: Smoke Grenade (19s). Lob a grenade that bounces up to 3 times, then bursts into smoke: 90% base damage and 2s
  # blind around it (3.5 blocks), and the smoke hangs there for 4s, blinding anyone standing in it (3 blocks). Caught
  # in the burst yourself: faster for 3s, and Null Ward is ready again at once.
  gunner_ab2:
    cooldown: 380                    # 19s
    display:
      name: "Smoke Grenade"
      icon: FIREWORK_STAR
      description:
        - "A bouncing grenade: 90% base damage and"
        - "2s blind, then 4s of blinding smoke."
        - "Caught in it yourself: faster, Null Ward"
        - "ready."
    nodes:
      throw:
        type: projectile
        speed: 1.2
        size: 0.5
        lifetime: 100
        bounces: 3
        restitution: 0.45
        friction: 0.3
        visual: FIREWORK_STAR
        motion:
          - { type: gravity, amount: 0.05 }
        on: { spawned: toss, hit_entity: pin, hit_block: pin }
      toss:
        type: play_cue
        cue: flask_throw
      pin:
        type: remember_spot          # where it burst, on the ground: the smoke stays HERE (not on whoever it hit)
        of: hit
        store: spot
        next: burst
      burst:
        type: apply_effects
        targets: { type: radius, center: spot, radius: 3.5 }
        effects:
          - { id: damage, base: 0.9 }             # 90% base damage
          - { id: status, status: blinded, duration: 40 }   # 2s
        next: burst_cue
      burst_cue:
        type: play_cue
        cue: smoke_burst
        at: spot
        next: caught
      caught:
        type: in_range               # were YOU in the burst?
        center: spot
        radius: 3.5
        on: { inside: rush, outside: pool }
      rush:
        type: apply_effects
        targets: { type: self }
        effects:
          - { id: status, status: null_rush }
        next: refresh
      refresh:
        type: ward_reset             # Null Ward: ready again right now
        next: pool
      pool:
        type: fork                   # the smoke's 4s, and its pulses, side by side
        on: { out: pool_time, also: pulse }
      pool_time:
        type: delay
        ticks: 80                    # 4s
        next: pool_end
      pool_end:
        type: end_cast
      pulse:
        type: apply_effects          # standing in the smoke: blinded
        targets: { type: radius, center: spot, radius: 3 }
        effects:
          - { id: status, status: blinded, duration: 15 }
        next: pulse_cue
      pulse_cue:
        type: play_cue
        cue: smoke_pool              # (drawn at 3 blocks: keep it in step with the radius above)
        at: spot
        next: pulse_wait
      pulse_wait:
        type: delay
        ticks: 10                    # every 0.5s
        next: pulse

  # 3: Counterspell. For 2s, the first enemy SPELL that reaches you is blocked: its damage and its debuffs
  # (basic attacks and damage over time still land). Block one and you're faster for 3s.
  gunner_ab3:
    cooldown: 240                    # 12s
    display:
      name: "Counterspell"
      icon: SHULKER_SHELL
      description:
        - "2s: the first enemy spell is blocked"
        - "(damage and debuffs). Block one: faster"
        - "for 3s."
    active_tags: [state.spellshield]
    nodes:
      aura:
        type: start_cue
        cue: spellshield
        next: guard
      guard:
        type: spell_block
        duration: 40                 # 2s
        on: { blocked: rush, expired: ~ }
      rush:
        type: apply_effects
        targets: { type: self }
        effects:
          - { id: status, status: null_rush }

  # ULTIMATE (F): Powder Keg. Throw a keg: where it lands it sits for 2.5s, then explodes (5 blocks): 200%
  # base damage, sets them on fire (12% of their max HP over 3s) and blows them away from the centre.
  # Shoot it (either gun, or Buckshot) to set it off early. A direct hit on an enemy explodes at once.
  gunner_ult1:
    cooldown: 900                    # (unused while ultimates charge up: config.yml ultimate-charge)
    display:
      name: "Powder Keg"
      icon: TNT
      description:
        - "Throw a keg: explodes after 2.5s (5 blocks):"
        - "200% base damage, burning, knocked away."
        - "Shoot it to set it off early."
    nodes:
      throw:
        type: projectile
        speed: 1.1
        size: 0.6
        lifetime: 100
        visual: TNT
        motion:
          - { type: gravity, amount: 0.05 }
        on: { spawned: toss, hit_entity: direct, hit_block: plant }
      toss:
        type: play_cue
        cue: keg_throw
      direct:
        type: remember_spot          # hit someone: it goes off right there
        of: hit
        store: keg
        ground: false
        next: boom
      plant:
        type: construct              # sits on the ground, fuse lit
        at: hit
        store: keg
        height: 0.5
        size: 0.9                    # generous: easy to shoot
        fuse: 50                     # 2.5s
        visual: TNT
        on: { fuse: boom, struck: boom }
      boom:
        type: apply_effects
        targets: { type: radius, center: keg, radius: 5 }
        effects:
          - { id: damage, base: 2.0 }             # 200% base damage
          - { id: status, status: keg_burn }
          - { id: knockback, from: keg, radius: 5, center: 1.6, edge: 0.5, lift: 0.45 }
        next: boom_cue
      boom_cue:
        type: play_cue
        cue: keg_blast
        at: keg

characters:
  gunner:
    name: "Gunner"
    weapon: NETHERITE_HOE            # the shotgun
    forms:                           # the revolver in your hand after an RMB shot (until the next LMB)
      - { while: state.revolver, weapon: IRON_HOE }
    stats:                           # see docs/character-stats.md
      health: 210                    # max HP
      armor: 20                      # damage taken x 100 / (100 + armor)
      base_damage: 40                # shots and abilities deal % of this
      move_speed: 1.1                # x vanilla walking speed
    resources:                       # the ammo of the gun in your hand shows in slot 8
      shells: { max: 2, reload: 30, hotbar: 8, icon: FIRE_CHARGE, hidden_while: state.revolver }
      bullets: { max: 6, reload: 40, hotbar: 8, icon: GOLD_NUGGET, shown_while: state.revolver }
    ward:                            # PASSIVE: Null Ward
      name: "Null Ward"
      out_of_combat: 120             # 6s without dealing or taking damage
      hotbar: 9                      # shown in slot 9
      icon: ENDER_EYE
      description:
        - "After 6s out of combat, the next debuff"
        - "doesn't land. Blocking one uses it up."
    slots:
      primary: gunner_shotgun      # LMB: Scattergun
      secondary: gunner_revolver   # RMB: Six-Shooter (hold to load a volley)
      ability_1: gunner_ab1        # 1: Buckshot
      ability_2: gunner_ab2        # 2: Smoke Grenade
      ability_3: gunner_ab3        # 3: Counterspell
      ultimate: gunner_ult1        # F: Powder Keg
