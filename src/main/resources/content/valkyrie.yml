# content: valkyrie
# The Valkyrie: a winged warrior with a golden sword. Glides on her wings, leaps in with chained slashes and dives from
# the sky, crashes enemies into walls, rallies her allies with a war cry, and wards an ally (or herself) from death.
# Format and all options: see README.md in this folder. Edit, then /ae reload.
#
# PASSIVE (Wings): an elytra - jump while falling to glide. Falling (not gliding), you drift down: Slow Falling, and no
#   fall damage.
# PASSIVE (Fervor, the XP bar): every enemy your attacks and abilities hit builds a stack of Fervor (5 at most; 3s,
#   kept up by hitting): each makes your basic attacks 8% faster (5 stacks: 47% faster).
#
# ULTIMATE (F): Divine Ward. 5s to choose (the ally in your sights glows): LMB wards that ally, RMB wards yourself. The
#   warded one takes no damage for 4s and can't die. F again: cancel.

statuses:
  valkyrie_fervor:                     # PASSIVE: Fervor (the XP bar shows its stacks)
    duration: 60                     # 3s without a hit and it's gone
    stacking: stack
    max_stacks: 5
    attack_speed: 1.08               # x1.08 per stack (5 stacks: x1.47)
    positive: false                  # hers alone (a tether doesn't copy it)
  valkyrie_hovering:                   # Valkyrie's Leap, the dive: hanging in the sky while choosing where to dive
    duration: 80                     # safety cap; removed as the dive starts
    stacking: refresh
    tags: [state.anchored, block.walk]   # hangs there, can't move
    positive: false
  valkyrie_battle_cry:                 # War Cry: faster and stronger
    duration: 80                     # 4s
    stacking: refresh
    move_speed: 1.25                 # +25%
    damage_dealt: 1.2                # +20% damage
    tags: [buff.battle_cry]
  valkyrie_marked:                     # Divine Ward: the ally in her sights while she chooses (they glow)
    duration: 4                      # (kept on every 2 ticks while she looks at them)
    stacking: refresh
    tags: [state.glowing]
    positive: true                   # (just a highlight: not a debuff)
  valkyrie_warded:                     # Divine Ward: no damage, can't die
    duration: 80                     # 4s
    stacking: refresh
    damage_taken: 0                  # every hit, vanilla ones too, is multiplied by 0
    tags: [buff.warded]
    cue: valkyrie_blessed              # a golden halo
    positive: true

abilities:

  # PRIMARY (LMB): Gilded Slash. A golden sword sweep in front of you (3.2 blocks): 100% base damage. Builds Fervor.
  valkyrie_primary:
    cooldown: 14                     # (the attack_speed stat sets it)
    display:
      name: "Gilded Slash"
      description:
        - "A golden sword sweep: 100% base damage."
        - "Passive - Wings: jump while falling to"
        - "glide; you fall slowly. Fervor: hits make"
        - "your attacks faster (+8% a stack, 5 max)."
    nodes:
      slash:
        type: apply_effects
        targets: { type: cone, range: 3.2, angle: 90 }
        effects:
          - { id: damage, base: 1.0 }
          - { id: status, status: valkyrie_fervor, self: true }   # a stack of Fervor per enemy hit
        next: slash_cue
      slash_cue:
        type: play_cue
        cue: valkyrie_slash

  # 1: Valkyrie's Leap (8s). Leap forward and slash a half circle in front of you as you land (4 blocks): 100% base
  # damage, and your next basic attack is ready at once. Hit someone: press 1 again (within 3s) to leap and slash again.
  # Hit again: press 1 once more to soar up (you can't move up there) and pick a spot (1 again, or where you look after
  # 3s): you dive onto it, 140% base damage within 4 blocks, knocking enemies up. Not while gliding. Builds Fervor.
  # The cooldown starts when the chain ends.
  valkyrie_ab1:
    cooldown: 160                    # 8s
    blocked_by: [block.ability, state.gliding]   # not while gliding
    display:
      name: "Valkyrie's Leap"
      icon: FEATHER
      description:
        - "Leap and slash a half circle: 100%, and"
        - "attack reset. Hit: again (1). Hit again:"
        - "soar up, pick a spot (1) and dive: 140%,"
        - "enemies knocked up. Not while gliding."
    nodes:
      leap1_cue:
        type: play_cue
        cue: valkyrie_flit
        next: leap1
      leap1:
        type: leap                   # ~3 blocks forward
        speed: 0.3
        up: 0.42
        next: slash1
      slash1:
        type: apply_effects
        targets: { type: cone, range: 4, angle: 180 }   # a half circle in front of her
        effects:
          - { id: damage, base: 1.0 }
          - { id: status, status: valkyrie_fervor, self: true }
        count: struck1
        next: slash1_cue
      slash1_cue:
        type: play_cue
        cue: valkyrie_cleave
        at: caster
        to: aim                      # (a line cue: it faces where she aims)
        next: reset1
      reset1:
        type: reset_cooldowns        # the next basic attack, at once
        slots: [primary]
        next: hit1
      hit1:
        type: switch                 # hit someone: the second leap
        key: struck1
        on: { "0": ~, default: wait1 }
      wait1:
        type: await_recast
        window: 60                   # 3s
        on: { recast: leap2_cue }
      leap2_cue:
        type: play_cue
        cue: valkyrie_flit
        next: leap2
      leap2:
        type: leap
        speed: 0.3
        up: 0.42
        next: slash2
      slash2:
        type: apply_effects
        targets: { type: cone, range: 4, angle: 180 }
        effects:
          - { id: damage, base: 1.0 }
          - { id: status, status: valkyrie_fervor, self: true }
        count: struck2
        next: slash2_cue
      slash2_cue:
        type: play_cue
        cue: valkyrie_cleave
        at: caster
        to: aim                      # (a line cue: it faces where she aims)
        next: reset2
      reset2:
        type: reset_cooldowns
        slots: [primary]
        next: hit2
      hit2:
        type: switch                 # hit again: the dive
        key: struck2
        on: { "0": ~, default: wait2 }
      wait2:
        type: await_recast
        window: 60
        on: { recast: rise_cue }
      rise_cue:
        type: play_cue
        cue: valkyrie_rise
        next: rise
      rise:
        type: leap                   # up into the sky...
        direction: up
        up: 1.0                      # ~6 blocks
        until: apex
        next: hover
      hover:
        type: apply_effects          # ...and hang there (can't move)
        targets: { type: self }
        on_hit: false
        effects:
          - { id: status, status: valkyrie_hovering }
        next: choose
      choose:
        type: choose_spot            # a preview circle follows your crosshair: 1 again to dive there
        range: 30
        radius: 4
        timeout: 60                  # 3s, then: wherever you're looking
        store: landing
        on: { out: descend, none: give_up }
      descend:
        type: apply_effects
        targets: { type: self }
        on_hit: false
        effects:
          - { id: remove_status, status: valkyrie_hovering }
        next: dive_cue
      dive_cue:
        type: play_cue
        cue: valkyrie_dive
        next: dive
      dive:
        type: dash                   # straight down onto the spot
        to: landing
        speed: 2.0
        range: 50
        pierce: true
        on: { miss: impact }
      impact:
        type: apply_effects
        targets: { type: radius, radius: 4 }
        effects:
          - { id: damage, base: 1.4, knockback: false }
          - { id: knockback, from: caster, radius: 4, center: 0.2, edge: 0.2, lift: 1.0 }   # knocked UP
          - { id: status, status: valkyrie_fervor, self: true }
        next: impact_cue
      impact_cue:
        type: play_cue
        cue: valkyrie_smite
      give_up:
        type: apply_effects          # nowhere to dive (looking at the sky): just drop down
        targets: { type: self }
        on_hit: false
        effects:
          - { id: remove_status, status: valkyrie_hovering }

  # 2: Valkyrie's Charge (10s). On foot: dash forward (6 blocks); the first enemy you reach takes 80% base damage, is
  # flung over you to land behind you, and is stunned 1s. Gliding: an enemy in your sights (25 blocks, a forgiving aim)
  # - you fly at them (homing), catch them (60% base damage, stunned) and carry them along with you (8 blocks): if they
  # hit terrain on the way, they take 15% of their max HP. A hit either way gives you a shield (15% of your max HP, 4s)
  # and builds Fervor. Gliding, a miss (nobody in your sights) costs nothing.
  valkyrie_ab2:
    cooldown: 200                    # 10s
    cooldown_starts: manual          # on foot: as you dash; gliding: once there's someone to fly at
    display:
      name: "Valkyrie's Charge"
      icon: TRIDENT
      description:
        - "On foot: dash, fling the enemy behind you"
        - "and stun 1s. Gliding: fly at an enemy and"
        - "carry them: into terrain, 15% max HP."
        - "A hit: a shield (15% of your max HP)."
    nodes:
      stance:
        type: has_tag                # gliding: the carry; on foot: the dash
        tag: state.gliding
        on: { has: sight, lacks: dash_start }
      dash_start:
        type: start_cooldown
        next: dash_cue
      dash_cue:
        type: play_cue
        cue: valkyrie_flit
        next: dash
      dash:
        type: dash
        range: 6
        speed: 1.4
        radius: 0.8
        flat: true
        on: { hit: fling }
      fling:
        type: apply_effects          # flung over her shoulder, then stunned
        targets: { type: key, key: hit }
        effects:
          - { id: damage, base: 0.8, knockback: false }
          - { id: knockback, from: caster, radius: 3, center: -1.3, edge: -1.3, lift: 0.6 }   # toward her, and past
          - { id: status, status: stun, duration: 20 }   # 1s
          - { id: status, status: valkyrie_fervor, self: true }
        next: fling_cue
      fling_cue:
        type: play_cue
        cue: valkyrie_stab
        at: hit
        next: shield
      sight:
        type: acquire_target
        query: { type: hitscan, range: 25, ray_size: 1.0 }
        on: { hit: home_start, miss: ~ }
      home_start:
        type: start_cooldown
        next: home_cue
      home_cue:
        type: play_cue
        cue: valkyrie_dive
        next: home
      home:
        type: dash                   # after them, wherever they go
        to: target
        follow: true
        speed: 1.6
        range: 35
        radius: 0.6
        on: { hit: seize }
      seize:
        type: apply_effects          # caught
        targets: { type: key, key: target }
        effects:
          - { id: damage, base: 0.6, knockback: false }
          - { id: status, status: stun, duration: 30 }   # 1.5s: while she carries them
          - { id: status, status: valkyrie_fervor, self: true }
        next: seize_cue
      seize_cue:
        type: play_cue
        cue: valkyrie_stab
        at: target
        next: carry
      carry:
        type: fork                   # she flies on and carries them with her (the same way, the same speed)
        on: { out: fly_on, also: haul }
      fly_on:
        type: dash
        range: 8
        speed: 1.2
        radius: 0.3
        pierce: true
        on: { hit: shield, miss: shield }
      haul:
        type: dash                   # them: terrain stops them short
        mover: target
        range: 8
        speed: 1.2
        radius: 0.3
        pierce: true
        store: haul
        on: { hit: crashed, miss: crashed }
      crashed:
        type: in_range               # stopped well short of the 8 blocks: they hit terrain
        center: haul_start
        radius: 7
        target: target
        on: { inside: crash }
      crash:
        type: apply_effects
        targets: { type: key, key: target }
        effects:
          - { id: damage, max_hp: 0.15, knockback: false }   # 15% of their max HP
        next: crash_cue
      crash_cue:
        type: play_cue
        cue: valkyrie_crash
        at: target
      shield:
        type: apply_effects          # a hit: a shield for her
        targets: { type: self }
        on_hit: false
        effects:
          - { id: shield, max_hp: 0.15, lasts: 80 }   # 15% of her max HP, 4s

  # 3: War Cry (16s). A battle cry: you and allies within 8 blocks are 25% faster and deal 20% more damage for 4s.
  valkyrie_ab3:
    cooldown: 320                    # 16s
    display:
      name: "War Cry"
      icon: GOAT_HORN
      description:
        - "A battle cry: you and allies within 8"
        - "blocks are 25% faster and deal 20% more"
        - "damage for 4s."
    nodes:
      cry:
        type: apply_effects
        targets: { type: radius, radius: 8, include_caster: true }
        affects: allies
        on_hit: false
        effects:
          - { id: status, status: valkyrie_battle_cry }
        next: cry_cue
      cry_cue:
        type: play_cue
        cue: valkyrie_cry

  # ULTIMATE (F): Divine Ward. 5s to choose (a boss bar; the ally in your sights glows): LMB wards that ally, RMB wards
  # yourself: no damage for 4s, and they can't die. F again: cancel. (The cooldown starts as you press F.)
  valkyrie_ult1:
    cooldown: 1200                   # placeholder until ults charge from damage
    cancel_on_repress: true          # F again: cancel
    active_tags: [state.choosing_ward]   # LMB / RMB pick (see forms below)
    display:
      name: "Divine Ward"
      icon: TOTEM_OF_UNDYING
      description:
        - "Choose: LMB an ally in your sights, RMB"
        - "yourself. No damage for 4s, can't die."
    nodes:
      open:
        type: play_cue
        cue: valkyrie_blessing_open
        next: split
      split:
        type: fork                   # the time to choose, and the glow on whoever she looks at
        on: { out: window, also: seek }
      window:
        type: delay
        ticks: 100                   # 5s
        boss_bar: true
        next: closed
      closed:
        type: end_cast
      seek:
        type: repeat                 # every 2 ticks: who's in her sights
        times: 50
        every: 2
        on: { each: look }
      look:
        type: acquire_target
        query: { type: hitscan, range: 30, ray_size: 1.0, targets: allies }
        store: chosen
        on: { hit: mark }
      mark:
        type: apply_effects
        targets: { type: key, key: chosen }
        affects: allies
        on_hit: false
        effects:
          - { id: status, status: valkyrie_marked }

  # Divine Ward, LMB: the ally in her sights is warded (nobody there: nothing, keep choosing).
  valkyrie_ward_ally:
    display:
      name: "Ward an Ally"
      description:
        - "LMB: ward the ally in your sights."
    nodes:
      pick:
        type: acquire_target
        query: { type: hitscan, range: 30, ray_size: 1.0, targets: allies }
        on: { hit: ward, miss: ~ }
      ward:
        type: apply_effects
        targets: { type: key, key: target }
        affects: allies
        on_hit: false
        effects:
          - { id: status, status: valkyrie_warded }
        next: ward_cue
      ward_cue:
        type: play_cue
        cue: valkyrie_blessing
        at: target
        next: chosen
      chosen:
        type: cancel_ability         # chosen: the choice is over
        ability: valkyrie_ult1

  # Divine Ward, RMB: she wards herself.
  valkyrie_ward_self:
    display:
      name: "Ward Yourself"
      description:
        - "RMB: ward yourself."
    nodes:
      ward:
        type: apply_effects
        targets: { type: self }
        on_hit: false
        effects:
          - { id: status, status: valkyrie_warded }
        next: ward_cue
      ward_cue:
        type: play_cue
        cue: valkyrie_blessing
        next: chosen
      chosen:
        type: cancel_ability
        ability: valkyrie_ult1


characters:
  valkyrie:
    name: "Valkyrie"
    weapon: GOLDEN_SWORD
    stats:                           # see docs/character-stats.md
      health: 220                    # max HP
      armor: 15                      # damage taken x 100 / (100 + armor)
      base_damage: 38                # abilities deal % of this
      move_speed: 1.05               # x vanilla walking speed
      attack_speed: 1.4              # sword sweeps per second (Fervor: up to 47% faster)
    traits: [slow_fall, elytra]      # always drifting down when falling; an elytra to glide on
    status_bar: { status: valkyrie_fervor, fill: stacks }   # XP bar: Fervor (the number and the bar: its stacks)
    forms:
      - while: state.choosing_ward   # Divine Ward: choosing
        slots: { primary: valkyrie_ward_ally, secondary: valkyrie_ward_self }
    slots:
      primary: valkyrie_primary        # LMB: Gilded Slash (no RMB)
      ability_1: valkyrie_ab1          # 1: Valkyrie's Leap (again on a hit, twice; then the dive)
      ability_2: valkyrie_ab2          # 2: Valkyrie's Charge (a dash on foot, a carry while gliding)
      ability_3: valkyrie_ab3          # 3: War Cry
      ultimate: valkyrie_ult1          # F: Divine Ward
