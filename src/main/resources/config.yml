# Which vanilla input fires which character slot:
#   primary, ability_1, ability_2, ability_3, ultimate, or none.
# The server only ever sees these actions, never the actual key. Players can move them to any key
# (or mouse button) in their own Controls menu: "Hotbar Slot 1-9", "Swap Item With Offhand", etc.
#
# While a player has a character, their held slot is locked to the weapon (slot 5). Keep slots
# 4 and 6 unbound: the scroll wheel always reports those, and they're ignored on purpose.
keybinds-version: 4
keybinds:
  left_click: primary
  right_click: secondary # hold: e.g. Arcane Focus (also cancels aim previews)
  hotbar_1: ability_1
  hotbar_2: ability_2
  hotbar_3: ability_3
  swap_hands: ultimate   # F (the ultimate's icon sits in the offhand slot)
  drop: none             # Q: free
  # 7, 8, 9: free. They show indicators (resource gauges, an Alchemist's quiver).

# Ability damage is written in "design HP". This many design HP = 1 Minecraft health point
# (half a heart). 10 means a 20-health player has 200 design HP.
damage-scale: 10

# Armor: damage taken x armor-constant / (armor-constant + armor). With 100, every armor point is +1%
# effective HP: 25 armor = 20% less damage, 100 armor = 50% less. (Characters' armor: stats: in the kits.)
armor-constant: 100

# "% of max HP" damage (poison, burns, freezes, executes) against mobs - camp monsters, bosses - counts their max HP as at
# most this (design HP; a player has 200): a 1200 HP monster takes what a 200 HP player would, not 6x as much. Players
# are never capped. 0: no cap.
max-hp-damage-cap-for-mobs: 200

# Ultimates charge up instead of cooling down: 0% (a fresh character) to 100%, when F casts it (and it starts over).
# A cast that lands on an enemy charges it once, however many it hits: an ability (1, 2, 3) ability-hit percent, a basic
# attack (primary / secondary fire, melee) basic-hit percent. Damage over time and the ultimate itself don't. Plus
# per-second by itself. An item's ult_charge_rate makes all of it faster. enabled: false = ultimates use their cooldowns.
ultimate-charge:
  enabled: true
  ability-hit: 5
  basic-hit: 2
  per-second: 0.5

# Melee swings that the player's game saw land count on the server too: a swing's own aim (a hitscan, a cone, a line) is
# worked out on the server, where with ping, a hitbox edge or half a block too far it could miss someone the player
# plainly hit. The entity they clicked counts as hit when it's within the swing's range plus this many blocks.
melee-assist-reach: 1.0

# Primary-fire projectiles (shots, bolts, shards) are this many blocks wider against players and mobs (not terrain:
# they don't catch on the ground or wall corners any sooner). 0 = their own size.
primary-projectile-hitbox: 0.25

# While a player has a character, their inventory is a display (the HUD): nothing can be moved.
# Free some of it here, e.g. for an item plugin's bag. Read again on every /ae reload.
inventory:
  # Slots of the main inventory (the 3 rows above the hotbar) players may use: plain clicks and drags
  # in, out and between them. Numbered 9-35, left to right, top row first (9-17, 18-26, 27-35).
  # Keep 9-11 and 18-20 out of it: the character's stat items sit there.
  # The 3x3 bag on the right (ItemSystem's items work there; CaptureThePoint's loot goes there). [] = all locked.
  free-slots: [15, 16, 17, 24, 25, 26, 33, 34, 35]
  # The 2x2 crafting grid (and taking what it makes) as well: ItemSystem's items are crafted there.
  free-crafting: true

# ---- Development helpers -------------------------------------------------------------------
# Both are read again on every /ae reload. Leave them off on a real server.
dev:
  # Read ability content straight from this folder instead of plugins/<this plugin>/content.
  # Point it at your project, e.g. "C:/dev/AbilityEngine/src/main/resources/content"
  # (forward slashes work on Windows too). Then: edit in your IDE, /ae reload. No rebuild needed.
  content-folder: ""
  # Copy the jar's content/ over plugins/<this plugin>/content on every start and /ae reload.
  # Anything you edited in that folder on the server is LOST each time.
  overwrite-content: false
