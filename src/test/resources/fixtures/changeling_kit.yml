# content: changeling_kit
# TEST-ONLY (not shipped): the Fae Trickster's first kit, Rough Play with its lunges, Changeling (the mirroring clone and
# its copy / still / puppet modes) and Stolen Fable, under its own ids. The shipped Trickster (content/trickster.yml) no
# longer uses them, but the engine still has the clone and steal tech: CloneTechTest keeps it tested through this kit.

statuses:
  ck_sucker_punch:                      # the passive itself, always on the Fae (passive_statuses)
    duration: 10
    neutral: true                    # bookkeeping: nothing purges, cleanses or copies it
    on_damaged:                      # an enemy hurt the Fae first: SPENT
      - { id: status, status: ck_sucker_punch_spent, attacker: true }
    ability_on_hit:                  # the Fae's abilities hitting a SPENT enemy start its 8s over (never makes one SPENT)
      - { id: status, status: ck_sucker_punch_spent, only_refresh: true }
  ck_sucker_punch_spent:                # on an enemy: this Fae can't silence them right now
    duration: 160                    # passive.reset_after_no_damage: 8s without damage between them, then READY
    stacking: refresh
    neutral: true                    # not a debuff: wards and cleanses ignore it
    ends_with_source: true           # the Fae dies: every enemy is READY again
  ck_vanished:                # Changeling: gone for a moment before you reappear beside your clone
    duration: 10                     # (the cast ends it; this is only the safety net)
    tags: [state.hidden, state.untargetable, block.ability]
    positive: false
  ck_betrayed:                # broke a Changeling: fooled, and for a moment their own team's enemy too
    duration: 80                     # ab3.betrayal_duration: 4s
    stacking: refresh
    tags: [state.friendly_fire]      # their abilities hit their allies, their allies' hit them
    cue: trickster_betrayed          # a ring over their head: everyone can see it
    positive: false
  ck_dizzy:                   # Sucker Punch: the screen swims (vanilla Nausea)
    duration: 60                     # passive.nausea_duration: 3s
    stacking: refresh
    tags: [state.nauseous]
  ck_room_inside:                 # the Fae standing in its Trick Room (the floor keeps it on): SHIFT + moving teleports
    duration: 6
    tags: [state.on_floor]

abilities:

  # PRIMARY: a quick claw swipe at whoever's in front of you. On a READY enemy: Sucker Punch (silenced 1s). Landing it
  # on an enemy player takes 1s off Rough Play's cooldown (not on the clone, mobs or a miss).
  ck_primary:
    cooldown: 15                     # (its stats' attack_speed sets it: 1.3 a second)
    display:
      name: "Swipe"
      description:
        - "A quick swipe: {base:0.85}."
        - "The first one on an enemy silences them 1s,"
        - "unless they hit you first."
        - "Hits on players: Rough Play -1s."
    nodes:
      aim:
        type: acquire_target
        query: { type: hitscan, range: 3.5, angle: 40 }
        on: { hit: swipe, miss: whiff }
      whiff:
        type: play_cue
        cue: trickster_swipe
      swipe:
        type: apply_effects
        targets: { type: key, key: target }
        effects:
          - { id: damage, base: 0.85 } # 85% base damage
        count_players: players_hit
        next: swipe_cue
      swipe_cue:
        type: play_cue
        cue: trickster_swipe
        at: target
        next: ready
      ready:
        type: has_status             # Sucker Punch: READY (nothing from this Fae on them) or SPENT?
        status: ck_sucker_punch_spent
        target: target
        mine: true
        on: { lacks: hush, has: again }
      hush:
        type: apply_effects
        targets: { type: key, key: target }
        on_hit: false
        effects:
          - { id: status, status: silence, duration: 20 }   # passive.silence_duration: 1s
          - { id: status, status: ck_dizzy }         # passive.nausea_duration: 3s
          - { id: status, status: ck_sucker_punch_spent }
        next: hush_cue
      hush_cue:
        type: play_cue
        cue: trickster_hush
        at: target
        next: quick
      again:
        type: apply_effects          # already SPENT: a hit between them starts its 8s over
        targets: { type: key, key: target }
        on_hit: false
        effects:
          - { id: status, status: ck_sucker_punch_spent }
        next: quick
      quick:
        type: switch                 # landed on a player: Rough Play comes back sooner
        key: players_hit
        on: { "0": ~, default: quicken }
      quicken:
        type: reduce_cooldown
        slot: ability_1
        ticks: 20                    # ab1.cdr_per_basic_hit: 1s

  # 1: Rough Play (like Mimikyu's Shadow Claw). Lunge a step forward and slash a cone in front of you, twice, 0.2s apart:
  # everyone in the cone when each slash lands is hit by it (half the damage each). Each lunge stops in front of anyone in
  # the way, so you stay on them. The slashes are drawn on you, wherever you go. Stunned or silenced, the rest is lost.
  # While your Changeling is out it lunges and slashes too, its (mirrored) way, for show (no damage). Landed swipes on
  # players take 1s off its cooldown.
  ck_ab1:
    cooldown: 100                    # ab1.cooldown: 5s, from when the second slash lands
    cooldown_starts: end
    display:
      name: "Rough Play"
      icon: RABBIT_HIDE
      description:
        - "Lunge forward and slash a cone in front of"
        - "you (3 blocks), twice: {base:0.65} each."
        - "Swipes on players: -1s cooldown."
        - "Your Changeling fakes it too."
    active_tags: [block.ability]
    interrupted_by: [state.stunned, state.silenced]
    nodes:
      clone_check:
        type: find_summon
        summon: changeling
        store: clone
        on: { found: both, none: lunge }
      both:
        type: fork                   # you and the clone go at the same time
        on: { out: lunge, also: ghost_lunge }
      lunge:
        type: dash                   # a step forward...
        speed: 0.5
        range: 1                     # ab1.lunge: 1 block before each slash
        radius: 0.6
        flat: true
        on: { hit: slash, miss: slash }   # (someone in the way: you stop in front of them)
      slash:
        type: apply_effects          # ...and a slash: the cone where you are now, the way you face now
        targets: { type: cone, range: 3, angle: 90 }   # ab1.range, ab1.angle (keep TricksterCues in step)
        effects:
          - { id: damage, base: 0.65, ignore_iframes: true }   # 65% base damage (130% over both)
        next: slash_cue
      slash_cue:
        type: start_cue              # drawn on you over a few ticks, moving with you
        cue: trickster_rough_play
        next: between
      between:
        type: delay
        ticks: 4                     # ab1.hit_gap: 0.2s
        next: lunge_2
      lunge_2:
        type: dash
        speed: 0.5
        range: 1
        radius: 0.6
        flat: true
        on: { hit: slash_2, miss: slash_2 }
      slash_2:
        type: apply_effects
        targets: { type: cone, range: 3, angle: 90 }
        effects:
          - { id: damage, base: 0.65, ignore_iframes: true }   # 65% base damage
        next: slash_2_cue
      slash_2_cue:
        type: start_cue
        cue: trickster_rough_play
        next: linger
      linger:
        type: delay                  # (the second slash gets drawn to the end before the cast ends)
        ticks: 4
      ghost_lunge:
        type: dash                   # the clone's fake: the same two lunges and slashes, its (mirrored) way
        mover: clone
        speed: 0.5
        range: 1
        radius: 0.6
        flat: true
        on: { hit: ghost_slash, miss: ghost_slash }
      ghost_slash:
        type: start_cue
        cue: trickster_rough_play
        at: clone
        next: ghost_between
      ghost_between:
        type: delay
        ticks: 4
        next: ghost_lunge_2
      ghost_lunge_2:
        type: dash
        mover: clone
        speed: 0.5
        range: 1
        radius: 0.6
        flat: true
        on: { hit: ghost_slash_2, miss: ghost_slash_2 }
      ghost_slash_2:
        type: start_cue
        cue: trickster_rough_play
        at: clone
        next: ghost_linger
      ghost_linger:
        type: delay
        ticks: 4

  # 2: Trick Room. A dash straight ahead (7 blocks, level; a wall stops it sooner), then an 11x11 square on the ground
  # below where you end up, for 10s (it stays where you put it). Inside it (feet up to 2 blocks above or below its floor), SHIFT while moving
  # (any of WASD) teleports you 6 blocks that way, never out of the room or into a wall, at most every 0.5s (the
  # character's glide:). Standing still or outside it, SHIFT is a normal sneak. Only you (and your clone) teleport.
  ck_ab2:
    cooldown: 280                    # ab2.cooldown: 14s, from when the room goes
    cooldown_starts: end
    survives_death: true             # the room stays its 10s even if you die
    movement: false                  # (a root later on mustn't end the room)...
    blocked_by: [block.ability, block.move]   # ...but you can't start the dash while rooted
    display:
      name: "Trick Room"
      icon: PURPLE_CARPET
      description:
        - "Dash ahead and put an 11x11 room where"
        - "you land for 10s. Inside: SHIFT while moving"
        - "teleports you 6 blocks that way."
    active_tags: [block.ability]     # (only while dashing: see free)
    nodes:
      dash_cue:
        type: play_cue
        cue: trickster_room_dash
        next: dash
      dash:
        type: dash
        flat: true                   # straight ahead where you face, level (looking up or down doesn't tilt it)
        speed: 1.0                   # ab2.dash_speed: blocks a tick (7 blocks: ~0.35s)
        range: 7                     # ab2.dash_range (a wall stops you sooner: the room goes where you stopped)
        pierce: true                 # past anyone in the way
        on: { miss: free }
      free:
        type: release_tags           # you can act again once you've arrived
        next: room
      room:
        type: floor
        at: caster                   # where you arrived
        shape: square
        radius: 5.5                  # ab2.room_size: 11x11 (5.5 from the centre to each side; on the block grid)
        up: 2                        # ab2.room_height: inside with your feet up to 2 blocks above...
        down: 2                      # ...or below its floor
        name: trick_room
        owner_status: ck_room_inside
        duration: 200                # ab2.room_duration: 10s
        drop: 40                     # on the ground below where you ended up (a dash off a ledge: down there)
        next: room_cue
      room_cue:
        type: play_cue
        cue: trickster_room
        next: last
      last:
        type: delay                  # (the cast lasts as long as the room: its cooldown starts when it goes)
        ticks: 200

  # 3: Changeling (like Shaco's Hallucinate). You vanish for half a second (unseen, untargetable, nothing to do but move),
  # then reappear together with a clone of yourself, right where you are: nobody can tell which one is you. It lasts 8s
  # and is your half-turned copy: it faces the other way and does everything you do turned round (you walk ahead, it
  # walks ahead its way; you strafe left, it strafes its left), so you split the moment either of you moves, and walking
  # toward each other you cross. Only what you put in is copied (keys, jumps, sneaking), never knockback or being moved.
  # Looking, swings, Rough Play (for show) and Trick Room teleports (only inside your room) are turned round too.
  # Whoever breaks it is fooled: for 4s they're on friendly fire, hurting and hurt by their own allies.
  # Press 3 again while it's out to change what it does (the action bar says which): 1. copy (as above), 2. still (it
  # stops copying your movement and turning and stays put; it still swings and fakes Rough Play), 3. puppet (you can't
  # walk or jump, and a frozen decoy of you stands in for you while you turn freely and your keys move only the clone: walking, jumping, sneaking, Trick Room teleports), then back to 1. It wears
  # your name and gear. Enemies break it with 2 basic attacks or any one ability hit. It goes in a puff of smoke, and right
  # away if you die.
  ck_ab3:
    cooldown: 280                    # ab3.cooldown: 14s, from when the clone goes
    cooldown_starts: end
    display:
      name: "Changeling"
      icon: ARMOR_STAND
      description:
        - "Vanish for 0.5s, then reappear beside a"
        - "clone of yourself for 8s: it mirrors your"
        - "every move and fakes your Rough Play."
        - "Breaks after 2 basic attacks."
        - "3 again: copy / still / puppet."
        - "Whoever breaks it: friendly fire 4s."
    nodes:
      vanish:
        type: apply_effects
        targets: { type: self }
        on_hit: false
        effects:
          - { id: status, status: ck_vanished }
        next: vanish_cue
      vanish_cue:
        type: play_cue
        cue: trickster_clone_poof    # a puff where you were
        next: hidden
      hidden:
        type: delay
        ticks: 10                    # ab3.vanish_time: 0.5s (keep it in step with ck_vanished)
        next: place
      place:
        type: summon_clone
        summon: changeling           # Rough Play finds it by this name
        # (no at: / beside: right where you are, facing the other way: your half-turned copy)
        lifetime: 160                # ab3.duration: 8s
        disguise: true               # your name tag, your gear
        mirror: true                 # copies your moves, turned round (walk at it and you cross)
        health: 1000                 # (plenty: it breaks by hits, not by damage)
        hits: 2                      # ab3.hits_to_break: 2 basic attacks, or any one ability hit
        end_cue: trickster_clone_poof
        on_break: ck_betrayed # whoever breaks it is on friendly fire for 4s
        store: clone
        next: reappear
      reappear:
        type: apply_effects          # back: you and your clone appear together
        targets: { type: self }
        on_hit: false
        effects:
          - { id: remove_status, status: ck_vanished }
        next: you_cue
      you_cue:
        type: play_cue
        cue: trickster_clone_place
        next: clone_cue
      clone_cue:
        type: play_cue
        cue: trickster_clone_place
        at: clone
        next: split
      split:
        type: fork                   # the clone's 8s, and pressing 3 to change what it does, side by side
        on: { out: wait, also: modes }
      wait:
        type: await_summon           # the cast lasts as long as the clone: its cooldown starts when it goes
        summon: changeling
        on: { destroyed: over, gone: over }
      over:
        type: end_cast
      modes:
        type: await_recast           # 3 again: the next mode
        window: 160
        on: { recast: cycle, timeout: modes }
      cycle:
        type: clone_mode             # copy -> still -> puppet -> copy
        messages:
          - "Changeling: copying you"
          - "Changeling: standing still"
          - "Changeling: puppet (your keys move only the clone)"
        next: cycle_cue
      cycle_cue:
        type: play_cue
        cue: trickster_clone_mode
        at: clone
        audience: caster             # only you hear it
        next: modes

  # ULTIMATE (F): Stolen Fable. Point at an enemy (15 blocks, in sight): you steal a copy of their ultimate for one use
  # within 20s, cast as yours (its own aiming); they keep theirs. No one there: nothing happens, your charge is kept.
  # An ultimate that only works for its owner (stealable: false) can't be stolen: you're told, and keep your charge.
  # Another Trickster: you can't steal Stolen Fable, but if they're holding an ultimate they stole, you steal that one.
  # Used or lost, F is Stolen Fable again and charges up as usual.
  ck_ult:
    stealable: false                 # another Trickster can't take Stolen Fable itself: only an ultimate it has stolen
    cooldown: 1200                   # (unused while ultimates charge up: config.yml ultimate-charge)
    display:
      name: "Stolen Fable"
      icon: BOOK
      description:
        - "Steal the ultimate of the enemy in your"
        - "sights (15 blocks): cast it once within"
        - "20s. They keep theirs."
    nodes:
      aim:
        type: acquire_target
        query: { type: hitscan, range: 15, ray_size: 0.5 }   # ult.range (a little forgiving)
        on: { hit: steal, miss: steal }   # (nobody: the steal gives the charge back)
      steal:
        type: steal_ultimate
        target: target
        window: 400                  # ult.stolen_use_window: 20s
        message: "That ultimate can't be stolen."
        on: { stolen: snatch, unstealable: fizzle }
      snatch:
        type: play_cue
        cue: trickster_snatch        # a ribbon from them to you
        at: target
        to: caster
      fizzle:
        type: play_cue
        cue: trickster_steal_fail
        audience: caster             # only you see it

characters:
  changeling_kit:                     # diver kit
    name: "Changeling Kit"
    playable: false                  # test-only
    weapon: RABBIT_FOOT
    stats:                           # see docs/character-stats.md
      health: 210                    # max HP
      armor: 15                      # damage taken x 100 / (100 + armor)
      base_damage: 40                # abilities deal % of this
      move_speed: 1.05               # x vanilla walking speed
      attack_speed: 1.3              # swipes per second (20 / 1.3 rounds to 15 ticks)
    passive_statuses: [ck_sucker_punch] # PASSIVE: Sucker Punch
    marks:                           # READY enemies near you (Sucker Punch would silence them): a glyph only you see
      range: 10
      unless: ck_sucker_punch_spent
      glyph: "✦"
    status_items:                    # the passive's description, in slot 9
      - status: ck_sucker_punch
        hotbar: 9
        icon: POPPED_CHORUS_FRUIT
        name: "Sucker Punch (passive)"
        description:
          - "Your first basic attack on an enemy"
          - "silences them 1s and makes them nauseous"
          - "3s, unless they hit you first. Ready again"
          - "after 8s with no damage between you."
          - "✦ marks who's ready."
    glide:                           # Trick Room: SHIFT + moving teleports you in your room
      teleport: true
      distance: 6                    # ab2.teleport_distance
      gap: 10                        # ab2.teleport_interval: 0.5s
      cue: trickster_blink           # where you left and where you arrived
    slots:
      primary: ck_primary     # LMB: Swipe
      ability_1: ck_ab1       # 1: Rough Play
      ability_2: ck_ab2       # 2: Trick Room
      ability_3: ck_ab3       # 3: Changeling
      ultimate: ck_ult        # F: Stolen Fable
