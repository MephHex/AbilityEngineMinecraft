# content: pyromancer
# The Pyromancer: fire bolts that heat her up until she can pour it all out in a beam, a fireball, a wisp that
# hunts on its own, a blue hellfire that burns her too, and a meteor out of the sky.
# Format and all options: see README.md in this folder. Edit, then /ae reload.
#
# PASSIVE (Overheat, the XP bar): every Fire Bolt that hits an enemy heats her up a stack (15 at most). 3s without
#   one and it cools down again, a stack every 0.2s. Full: RIGHT CLICK pours it out in a beam.
#
# While Hellfire Inferno lasts her flames are blue: each cue plays its "_blue" version (see variants below).

statuses:
  pyro_heat:                         # Overheat: the gauge (XP bar: the number and the bar are its stacks)
    duration: 60                     # 3s without landing a Fire Bolt...
    decay: 4                         # ...and it cools: a stack every 0.2s
    stacking: stack
    max_stacks: 15
    positive: false                  # hers alone (a tether doesn't copy it)
  pyro_burn:                         # Fireball, Hunting Wisp, Scorching Judgment: on fire
    duration: 60                     # 3s...
    stacking: refresh
    tags: [state.burning]            # looks on fire (no vanilla fire damage)
    tick:
      every: 10                      # ...2% max HP every 0.5s = 12% (ignores armor)
      effects:
        - { id: damage, max_hp: 0.02, knockback: false }
  pyro_hellfire:                     # Hellfire Inferno: faster, harder, much faster bolts, and it burns her
    duration: 120                    # 6s
    tags: [state.hellfire]           # blue flames (variants), and her hits heal her (see the abilities)
    move_speed: 1.25                 # +25%
    damage_dealt: 1.15               # +15%
    attack_speed: 3.5                # Fire Bolt every 3 ticks instead of 10 (1 tick = 50ms is the fastest there is)
    positive: false                  # double-edged: a tether doesn't copy it
    tick:
      every: 10                      # 1.5% max HP every 0.5s = 3% a second, 18% over the 6s
      effects:
        - { id: damage, max_hp: 0.015, knockback: false }

abilities:

  # PRIMARY (LMB): Fire Bolt. A bolt of fire (1.6 blocks/tick, 28 blocks): 100% base damage as magic damage. Each
  # enemy it hits heats her up (Overheat). In Hellfire Inferno it heals her 30% of the damage dealt.
  pyro_primary:
    cooldown: 10                     # (the attack_speed stat sets it)
    blocked_by: [block.ability, state.venting]   # not while she pours out the beam
    display:
      name: "Fire Bolt"
      description:
        - "A bolt of fire: 100% base magic damage."
        - "Hits heat you up (Overheat)."
    nodes:
      shoot:
        type: projectile
        speed: 1.6
        size: 0.45
        range: 28
        lifetime: 40
        visual: "block:FIRE"
        visual_size: 0.35
        trail: pyro_bolt_trail
        on: { spawned: shoot_cue, hit_entity: hit, hit_block: fizzle }
      shoot_cue:
        type: play_cue
        cue: pyro_bolt_cast
      fizzle:
        type: play_cue
        cue: pyro_bolt_fizzle
        at: hit
      hit:
        type: has_tag                # in Hellfire Inferno: it heals her
        tag: state.hellfire
        on: { has: hit_hellfire, lacks: hit_plain }
      hit_plain:
        type: apply_effects
        targets: { type: key, key: hit }
        effects:
          - { id: damage, base: 1.0, damage_type: magic, ignore_iframes: true }
        next: heat
      hit_hellfire:
        type: apply_effects
        targets: { type: key, key: hit }
        effects:
          - { id: damage, base: 1.0, damage_type: magic, ignore_iframes: true, lifesteal: 0.3 }
        next: heat
      heat:
        type: has_status             # already full?
        status: pyro_heat
        min_stacks: 15
        on: { has: keep_hot, lacks: heat_up }
      keep_hot:
        type: apply_effects          # full: it just doesn't cool down
        targets: { type: self }
        on_hit: false
        effects:
          - { id: status, status: pyro_heat }
        next: hit_cue
      heat_up:
        type: apply_effects
        targets: { type: self }
        on_hit: false
        effects:
          - { id: status, status: pyro_heat }
        next: now_full
      now_full:
        type: has_status             # that one filled it: right click is ready
        status: pyro_heat
        min_stacks: 15
        on: { has: full_cue, lacks: hit_cue }
      full_cue:
        type: play_cue
        cue: pyro_heat_full
        next: hit_cue
      hit_cue:
        type: play_cue
        cue: pyro_bolt_hit
        at: hit

  # SECONDARY (RMB, with a full gauge): Overheat. A beam of fire (20 blocks, through everyone in the line) for 3s:
  # 40% base damage every 0.2s (15 pulses) as the gauge drains. She's silenced meanwhile, and doesn't throw bolts.
  # In Hellfire Inferno it heals her 30% of the damage dealt. Not full yet: nothing happens.
  pyro_secondary:
    cooldown: 20                     # 1s after a beam
    cooldown_starts: manual          # (pressed too early: nothing spent)
    active_tags: [state.silenced, state.venting]   # the whole beam: no abilities, no Fire Bolts
    interrupted_by: [state.stunned]
    display:
      name: "Overheat"
      icon: BLAZE_POWDER
      description:
        - "Full gauge: a beam of fire for 3s,"
        - "40% base damage every 0.2s. You're"
        - "silenced meanwhile."
    nodes:
      full:
        type: has_status
        status: pyro_heat
        min_stacks: 15
        on: { has: hold, lacks: ~ }
      hold:
        type: apply_effects          # it doesn't cool down by itself while the beam drains it (60 ticks = the beam)
        targets: { type: self }
        on_hit: false
        effects:
          - { id: status, status: pyro_heat }
        next: start_cue
      start_cue:
        type: play_cue
        cue: pyro_beam_start
        next: beam
      beam:
        type: repeat                 # 15 pulses, 0.2s apart: 3s
        times: 15
        every: 4
        on: { each: pulse, out: over }
      pulse:
        type: has_tag
        tag: state.hellfire
        on: { has: burn_hellfire, lacks: burn }
      burn:
        type: apply_effects
        targets: { type: line, range: 20, width: 1.2 }
        effects:
          - { id: damage, base: 0.4, damage_type: magic, ignore_iframes: true }
        next: drain
      burn_hellfire:
        type: apply_effects
        targets: { type: line, range: 20, width: 1.2 }
        effects:
          - { id: damage, base: 0.4, damage_type: magic, ignore_iframes: true, lifesteal: 0.3 }
        next: drain
      drain:
        type: apply_effects          # a stack per pulse: empty as it ends
        targets: { type: self }
        on_hit: false
        effects:
          - { id: remove_status, status: pyro_heat, stacks: 1 }
        next: draw
      draw:
        type: play_cue
        cue: pyro_beam
        at: beam_start
        to: beam_end
      over:
        type: start_cooldown
        next: over_cue
      over_cue:
        type: play_cue
        cue: pyro_beam_end

  # 1: Fireball. A large fireball (1.1 blocks/tick, a slight drop) that explodes where it lands or on whoever it
  # hits: 160% base damage to enemies within 3.5 blocks, knocked back a little and burning (12% max HP over 3s).
  pyro_ab1:
    cooldown: 160                    # 8s
    display:
      name: "Fireball"
      icon: FIRE_CHARGE
      description:
        - "A fireball that explodes: 160% base"
        - "damage within 3.5 blocks, and they burn"
        - "(12% max HP over 3s)."
    nodes:
      throw:
        type: projectile
        speed: 1.1
        size: 0.9
        lifetime: 50                 # ~50 blocks
        visual: "block:FIRE"
        visual_size: 0.9
        trail: pyro_fireball_trail
        motion:
          - { type: gravity, amount: 0.01 }
        on: { spawned: throw_cue, hit_entity: explode, hit_block: explode }
      throw_cue:
        type: play_cue
        cue: pyro_fireball_cast
      explode:
        type: apply_effects
        targets: { type: radius, center: hit, radius: 3.5 }
        effects:
          - { id: damage, base: 1.6 }
          - { id: status, status: pyro_burn }
          - { id: knockback, from: hit, radius: 3.5, center: 0.8, edge: 0.3, lift: 0.3 }
        next: explode_cue
      explode_cue:
        type: play_cue
        cue: pyro_fireball_explode
        at: hit

  # 2: Hunting Wisp. Send a will-o'-wisp to a spot (aim preview, 25 blocks; quickcast: where you look). It waits
  # there up to 30s for an enemy to come within 7 blocks (the preview's circle; on the way there too), then hunts
  # the first one it finds (they glow while it does) and explodes on them: 140% base damage within 3 blocks, and
  # they burn. Nobody comes: it fades away.
  pyro_ab2:
    cooldown: 280                    # 14s
    targeting:
      shape: circle
      range: 25
      radius: 7                      # = how far it sees
      ground: true
    display:
      name: "Hunting Wisp"
      icon: GLOWSTONE_DUST
      description:
        - "Send a wisp to a spot: up to 30s it"
        - "waits for an enemy (7 blocks), hunts"
        - "them down (they glow) and explodes: 140%"
        - "base damage (3 blocks), and they burn."
    nodes:
      send:
        type: projectile
        speed: 0.6
        size: 0.6
        lifetime: 720                # flying there, 30s of waiting, a chase
        visual: "block:FIRE"
        visual_size: 0.5
        trail: pyro_wisp_trail
        trail_every: 2
        motion:
          # to the spot (1.2 blocks above the ground), waits 30s; an enemy within 7: after them (0.5/tick), only them
          - { type: seek, to: aim, up: 1.2, base: 0.6, hover: 600, range: 7, speed: 0.5, turn: 0.3, lock: true, mark: glowing }
        store: wisp
        on: { spawned: send_cue, hit_entity: explode, hit_block: explode, expired: fade }
      send_cue:
        type: play_cue
        cue: pyro_wisp_cast
      explode:
        type: apply_effects
        targets: { type: radius, center: hit, radius: 3 }
        effects:
          - { id: damage, base: 1.4 }
          - { id: status, status: pyro_burn }
        next: explode_cue
      explode_cue:
        type: play_cue
        cue: pyro_wisp_explode
        at: hit
      fade:
        type: play_cue
        cue: pyro_wisp_fade
        at: wisp                     # where it waited

  # 3: Hellfire Inferno. 6s of blue hellfire: 25% faster, 15% more damage, Fire Bolts every 3 ticks (about 3x as
  # fast), and Fire Bolt and the beam heal her 30% of the damage they deal. It burns her: 3% max HP a second.
  pyro_ab3:
    cooldown: 400                    # 20s
    display:
      name: "Hellfire Inferno"
      icon: SOUL_CAMPFIRE
      description:
        - "6s: blue flames, +25% speed, +15% damage,"
        - "Fire Bolts ~3x as fast; your bolts and"
        - "beam heal you 30% of their damage."
        - "It burns you: 3% max HP a second."
    nodes:
      ignite:
        type: apply_effects
        targets: { type: self }
        on_hit: false
        effects:
          - { id: status, status: pyro_hellfire }
        next: ignite_cue
      ignite_cue:
        type: play_cue
        cue: pyro_hellfire_start
        next: aura
      aura:
        type: start_cue              # blue flames around her
        cue: pyro_hellfire
        next: last
      last:
        type: delay
        ticks: 120
        boss_bar: true
        next: out_cue
      out_cue:
        type: play_cue
        cue: pyro_hellfire_end

  # ULTIMATE (F): Scorching Judgment. Mark an area (aim preview, 35 blocks, 6-block radius): everyone sees its edge
  # burning on the ground. A meteor comes down on it (~2s): 300% base damage to enemies within 6 blocks, knocked
  # back and burning. Then the ground stays scorched for 8s, the edge still showing: enemies inside take 15% base
  # damage every 0.5s and keep burning.
  pyro_ult1:
    cooldown: 1200                   # placeholder until ults charge from damage
    targeting:
      shape: circle
      range: 35
      radius: 6                      # = the meteor's and the scorched ground's (and the cue's ring: 6)
      ground: true
    display:
      name: "Scorching Judgment"
      icon: MAGMA_BLOCK
      description:
        - "Mark an area: a meteor crashes down"
        - "(~2s): 300% base damage (6 blocks). The"
        - "ground burns 8s: 15% base damage every"
        - "0.5s to enemies inside."
    nodes:
      mark:
        type: play_cue
        cue: pyro_judgment_cast
        next: split
      split:
        type: fork                   # the warning ring, and the meteor
        on: { out: warn, also: incoming }
      warn:
        type: repeat                 # the edge, until it lands (9 x 0.25s)
        times: 9
        every: 5
        on: { each: ring, out: ~ }
      ring:
        type: play_cue
        cue: pyro_judgment_ring
        at: aim
      incoming:
        type: play_cue
        cue: pyro_meteor_fall
        at: aim
        next: meteor
      meteor:
        type: projectile             # out of the sky: 28 blocks up, 10 back toward her, at the spot (~42 ticks)
        from: aim
        up: 28
        back: 10
        toward: aim
        speed: 0.7
        size: 1.5
        lifetime: 80
        visual: "block:MAGMA_BLOCK"
        visual_size: 2.2
        trail: pyro_meteor_trail
        on: { hit_entity: impact, hit_block: impact, expired: impact }
      impact:
        type: apply_effects          # wherever it touched down first: the blast is on the marked spot
        targets: { type: radius, center: aim, radius: 6 }
        effects:
          - { id: damage, base: 3.0 }
          - { id: status, status: pyro_burn }
          - { id: knockback, from: aim, radius: 6, center: 1.2, edge: 0.4, lift: 0.5 }
        next: impact_cue
      impact_cue:
        type: play_cue
        cue: pyro_meteor_impact
        at: aim
        next: scorch
      scorch:
        type: repeat                 # scorched ground: 16 x 0.5s = 8s
        times: 16
        every: 10
        on: { each: scorch_hit, out: ~ }
      scorch_hit:
        type: apply_effects
        targets: { type: radius, center: aim, radius: 6 }
        effects:
          - { id: damage, base: 0.15, knockback: false }
          - { id: status, status: pyro_burn }
        next: scorch_cue
      scorch_cue:
        type: play_cue
        cue: pyro_scorched
        at: aim
        next: scorch_ring
      scorch_ring:
        type: play_cue
        cue: pyro_judgment_ring
        at: aim

characters:
  pyromancer:
    name: "Pyromancer"
    weapon: BLAZE_ROD
    stats:                           # see docs/character-stats.md
      health: 180                    # max HP
      armor: 0                       # damage taken x 100 / (100 + armor)
      base_damage: 30                # abilities deal % of this
      move_speed: 1.0                # x vanilla walking speed
      attack_speed: 2.0              # Fire Bolts per second
    status_bar: { status: pyro_heat, fill: stacks }   # XP bar: Overheat, the number and the bar its stacks (15 = full)
    variants:
      - while: state.hellfire        # Hellfire Inferno: blue flames instead of orange ones
        cue_suffix: _blue            # every pyro_x cue plays as pyro_x_blue
        visuals: { "block:FIRE": "block:SOUL_FIRE" }   # and her fire bolts, fireballs and wisps are soul fire
    slots:
      primary: pyro_primary          # LMB: Fire Bolt
      secondary: pyro_secondary      # RMB: Overheat's beam (full gauge)
      ability_1: pyro_ab1            # 1: Fireball
      ability_2: pyro_ab2            # 2: Hunting Wisp
      ability_3: pyro_ab3            # 3: Hellfire Inferno
      ultimate: pyro_ult1            # F: Scorching Judgment
