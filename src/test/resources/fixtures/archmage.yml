# content: fixture_archmage
# The Archmage: primary Arcane Bolt, RMB Arcane Focus, 1 Arcane Missile, 2 Foldstep, 3 Unstable Binding.
# Format and all options: see README.md in this folder. Edit, then /ae reload.

statuses:
  barrage_charges:                   # Arcane Barrage: shots left (the XP bar number during the ultimate)
    duration: 0                      # until used (the ultimate clears leftovers when it starts)
    stacking: stack
    max_stacks: 5                    # 3, plus up to 2 from eliminations
    tags: [state.barrage_charged]

abilities:

  # Primary fire (LMB after the input rework; right click in the test kit for now).
  arcane_bolt:
    cooldown: 16                     # 0.8s between shots
    blocked_by: [block.ability, state.guiding]   # can't fire while guiding (Arcane Focus)
    display:
      name: "Arcane Bolt"
      icon: AMETHYST_SHARD
      description: ["Fast arcane bolt, small burst on impact.", "Shatters your Unstable Binding."]
    nodes:
      fire:
        type: projectile
        speed: 2.0
        size: 0.4
        range: 30                    # blocks it may fly UNGUIDED; guided distance doesn't count
        lifetime: 120                # hard cap: 6s no matter what
        visual: AMETHYST_SHARD
        on: { hit_entity: burst, hit_block: burst }
      burst:
        type: apply_effects
        targets: { type: radius, center: hit, radius: 1.5 }
        effects:
          - { id: damage, amount: 30 }
        next: burst_cue
      burst_cue:
        type: play_cue
        cue: spark
        at: hit

  # Passive / RMB: hold right click to steer your latest Arcane Bolt toward your crosshair.
  # Costs Focus fast (40/s: ~2.5s from full); Focus refills slowly (12/s after 1s, see the kit).
  # While guided, the bolt's 30-block range is paused; release and it resumes where it left off.
  # You're slowed and can't fire while guiding. No bolt in flight = nothing happens, nothing spent.
  arcane_focus:
    display:
      name: "Arcane Focus"
      icon: LAPIS_LAZULI
      description: ["Hold RMB: steer your last Arcane Bolt.", "Drains Focus. Guided bolts fly further."]
    mode: { type: hold, period: 1, release: 6, ammo: focus, ammo_per_pulse: 2, while_projectile: arcane_bolt }
    active_tags: [state.guiding, state.slowed]
    nodes:
      steer:
        type: steer_projectile
        ability: arcane_bolt           # your most recent bolt that's still flying
        turn: 0.25                     # 0..1, how hard it turns toward the crosshair per tick

  # Slow missile; recast to steer it at your crosshair. Empowered: stun + Glowing + explosion.
  arcane_missile:
    cooldown: 240
    display:
      name: "Arcane Missile"
      icon: ECHO_SHARD
      description: ["Slow missile. Recast: steer it to your", "crosshair; it accelerates, stuns and", "reveals its target, then explodes."]
    nodes:
      fire:
        type: projectile
        store: missile
        speed: 0.45
        size: 0.7
        lifetime: 100
        visual: PRISMARINE_CRYSTALS
        on: { spawned: wait_recast, hit_entity: on_hit, hit_block: on_block }
      wait_recast:
        type: await_recast
        window: 80
        while: missile
        on: { recast: empower }
      empower:
        type: set
        key: phase
        value: empowered             # Unstable Binding reads this when the missile strikes it
        next: steer
      steer:
        type: redirect_projectile
        projectile: missile
        toward: cursor
        speed: 0.8
        motion:
          - { type: accelerate, amount: 0.12, max: 2.5 }
        next: steer_cue
      steer_cue:
        type: play_cue
        cue: cast
      on_hit:
        type: switch
        key: phase
        on: { empowered: stun_target, default: plain_hit }
      plain_hit:
        type: apply_effects
        on_hit: true                 # buffs apply to the target hit
        targets: { type: key, key: hit }
        effects:
          - { id: damage, amount: 25 }
      stun_target:
        type: apply_effects
        on_hit: true                 # buffs apply to the main target (not again via the explosion)
        targets: { type: key, key: hit }
        effects:
          - { id: status, status: stun, duration: 12 }
          - { id: status, status: glowing, duration: 60 }
        next: explode
      on_block:
        type: switch
        key: phase
        on: { empowered: explode }
      explode:
        type: apply_effects
        targets: { type: radius, center: hit, radius: 3 }
        effects:
          - { id: damage, amount: 50 }
        next: explode_cue
      explode_cue:
        type: play_cue
        cue: impact
        at: hit

  # ---- Foldstep: aimed, channeled blink ---------------------------------------------
  #  Press: a preview circle follows your crosshair (only you see it). Left click confirms,
  #  right click cancels. Nothing is spent until you confirm. Always lands on the ground straight
  #  below your crosshair; the preview sits on that spot.
  #  Then: 0.5s channel (rooted, no other abilities, XP bar fills), then teleport.
  #  Stun or silence during the channel cancels it (the cooldown is still spent).
  foldstep:
    cooldown: 180
    movement: true                   # a blink: not while rooted (dashes count automatically)
    display:
      name: "Foldstep"
      icon: ENDER_PEARL
      description:
        - "Aim, then channel 0.5s (rooted) and"
        - "teleport there, up to 12 blocks."
    targeting:
      shape: circle                  # circle | line | cone | point
      range: 12                      # the confirmed spot arrives as "aim"
      radius: 0.6                    # size of the preview
      ground: true                   # lands on the ground straight below where you aim, at most
                                     # 6 blocks below your feet (default max_drop). Deeper (off a
                                     # cliff): you land on the cliff edge instead. Entities are ignored.
    # Held for the whole cast: root + no other abilities.
    active_tags: [state.casting, block.move, block.ability]
    # Use the state.* tags here, NOT block.ability: tags are reference-counted, so while the
    # cast itself holds block.ability, a stun adding it again doesn't count as "newly added".
    interrupted_by: [state.stunned, state.silenced]
    nodes:
      mark:
        type: play_cue
        cue: teleport
        at: aim                      # shows enemies where you're going
        next: channel
      channel:
        type: delay
        ticks: 10                    # 0.5s
        cast_bar: true               # fills the XP bar while you wait
        next: blink
      blink:
        type: apply_effects
        targets: { type: self }
        effects:
          - { id: teleport, to: aim, ground: true }
        next: arrive
      arrive:
        type: play_cue
        cue: teleport

  # =====================================================================================
  #  ARCHMAGE
  #  Arcane magic binds fae energy in geometric shapes; when the shape breaks, the energy is
  #  released. Visuals are placeholders until the geometry models exist.
  # =====================================================================================

  # Place unstable geometry. It shatters on its own after 3s (damage + knockback, stronger near
  # the centre). Enemies can break it harmlessly during the first 1.5s.
  # Your Arcane Bolt shatters it early; your RECAST Arcane Missile shatters it with stun + Glowing
  # on everyone in range. Neither of those abilities needs to know about it: whatever hits the
  # geometry is recorded (struck_by = ability id, struck_phase = that shot's phase) and this
  # ability decides what it means.
  unstable_binding:
    cooldown: 280
    display:
      name: "Unstable Binding"
      icon: AMETHYST_CLUSTER
      description:
        - "Place unstable geometry. Shatters after 3s:"
        - "damage + knockback. Enemies can break it"
        - "in the first 1.5s. Your Bolt shatters it;"
        - "your recast Missile makes it stun."
    targeting: { shape: circle, range: 20, radius: 3.5, ground: true }   # preview = blast radius;
                                     # like every ground ability: max 6 below your feet, else the cliff edge
    nodes:
      place:
        type: construct
        store: binding               # centre of the geometry, used as the blast centre
        height: 1.0                  # floats 1 block above the ground
        size: 0.8                    # hitbox radius
        fragile: 30                  # enemies can break it for 1.5s (raise it to test breaking)
        fuse: 60                     # shatters by itself after 3s
        visual: AMETHYST_CLUSTER
        on: { fuse: shatter, struck: what_struck, broken: fizzle }
      what_struck:
        type: switch
        key: struck_by               # which of YOUR abilities hit it
        on: { arcane_missile: missile_strike, default: shatter }
      missile_strike:
        type: switch
        key: struck_phase
        on: { empowered: stun_shatter, default: shatter }
      shatter:
        type: apply_effects
        targets: { type: radius, center: binding, radius: 3.5 }
        effects:
          - { id: damage, amount: 30 }
          - { id: knockback, from: binding, radius: 3.5, center: 1.4, edge: 0.4, lift: 0.35 }
        next: shatter_cue
      shatter_cue:
        type: play_cue
        cue: shatter
        at: binding
      stun_shatter:
        type: apply_effects
        on_hit: true                 # the recast Missile's shatter carries your buffs to everyone caught
        targets: { type: radius, center: binding, radius: 3.5 }
        effects:
          - { id: damage, amount: 30 }
          - { id: knockback, from: binding, radius: 3.5, center: 1.4, edge: 0.4, lift: 0.35 }
          - { id: status, status: stun, duration: 10 }
          - { id: status, status: glowing, duration: 60 }
        next: stun_cue
      stun_cue:
        type: play_cue
        cue: shatter_stun
        at: binding
      fizzle:
        type: play_cue
        cue: fizzle
        at: binding

  # =====================================================================================
  #  DIVER
  # =====================================================================================

  # ULTIMATE (F): Arcane Barrage. Rise into the air and fly for 12s (a boss bar counts it down) with 3
  # shots; each elimination gives one more (up to 2 more). Your weapon becomes a spyglass and your
  # primary fire becomes Arcane Barrage (below). It ends when the time or the shots run out.
  arcanist_ult1:
    cooldown: 900                    # placeholder until ults charge from damage
    display:
      name: "Arcane Barrage"
      icon: NETHER_STAR
      description:
        - "Rise and fly for 12s with 3 shots of"
        - "Arcane Barrage (hold RMB: zoom and charge)."
        - "Eliminations: +1 shot (up to 2)."
    active_tags: [state.barrage, state.flying]   # the whole ultimate: flight, and the spyglass kit (see forms)
    movement: false                  # charging a shot roots you: that mustn't end the ultimate...
    blocked_by: [block.ability, block.move]   # ...but you can't START it while rooted
    nodes:
      rise_cue:
        type: play_cue
        cue: barrage_rise
        next: rise
      rise:
        type: leap
        direction: up
        up: 1.0                      # ~6 blocks up
        until: apex
        next: arm
      arm:
        type: apply_effects
        targets: { type: self }
        effects:
          - { id: remove_status, status: barrage_charges }   # nothing left over from last time
          - { id: status, status: barrage_charges }          # +1...
          - { id: status, status: barrage_charges }          # +1...
          - { id: status, status: barrage_charges }          # +1 = 3 shots
        next: split
      split:
        type: fork                   # the timer and the kill rewards run side by side
        on: { out: last, also: bounty }
      last:
        type: delay
        ticks: 240                   # 12s
        boss_bar: true
        next: unused
      unused:
        type: apply_effects          # time's up: shots you didn't fire are gone
        targets: { type: self }
        effects:
          - { id: remove_status, status: barrage_charges }
        next: over
      over:
        type: end_cast               # (also stops waiting for kills)
      bounty:
        type: await_kill             # an elimination: +1 shot...
        on: { kill: reward }
      reward:
        type: apply_effects
        targets: { type: self }
        effects:
          - { id: status, status: barrage_charges }
        next: reward_cue
      reward_cue:
        type: play_cue
        cue: barrage_reload
        next: bounty_2
      bounty_2:
        type: await_kill             # ...and one more for a second one (then no more)
        on: { kill: reward_2 }
      reward_2:
        type: apply_effects
        targets: { type: self }
        effects:
          - { id: status, status: barrage_charges }
        next: reward_2_cue
      reward_2_cue:
        type: play_cue
        cue: barrage_reload

  # Arcane Barrage's shot: the primary fire DURING the ultimate (the spyglass). Hold RMB: zoom in and
  # charge (you can't move or use abilities meanwhile); let go, or reach full charge, to fire a very fast
  # bolt. On a player (or mob): massive damage, no explosion. On terrain: it explodes. The damage grows
  # with the charge (40% when let go at once). The last shot ends the ultimate.
  arcanist_barrage:
    cooldown: 20                     # 1s to load the next shot, counted from when a shot FIRES
    cooldown_starts: manual          # (at "fired" below: a cooldown while charging would end the zoom)
    display:
      name: "Arcane Barrage"
      icon: SPYGLASS
      description:
        - "Hold RMB: zoom in and charge (you can't"
        - "move). Let go or fully charged: fire."
        - "Direct hit: up to 220 damage."
        - "Terrain: explodes, up to 90 around it."
    active_tags: [state.charging, block.move, block.ability]   # while charging (released when it fires)
    nodes:
      loaded:
        type: has_tag                # any shots left?
        tag: state.barrage_charged
        on: { has: charge }          # none: nothing happens
      charge:
        type: charge
        ticks: 50                    # 2.5s to full power (the XP bar fills, level 0)
        from: 0.4                    # let go at the minimum: ~50% power
        min: 10                      # let go before 0.5s: no shot (see "early")
        fire_when_full: false        # full: it waits for you to let go
        store: power
        on: { out: still_loaded, early: fizzle }
      fizzle:
        type: play_cue               # not charged enough: nothing fired, nothing spent
        cue: fizzle
      still_loaded:
        type: has_tag                # the ultimate ran out while charging: no shot
        tag: state.barrage_charged
        on: { has: steady }
      steady:
        type: release_tags           # fired: move again
        next: fired
      fired:
        type: start_cooldown         # 1s until the next one can charge
        next: shoot
      shoot:
        type: projectile
        speed: 4.0                   # very fast, but a real projectile: it travels (not hitscan)
        size: 0.3
        range: 120
        lifetime: 40
        visual: END_ROD
        on: { spawned: spend, hit_entity: snipe, hit_block: blast }
      spend:
        type: apply_effects
        targets: { type: self }
        effects:
          - { id: remove_status, status: barrage_charges, stacks: 1 }   # one shot used
        next: shot_cue
      shot_cue:
        type: play_cue
        cue: barrage_shot
        next: any_left
      any_left:
        type: has_tag
        tag: state.barrage_charged
        on: { lacks: out_of_shots }
      out_of_shots:
        type: cancel_ability         # that was the last one: the ultimate ends
        ability: arcanist_ult1
      snipe:
        type: apply_effects          # a direct hit: no explosion, just a lot of damage
        targets: { type: key, key: hit }
        effects:
          - { id: damage, amount: 220, scale_by: power }
        next: snipe_cue
      snipe_cue:
        type: play_cue
        cue: barrage_hit
        at: hit
      blast:
        type: apply_effects          # terrain: explodes
        targets: { type: radius, center: hit, radius: 3.5 }
        effects:
          - { id: damage, amount: 90, scale_by: power }
          - { id: knockback, from: hit, radius: 3.5, center: 1.0, edge: 0.3, lift: 0.4 }
        next: blast_cue
      blast_cue:
        type: play_cue
        cue: barrage_blast
        at: hit

characters:
  archmage:
    name: "Archmage"
    weapon: BREEZE_ROD
    resources:
      focus:
        max: 100
        regen: 12                    # per second...
        delay: 20                    # ...after 1s without spending
        hotbar: 9                    # shown in slot 9: stack size = Focus (Minecraft caps stacks at 99)
        icon: LAPIS_LAZULI
    slots:
      primary: arcane_bolt           # LMB
      secondary: arcane_focus        # hold RMB to guide the bolt
      ability_1: arcane_missile      # 1, press 1 again to recast
      ability_2: foldstep            # 2, left click to confirm
      ability_3: unstable_binding    # 3, left click to place
      ultimate: arcanist_ult1        # F: Arcane Barrage
    forms:
      - while: state.barrage         # during Arcane Barrage:
        weapon: SPYGLASS             # hold RMB to zoom in and charge a shot (LMB does nothing)
        slots: { primary: arcanist_barrage }
        status_bar: barrage_charges  # XP bar: shots left (level 0 and filling while charging one)
