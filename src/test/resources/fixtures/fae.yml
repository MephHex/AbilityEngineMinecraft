# content: fae
# The Fae: a small fae sitting in a spore blossom. Throws blossoms and seeds that latch onto friend and foe,
# perches on an ally's head to empower them, and hides poison traps.
# Format and all options: see README.md in this folder. Edit, then /ae reload.
#
# She sits in her blossom (just the look: she walks as usual). Her first passive is still to come.
# PASSIVE 2 (Spore Burst, hotbar slot 9): the next enemy hit that lands on her puffs spores that knock back
#   enemies within 4 blocks. Ready again 10s later, or after 4s out of combat.
#
# ULTIMATE (F): Wild Hunt. 8s of free flight (no height limit). Press F again to shoot a vine (20 blocks): if it
#   catches an enemy it latches on, stunning them for 3.5s and tethering them to you: fly off and drag them along.

statuses:
  fae_blessing:                      # an ally the Fae is perched on: faster, and basic attacks hit harder
    duration: 0                      # while she sits there (the ride takes it off)
    move_speed: 1.2                  # +20%
    tags: [buff.fae_blessing]
    on_hit:
      - { id: damage, amount: 20 }   # +2 HP on every basic attack
  fae_perched:                       # the Fae, in her blossom on an ally's head: untouchable (the ally she sits
    duration: 0                      # on doesn't see her: she'd be in their way; everyone else does)
    tags: [state.untargetable]       # abilities pass through her
    damage_taken: 0                  # and nothing else hurts her either
    positive: false
  fae_gust:                          # recast while perched: a burst of speed for the ally
    duration: 40                     # 2s
    move_speed: 1.35                 # +35% (on top of the blessing)
    tags: [buff.fae_gust]
  fae_toxin:                         # Deathcap Snare: poisoned, slowed and nauseous
    duration: 80                     # 4s...
    stacking: refresh
    move_speed: 0.65                 # -35%
    tags: [state.poisoned, state.poison_hearts, state.nauseous]   # poison_hearts: vanilla's green hearts
    tick:
      every: 20                      # ...2% max HP a second = 8% (ignores armor)
      effects:
        - { id: damage, max_hp: 0.02, knockback: false }
  fae_wings:                         # Wild Hunt: free flight, no height limit
    duration: 160                    # 8s
    stacking: refresh
    tags: [state.flying]
    positive: false
  fae_dragging:                      # Wild Hunt: someone's on the vine (the ult doesn't end under them)
    duration: 80
    positive: false

abilities:

  # PRIMARY (LMB): Blossom Shot. A small blossom (1.1 blocks/tick, a slight drop) that bursts where it lands
  # or on whoever it hits: 90% base damage to enemies within 2.2 blocks.
  fae_primary:
    cooldown: 14                     # (the attack_speed stat sets it)
    display:
      name: "Blossom Shot"
      description:
        - "A blossom that bursts on impact:"
        - "90% base damage within 2.2 blocks."
    nodes:
      shoot:
        type: projectile
        speed: 1.1
        size: 0.4
        lifetime: 22                 # ~24 blocks
        visual: "upside_down:SPORE_BLOSSOM"   # facing up, open
        motion:
          - { type: gravity, amount: 0.015 }
        on: { spawned: shoot_cue, hit_entity: burst, hit_block: burst }
      shoot_cue:
        type: play_cue
        cue: fae_blossom_shot
      burst:
        type: apply_effects
        targets: { type: radius, center: hit, radius: 2.2 }
        effects:
          - { id: damage, base: 0.9 }
        next: burst_cue
      burst_cue:
        type: play_cue
        cue: fae_blossom_burst
        at: hit

  # PASSIVE (the ward below casts it): Spore Burst. Enemies within 4 blocks are knocked away.
  fae_spore_burst:
    blocked_by: []                   # a passive: goes off even while stunned
    display:
      name: "Spore Burst"
    nodes:
      burst:
        type: apply_effects
        targets: { type: radius, radius: 4 }
        on_hit: false
        effects:
          - { id: knockback, from: caster, radius: 4, center: 1.3, edge: 0.6, lift: 0.4 }
        next: burst_cue
      burst_cue:
        type: play_cue
        cue: fae_spore_burst

  # 1: Seed Bomb (3 charges, 8s each). A seed that latches onto whoever it hits, friend or foe; landing, it
  # lies there for 15s (3 at most) and latches onto the first one to come near (1.3 blocks), friend, foe or her.
  # Latched for 2s, then: an ENEMY's seed bursts, 110% base damage to enemies within 3.5 blocks; an ALLY's
  # blooms, healing allies within 3.5 blocks (her too) 5 HP. An enemy's seed also sets off her Deathcap Snares
  # within 3 blocks of them (a trap's blast reaches 3 blocks: it reaches them). It goes on if she dies meanwhile.
  fae_ab1:
    cooldown: 160                    # 8s per charge
    charges: 3
    survives_death: true
    display:
      name: "Seed Bomb"
      icon: PITCHER_POD
      description:
        - "3 charges. A seed that latches onto friend,"
        - "foe or you; on the ground it waits 15s."
        - "2s later: an enemy's bursts (110% base"
        - "dmg, 3.5 blocks), an ally's heals 5 HP."
    nodes:
      throw:
        type: projectile
        speed: 1.2
        size: 0.5
        lifetime: 60
        visual: CONDUIT
        hits_allies: true            # latches onto allies too
        motion:
          - { type: gravity, amount: 0.05 }
        on: { spawned: throw_cue, hit_entity: whose, hit_block: plant }
      throw_cue:
        type: play_cue
        cue: fae_seed_throw
      plant:
        type: construct              # lies there until someone comes near
        at: hit
        height: 0
        size: 0.5
        fuse: 300                    # 15s
        trigger: 1.3
        triggered_by: everyone       # friend, foe or her
        arm: 10
        solid: false
        limit: 3
        visual: "block:firefly_bush"
        cue: fae_seed_idle           # a green shimmer and a leaf now and then while it lies there
        cue_every: 8
        on: { triggered: whose, fuse: wilt }
      wilt:
        type: play_cue
        cue: fae_seed_wilt
        at: construct
      whose:
        type: is_ally
        target: hit
        on: { ally: latch_ally, enemy: latch_enemy }
      latch_enemy:
        type: start_cue
        cue: fae_seed_latched
        at: hit
        next: fuse_enemy
      fuse_enemy:
        type: delay
        ticks: 40                    # 2s
        next: burst
      burst:
        type: apply_effects
        targets: { type: radius, center: hit, radius: 3.5 }
        effects:
          - { id: damage, base: 1.1 }
        next: chain
      chain:
        type: set_off_constructs     # her Deathcap Snares near them go off too
        ability: fae_ab3
        center: hit
        radius: 3                    # = a trap's blast: every trap it sets off reaches them
        next: burst_cue
      burst_cue:
        type: play_cue
        cue: fae_seed_burst
        at: hit
        next: end
      latch_ally:
        type: start_cue
        cue: fae_seed_latched_ally
        at: hit
        next: fuse_ally
      fuse_ally:
        type: delay
        ticks: 40
        next: bloom
      bloom:
        type: apply_effects
        targets: { type: radius, center: hit, radius: 3.5, include_caster: true }
        affects: allies
        on_hit: false
        effects:
          - { id: heal, amount: 50 }
        next: bloom_cue
      bloom_cue:
        type: play_cue
        cue: fae_seed_bloom
        at: hit
        next: end
      end:
        type: end_cast               # the seed is gone: so is its looping cue

  # 2: Perch. Fly to an ally in your sights (20 blocks, a forgiving aim; you can be hit on the way) and sit in
  # your blossom on their head: you go where they go, untouchable (abilities pass through you, nothing hurts you).
  # They don't see you (you'd be in their way), everyone else does; your hunger bar shows their hearts.
  # They're 20% faster
  # and their basic attacks deal +2 HP. The cooldown (5s) starts as you sit down. Press 2 again once it's
  # over: a gust, +35% speed for them for 2s; aim at ANOTHER ally instead and you fly over to them (vulnerable
  # again on the way). Either one starts the cooldown again. Press SHIFT to hop off. It ends too when they die.
  fae_ab2:
    cooldown: 100                    # 5s
    cooldown_starts: manual          # as she sits down (never reaching anyone: as it ends)
    display:
      name: "Perch"
      icon: PINK_PETALS
      description:
        - "Fly onto an ally's head (20 blocks):"
        - "untouchable; they're 20% faster, +2 HP"
        - "per basic attack. Again (off cooldown): gust"
        - "(+35% speed) or fly to another ally."
        - "Shift: hop off."
    nodes:
      pick:
        type: acquire_target
        query: { type: hitscan, range: 20, ray_size: 1.2, targets: allies }   # a thick ray: easy to pick them
        on: { hit: flit, miss: ~ }
      flit:
        type: play_cue
        cue: fae_flit
        next: fly
      fly:
        type: dash                   # after them, wherever they go
        to: target
        follow: true
        speed: 1.1
        range: 40
        radius: 0.3
        on: { hit: perch, miss: lost }
      perch:
        type: mount
        target: target
        status: fae_blessing
        self_status: fae_perched
        on: { out: perch_cue, none: lost, off: fell }
      perch_cue:
        type: play_cue
        cue: fae_perch
        at: mount
        next: sat
      sat:
        type: start_cooldown         # sitting down: the full cooldown, every time (another ally too)
        restart: true
        next: listen
      listen:
        type: await_recast           # while perched, 2 again (hopping off is SHIFT: the ride's "off")
        window: 6000
        on: { recast: ready, timeout: listen }
      ready:
        type: on_cooldown            # recasting waits for the cooldown: no spamming
        on: { ready: tap, cooling: listen }
      tap:
        type: acquire_target
        query: { type: hitscan, range: 20, ray_size: 1.2, targets: allies }   # a thick ray: easy to pick them
        store: other
        on: { hit: which, miss: gust }
      which:
        type: has_status             # aiming at the one you're on: a gust
        status: fae_blessing
        target: other
        mine: true
        on: { has: gust, lacks: hop }
      gust:
        type: apply_effects
        targets: { type: key, key: mount }
        affects: allies
        on_hit: false
        effects:
          - { id: status, status: fae_gust }
        next: gust_cue
      gust_cue:
        type: play_cue
        cue: fae_gust
        at: mount
        next: gusted
      gusted:
        type: start_cooldown         # a gust: the full cooldown again too
        restart: true
        next: listen
      hop:
        type: dismount               # off this one (vulnerable on the way)...
        next: hop_cue
      hop_cue:
        type: play_cue
        cue: fae_flit
        next: fly_on
      fly_on:
        type: dash                   # ...over to the other
        to: other
        follow: true
        speed: 1.1
        range: 40
        radius: 0.3
        on: { hit: perch_on, miss: lost }
      perch_on:
        type: mount
        target: other
        status: fae_blessing
        self_status: fae_perched
        on: { out: perch_cue, none: lost, off: fell }
      fell:                          # off (she pressed SHIFT, they died, the game took her off)
        type: play_cue
        cue: fae_unperch
        next: done
      lost:
        type: play_cue
        cue: fae_unperch
        next: done
      done:
        type: start_cooldown
        next: end
      end:
        type: end_cast

  # 3: Deathcap Snare. Throw a toadstool; where it lands it hides a trap (2 min, 20 at most) that enemies can't
  # see. Armed after 1s, the first enemy within 1.4 blocks springs it: enemies within 3 blocks take 100% base
  # damage and are poisoned (8% max HP over 4s), 35% slower and nauseous for 4s. Thrown straight at an enemy,
  # it springs on them at once; thrown at one of her traps, it bounces off it. A Seed Bomb bursting on an enemy
  # within 3 blocks sets it off too. Traps stay if she dies.
  fae_ab3:
    cooldown: 240                    # 12s
    survives_death: true
    display:
      name: "Deathcap Snare"
      icon: Warped_fungus
      description:
        - "A hidden trap where it lands (2 min, 20 max)."
        - "Springs on an enemy: 100% base dmg (3"
        - "blocks), poison (8% max HP), 35% slow"
        - "and nausea for 4s. A Seed Bomb bursting"
        - "near it sets it off."
    nodes:
      throw:
        type: projectile
        speed: 0.8
        size: 0.4
        lifetime: 60
        visual: "block:Warped_fungus"
        bounce_off_own: true         # glances off her traps already planted
        motion:
          - { type: gravity, amount: 0.06 }
        on: { spawned: throw_cue, hit_entity: spring, hit_block: plant }
      throw_cue:
        type: play_cue
        cue: fae_trap_throw
      plant:
        type: construct
        at: hit
        height: 0.1
        size: 0.5
        fuse: 2400                   # 2 min
        trigger: 1.4
        arm: 20                      # 1s
        solid: false
        hidden: true                 # enemies can't see it
        limit: 20
        visual: "block:Warped_fungus"
        on: { triggered: trap_spring, fuse: wilt }
      wilt:
        type: play_cue
        cue: fae_trap_wilt
        at: construct
      trap_spring:                   # set off (stepped near, or a Seed Bomb): it bursts where it stands
        type: apply_effects
        targets: { type: radius, center: construct, radius: 3 }
        effects:
          - { id: damage, base: 1.0 }
          - { id: status, status: fae_toxin }
        next: trap_spring_cue
      trap_spring_cue:
        type: play_cue
        cue: fae_trap_spring
        at: construct
      spring:                        # thrown straight at an enemy: it bursts on them
        type: apply_effects
        targets: { type: radius, center: hit, radius: 3 }
        effects:
          - { id: damage, base: 1.0 }
          - { id: status, status: fae_toxin }
        next: spring_cue
      spring_cue:
        type: play_cue
        cue: fae_trap_spring
        at: hit

  # ULTIMATE (F): Wild Hunt. 8s of free flight, no height limit (it ends a perch). Press F again: a vine
  # shoots out (a skillshot, 20 blocks, a small hitbox). If it catches an enemy it latches on, stunning them for
  # 3.5s and tethering them to you (4 blocks of slack): fly off and drag them along, up into the air if you
  # like. Missing doesn't end it: shoot again while the flight lasts. The cooldown starts at the first shot
  # (or after the 8s).
  fae_ult1:
    cooldown: 1200                   # placeholder until ults charge from damage
    display:
      name: "Wild Hunt"
      icon: VINE
      description:
        - "8s of free flight. F again: shoot a vine"
        - "(20 blocks). It catches an enemy: stun"
        - "them 3.5s and drag them along."
    nodes:
      leave:
        type: cancel_ability         # off any ally's head first
        ability: fae_ab2
        next: wings
      wings:
        type: apply_effects
        targets: { type: self }
        on_hit: false
        effects:
          - { id: status, status: fae_wings }
        next: wings_cue
      wings_cue:
        type: play_cue
        cue: fae_wings
        next: split
      split:
        type: fork                   # waiting for F, and the flight's 8s
        on: { out: pick, also: limit }
      limit:
        type: delay
        ticks: 160
        next: limit_check
      limit_check:
        type: has_status             # not while someone's on the vine
        status: fae_dragging
        on: { has: ~, lacks: over }
      pick:
        type: await_recast
        window: 160
        on: { recast: shoot, timeout: over }
      shoot:
        type: projectile             # the vine: a skillshot
        speed: 1.6
        size: 0.8                    # a small hitbox: aim it
        visual_size: 0.9
        range: 20
        lifetime: 20
        visual: VINE
        face_flight: true
        on: { spawned: shoot_cue, hit_entity: latch, hit_block: pick, expired: pick }   # missed: shoot again
      shoot_cue:
        type: play_cue
        cue: fae_vine_shot
      latch:
        type: apply_effects
        targets: { type: key, key: hit }
        effects:
          - { id: status, status: stun, duration: 70 }   # 3.5s
        next: dragging
      dragging:
        type: apply_effects
        targets: { type: self }
        on_hit: false
        effects:
          - { id: status, status: fae_wings, duration: 80 }   # flight lasts at least as long as the drag
          - { id: status, status: fae_dragging }
        next: latch_cue
      latch_cue:
        type: play_cue
        cue: fae_latch
        at: hit
        next: drag
      drag:
        type: leash
        target: hit
        length: 4                    # slack: closer than this, they just dangle
        duration: 70
        pull: 0.4
        max_speed: 1.6
        cue: fae_vine
        on: { out: release, broken: release }
      release:
        type: apply_effects
        targets: { type: self }
        on_hit: false
        effects:
          - { id: remove_status, status: fae_dragging }
        next: release_cue
      release_cue:
        type: play_cue
        cue: fae_release
        at: hit
        next: over
      over:
        type: end_cast

characters:
  fae:
    name: "Fae"
    weapon: MANGROVE_PROPAGULE
    stats:                           # see docs/character-stats.md
      health: 160                    # max HP
      armor: 5                       # damage taken x 100 / (100 + armor)
      base_damage: 35                # abilities deal % of this
      move_speed: 1.0                # x vanilla walking speed
      attack_speed: 1.5              # blossoms per second
      scale: 0.5                     # small (model and hitbox)
    hover:                           # no hover (no height): just what she sits in
      visual: SPORE_BLOSSOM          # the blossom, upside down, she sits in its cup
      # its size, x the default (1.0: as wide as she is; its petals reach 0.4 of that up and spread 1.75x)
      visual_size: 1.5
    ward:                            # PASSIVE: Spore Burst
      name: "Spore Burst"
      cast: fae_spore_burst          # the next enemy hit on her...
      cooldown: 200                  # ...then 10s
      out_of_combat: 80              # (or 4s out of combat)
      hotbar: 9
      icon: BROWN_MUSHROOM
      description:
        - "When an enemy hits you, spores knock"
        - "back enemies within 4 blocks. Ready again"
        - "10s later, or after 4s out of combat."
    slots:
      primary: fae_primary           # LMB: Blossom Shot (no RMB)
      ability_1: fae_ab1             # 1: Seed Bomb (3 charges)
      ability_2: fae_ab2             # 2: Perch (again: gust / another ally; shift: hop off)
      ability_3: fae_ab3             # 3: Deathcap Snare
      ultimate: fae_ult1             # F: Wild Hunt
